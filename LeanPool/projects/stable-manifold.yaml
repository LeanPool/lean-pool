slug: stable-manifold
title: The stable manifold theorem for hyperbolic fixed points
summary: Uses a Lyapunov–Perron operator on bounded sequences to prove the smooth
  local stable and unstable graph theorem for finite-dimensional real dynamics.
  The development identifies the linear stable and unstable subspaces by
  factoring the characteristic polynomial, proves exponential estimates in
  the two directions, and proves regularity of the Lyapunov–Perron graph.
  The stable graph construction also applies to
  noninvertible maps when the stable and unstable subspaces are complementary.
