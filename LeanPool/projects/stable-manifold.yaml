main_results:
- declaration: Function.exists_nhds_localStableSet_localUnstableSet_eq_graph
  informal: For a map of class C^n near a hyperbolic fixed point in a
    finite-dimensional real normed space, with n at least one and invertible
    derivative, the local stable and unstable sets are graphs over their
    respective linear subspaces in every sufficiently small neighborhood.
    The graph maps are C^n and have zero derivative at the origin.
- declaration: Function.exists_nhds_localStableSet_localUnstableSet_eq_setOf
  informal: Under the same smoothness, fixed-point, invertibility and
    hyperbolicity hypotheses, a forward or backward orbit that stays in a
    sufficiently small neighborhood of the fixed point converges to it.
- declaration: ContinuousLinearMap.isCompl_stableSubspace_unstableSubspace
  informal: The forward-decaying and backward-decaying subspaces of a
    hyperbolic real linear map in finite dimension are complementary.
