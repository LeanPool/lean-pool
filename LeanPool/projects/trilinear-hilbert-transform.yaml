slug: trilinear-hilbert-transform
title: Boundedness of the trilinear Hilbert transform
summary: >-
  Proves the L³ × L³ × L³ to L¹ bound for the principal-value trilinear
  Hilbert transform on Schwartz functions, together with its unique bounded
  extension to L³. Preserves the finite inverse theorem, quantitative
  quadratic charts, dyadic stopping and projection estimates used by the proof.
