slug: grothendieck-infinity-groupoids
title: Grothendieck ∞-groupoids, globular sums and the degree-zero comparison
summary: Grothendieck's globular ∞-groupoids in the form Maltsiniotis and Ara gave to the
  definition of Pursuing Stacks. The globe category, globular sets, coglobular objects and the
  coglobular space of disks with its hemisphere inclusions; tables of dimensions and globular
  sums, which exist in every category with pushouts; globular extensions, globular functors,
  admissible pairs, contractibility and pseudo-coherators; ∞-groupoids of type C, the presheaves
  sending globular sums to globular products, among which the terminal and the representable
  presheaves. Liftings of admissible pairs give identities, inverses and composites of cells,
  so that the homotopy relation on the cells of an ∞-groupoid of type C is an equivalence
  relation; weak equivalences contain the identities and are closed under composition. For a
  supplied globular functor from a globular extension C into the disks, the fundamental
  ∞-groupoid of a space sends globular sums to globular products, an ∞-groupoid of type C when
  C is a pseudo-coherator, and its 0-cells modulo homotopy are the path components of the
  space. It detects bijections on path components.
