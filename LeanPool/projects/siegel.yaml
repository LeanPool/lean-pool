slug: siegel
title: Siegel's lower bound for real Dirichlet L-functions
summary: Proves the ineffective uniform lower bound for the value at one of
  every non-principal real Dirichlet character, including imprimitive characters.
  Preserves bounded-character-sum and Mellin integral infrastructure, positivity
  of the auxiliary Dirichlet coefficients, and Goldfeld's exceptional-zero argument.
