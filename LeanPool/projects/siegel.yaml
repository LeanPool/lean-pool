main_results:
- declaration: SiegelThmLib.siegel
  informal: For every positive epsilon there is a positive constant depending
    only on epsilon such that the absolute value of L(1, chi) is at least
    that constant times the modulus to the power minus epsilon, for every
    non-principal character whose square is principal.
