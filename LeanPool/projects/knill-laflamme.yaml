slug: knill-laflamme
title: Knill–Laflamme quantum error-correction conditions
summary: Characterizes correctability of arbitrary finite families of complex
  error matrices on a nonzero orthogonal code projector by the Knill–Laflamme
  matrix condition. Constructs a finite Kraus recovery channel, proves both the
  individual-error and combined-noise equivalences up to scalar factors, and
  proves exact recovery when the errors themselves form a trace-preserving channel.
