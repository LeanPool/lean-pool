main_results:
- declaration: QuantumInfo.knill_laflamme
  informal: For a nonzero orthogonal code projector and arbitrary finite error
    family, the Knill–Laflamme condition is equivalent to the existence of a finite
    Kraus channel correcting each error up to a scalar on all supported matrices.
- declaration: QuantumInfo.knill_laflamme_sum
  informal: The same condition is equivalent to a finite Kraus channel correcting
    the sum of all error actions up to a scalar on all code-supported matrices;
    the errors need not preserve trace.
- declaration: QuantumInfo.exists_recovery_channel_of_knillLaflamme
  informal: A trace-preserving noise channel satisfying the Knill–Laflamme
    condition admits a recovery channel acting as the identity on every
    code-supported matrix.
