main_declarations:
- OrderMaintenance.Impl.theoremAB_word
- OrderMaintenance.Impl.theoremAB_flat_word
- OrderMaintenance.Zeroing.zeroing
main_results:
- declaration: OrderMaintenance.Impl.theoremAB_word
  informal: "For every parameter 4 \u2264 K_B < 2^512, every valid finite operation trace and sufficiently\
    \ wide fixed words, the RAM program returns the list specification answers and each operation\
    \ takes at most opB K_B steps, independent of the trace length and number of live elements. Word\
    \ width grows logarithmically with the number of operations."
- declaration: OrderMaintenance.Impl.theoremAB_flat_word
  informal: The translated program has no allocation instructions and satisfies the same specification
    with at most five times the operation-step bound, on sufficiently large preallocated zero-filled
    memory and sufficiently wide fixed words.
- declaration: OrderMaintenance.Zeroing.zeroing
  informal: In the zeroing game starting from zero, resetting a maximal coordinate before adding
    total nonnegative mass at most R bounds every coordinate by R times one plus the (n-1)st harmonic
    number.
