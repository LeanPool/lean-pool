slug: order-maintenance
title: Verified worst-case constant-step order maintenance
summary: Verifies an order-maintenance program against a list specification, with a constant worst-case
  instruction bound and logarithmic word width in the number of operations. Includes fixed-width
  and preallocated allocation-free RAM variants, a zeroing-game bound, and reusable machine cost
  semantics.
