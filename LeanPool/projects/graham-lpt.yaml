slug: graham-lpt
title: Sharp list-scheduling and longest-processing-time bounds
summary: Formalizes identical-machine scheduling for arbitrary finite job sets
  with real processing times. Proves Graham's sharp list-scheduling and LPT
  approximation bounds, constructs their tight instances, characterizes all
  positive instances attaining the LPT bound, and establishes the supremum
  for every sufficiently large fixed job count.
