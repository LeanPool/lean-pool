- HeckeEis.isCompl_range_eichlerShimuraMap_range_conj
- WeierstrassCurve.tateModuleRep_charpoly_frobenius
- WeierstrassCurve.tateModuleRep_isUnramifiedAt_of_isGoodPrimeFor
main_results:
- declaration: HeckeEis.exists_eichlerShimura_heckeEquivariant
  informal: The Eichler-Shimura isomorphism for Gamma_0(N), identifying parabolic
    cohomology with binary-form coefficients with the direct sum of holomorphic
    and antiholomorphic cusp forms, with descended cohomological Hecke operators
    and compatibility with T_p away from the level and U_p at primes dividing it.
- declaration: HeckeEis.isCompl_range_eichlerShimuraMap_range_conj
  informal: The images of the canonical Eichler-Shimura map and its complex
    conjugate are complementary subspaces of parabolic cohomology.
- declaration: WeierstrassCurve.tateModuleRep_charpoly_frobenius
  informal: At a good prime ell distinct from p, Frobenius on the p-adic Tate
    module has characteristic polynomial X^2 - a_ell X + ell (assuming the
    expected cardinalities of the p-power torsion subgroups, proved elsewhere
    in this library).
- declaration: WeierstrassCurve.tateModuleRep_isUnramifiedAt_of_isGoodPrimeFor
  informal: The p-adic Tate-module representation is unramified at good primes
    distinct from p (assuming the expected cardinalities of the p-power torsion 
    subgroups, proved elsewhere in this library).
