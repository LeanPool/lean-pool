main_results:
- declaration: HeckeEis.exists_eichlerShimura_heckeEquivariant
  informal: The Eichler-Shimura isomorphism for Gamma_0(N), identifying parabolic
    cohomology with binary-form coefficients with the direct sum of holomorphic
    and antiholomorphic cusp forms, with descended cohomological Hecke operators
    and compatibility with T_p away from the level and U_p at primes dividing it.
- declaration: WeierstrassCurve.tateModuleRep_charpoly_frobenius
  informal: On the p-adic Tate module of an elliptic curve, for a good prime
    ell distinct from p, the characteristic polynoimal of Frobenius at l is
    X^2 - a_ell X + ell. (This formulation assumes the expected cardinalities 
    of the p-power torsion subgroups, proved elsewhere in this library.)
- declaration: WeierstrassCurve.isogenyEnd_eq_zsmul_of_transcendental_j
  informal: Over an algebraically closed field of characteristic zero, if an
    elliptic curve has j-invariant transcendental over the rationals, every
    point-group endomorphism induced by a finite integral self-embedding of its
    function field (represented by IsogenyEndDatum) is multiplication by an integer.
- declaration: ModularCurve.x0_modularPolynomialPresentation
  informal: For positive N, the modular-polynomial quotient Q(X)[Y]/(Phi_N(X,Y))
    is isomorphic as a Q-algebra to the q-expansion function field of X_0(N),
    with X mapping to j(q) and Y to j(q^N).
- declaration: ModularCurve.LevelN.frickeFunctionFieldModel
  informal: >-
    For positive N, j and the nonzero N-torsion Fricke functions generate the
    full modular function field of Gamma(N) over C. Explicitly, every Gamma(N)-invariant
    meromorphic function on the upper half-plane with at most exponential growth
    at every cusp is a quotient of elements of C[j, f_v], with nonzero denominator
    and equality on punctured neighbourhoods of every point. The fraction field
    carries the modular action with kernel generated by Gamma(N) and -I. Its fixed
    field is C(j), and it is Galois over C(j) of degree [SL_2(Z) : <Gamma(N), -I>].
- declaration: ModularCurve.genusFF_gamma1_formula_of_isAlgClosed
  informal: >-
    For N >= 5 and any algebraically closed field K of characteristic zero,
    the genus g of the Gamma_1(N) q-expansion function field after base change
    from Q to K satisfies 12g + 6c = [SL_2(Z) : <Gamma_1(N), -I>] + 12,
    where c is the number of cusps of Gamma_1(N).
