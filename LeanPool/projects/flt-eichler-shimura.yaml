slug: flt-eichler-shimura
title: FLT Eichler-Shimura
summary: Collects the definitions and theorems from the Anthropic Fermat's Last Theorem
  formalization needed for the Eichler-Shimura isomorphism, relating modular forms to 
  cohomology of modular curves, and properties of the Galois representations of elliptic
  curves.
branch: number theory
entry_module: LeanPool.FLTEichlerShimura
authors: ["David Loeffler"]
source:
