slug: cutoff-rigidity
title: Gaussian factorization and convex interaction for rigid diffusions
summary: >-
  Formalizes the Euclidean Gaussian factorization and convex interaction
  theorems of Chafaï and Fathi. It connects the canonical spectral gap of a
  log-concave Gibbs measure to an affine first eigenspace and an independent
  Gaussian factor.
