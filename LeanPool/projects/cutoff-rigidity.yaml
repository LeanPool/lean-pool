main_results:
- declaration: CutoffRigidity.normalized_convexInteraction_theorem
  informal: >-
    In positive Euclidean dimension, adding quadratic confinement of rate
    ρ > 0 to a convex C² interaction invariant along the diagonal gives
    spectral gap ρ, a Gaussian factor in the diagonal direction and the
    rigidity curvature bound after normalizing the Gibbs measure.
- declaration: CutoffRigidity.euclidean_gaussian_splitting
  informal: >-
    The Euclidean form of Cheng and Zhou's theorem takes a C² potential on a
    positive-dimensional Euclidean space with a normalized Gibbs density and
    a positive Hessian lower bound equal to the first spectral gap. The
    potential splits off a quadratic term in the first eigenspace directions.
    The Gibbs law factors into a Gaussian law on this space and a Gibbs law
    on its orthogonal complement.
- declaration: CutoffRigidity.Paper.riemannian_gaussian_splitting
  informal: >-
    If the positive spectral gap equals the Bakry–Émery curvature lower bound
    on a connected complete smooth weighted manifold, a smooth isometry splits
    off a Euclidean factor whose dimension is the dimension of the space
    of smooth L² eigenfunctions at the gap. It factors the weighted law into a Gaussian and a complete
    connected weighted manifold with the same curvature lower bound, gives
    the potential identity, and proves the eigenfunction representation and
    norm and orthogonality identities.
- declaration: CutoffRigidity.Riemann.lower_of_gaussian_projection_moments
  informal: >-
    If a probability law has the Ornstein–Uhlenbeck first and second moments
    in a one-Lipschitz coordinate with Gaussian equilibrium law, its quadratic
    transport cost to equilibrium is bounded below by the squared projected
    mean plus the squared difference of the square roots of the two total
    projected variances.
- declaration: CutoffRigidity.Paper.riemannian_transport_lower_of_moments
  informal: >-
    At Riemannian curvature equality, the splitting supplies a one-Lipschitz
    Gaussian projection. The quadratic transport lower bound applies to any
    probability law with the Ornstein–Uhlenbeck moments in this projection.
- declaration: CutoffRigidity.Riemann.Diff.FormData.E_resolvent
  informal: >-
    The Friedrichs resolvent of a densely defined symmetric nonnegative
    operator on a real Hilbert space solves the weak equation in its
    completed energy form for every positive resolvent parameter.
- declaration: CutoffRigidity.Riemann.Diff.FormData.eq_resolvent_of_weak
  informal: >-
    The weak resolvent equation has at most one solution in the form domain.
- declaration: CutoffRigidity.Riemann.Diff.FormData.tendsto_euler
  informal: >-
    The implicit Euler approximations built from the resolvent converge
    in operator norm to the functional-calculus semigroup at positive time.
- declaration: CutoffRigidity.Riemann.Diff.FormData.semigroup_integral_D
  informal: >-
    For initial data in the original dense operator domain, the semigroup
    satisfies the integrated evolution equation with the original operator.
- declaration: CutoffRigidity.Riemann.Diff.FormData.contraction_energy
  informal: >-
    A continuous map preserving the dense operator core and decreasing energy
    there preserves the completed Friedrichs form domain and decreases its energy.
- declaration: CutoffRigidity.Riemann.Diff.FormData.resolvent_fixed_of_comparison
  informal: >-
    If such a map does not increase the norm of a Friedrichs resolvent vector
    and the forcing term has nonnegative pairing with its displacement, the
    map fixes that vector.
- declaration: CutoffRigidity.Riemann.Diff.diffFormData
  informal: >-
    The negative weighted diffusion generator on the smooth compactly supported
    core is densely defined, symmetric and nonnegative in L² of the finite
    weighted measure. Its core energy is the integrated gradient pairing.
- declaration: CutoffRigidity.Riemann.Diff.diffusion_resolvent_nonneg
  informal: >-
    For every positive resolvent parameter, the Friedrichs resolvent of
    the weighted diffusion generator sends nonnegative L² functions to
    nonnegative L² functions, up to almost-everywhere equality.
- declaration: CutoffRigidity.Riemann.Diff.diffusion_semigroup_nonneg
  informal: >-
    At every nonnegative time, the Friedrichs semigroup for the same
    weighted diffusion generator preserves almost-everywhere nonnegativity.
- declaration: CutoffRigidity.Riemann.Diff.oneL2_mem_diffusion_form_zero_energy
  informal: >-
    On a complete connected smooth Riemannian manifold with finite smooth
    weighted volume, the constant one belongs to the closed Friedrichs form
    domain of the negative weighted diffusion generator and has zero energy.
- declaration: CutoffRigidity.Riemann.Diff.diffusion_resolvent_one
  informal: >-
    In the same complete connected setting, the resolvent for a positive
    parameter sends the constant one to the constant inverse parameter.
- declaration: CutoffRigidity.Riemann.Diff.diffusion_semigroup_one
  informal: >-
    The Friedrichs semigroup fixes one at every nonnegative time in the
    complete connected setting.
- declaration: CutoffRigidity.Riemann.Diff.diffusion_semigroup_mapsTo_zero_one
  informal: >-
    In the complete connected setting the semigroup maps the L² order interval
    from zero to one into itself at every nonnegative time.
- declaration: CutoffRigidity.Riemann.Diff.diffusion_semigroup_preserves_integral
  informal: >-
    On the same complete connected manifold, integration against the finite
    weighted volume is invariant under the semigroup on every L² vector.
- declaration: CutoffRigidity.L2Kernel.HasContinuousRepresentatives.locally_bounded
  informal: >-
    For a bounded L² operator with continuous range representatives, on a
    locally compact Hausdorff space with full-support measure, the supremum
    on any compact set of an output representative is bounded by a constant
    times the norm of the input.
- declaration: CutoffRigidity.Riemann.Diff.diffusionTransitionKernel_integral
  informal: >-
    Assuming continuous representatives at positive times, integration against
    the weighted Friedrichs transition recovers the continuous L² output.
- declaration: CutoffRigidity.Riemann.Diff.diffusionTransitionKernel_add
  informal: Under the same regularity input, the transition kernels compose in time.
- declaration: CutoffRigidity.Riemann.Diff.diffusionTransitionKernel_markov
  informal: >-
    On a complete connected manifold, these kernels have probability
    transitions at every nonnegative time.
- declaration: CutoffRigidity.Riemann.Diff.diffusionTransitionKernel_invariant
  informal: Weighted volume is invariant under these kernels on a complete connected manifold.
