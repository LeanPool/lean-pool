slug: cutoff-rigidity
title: Gaussian splitting and convex interaction for rigid diffusions
summary: >-
  Formalizes the convex interaction theorem of Chafaï and Fathi and their
  Euclidean formulation of Cheng and Zhou's Gaussian splitting theorem for
  normalized C² Gibbs potentials at curvature equality. The proofs connect
  the canonical spectral gap to an affine first eigenspace and an
  independent Gaussian factor. On a connected complete smooth weighted
  Riemannian manifold attaining the positive Bakry–Émery curvature bound,
  it constructs a Gaussian product isometry and identifies the smooth
  first eigenfunctions in the Gaussian coordinates.
