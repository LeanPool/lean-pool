main_results:
- declaration: CutoffRigidity.normalized_convexInteraction_theorem
  informal: >-
    For a convex C² interaction invariant along the diagonal, adding a
    quadratic confinement term of rate ρ gives spectral gap ρ, a Gaussian
    factor in the diagonal direction and the rigidity curvature bound,
    after normalizing the Gibbs probability measure.
- declaration: CutoffRigidity.euclidean_gaussian_splitting
  informal: >-
    When the positive curvature lower bound is the first spectral gap,
    the potential splits off a quadratic term in the first eigenspace
    directions. The Gibbs law factors into a Gaussian law on this space
    and a Gibbs law on its orthogonal complement.
