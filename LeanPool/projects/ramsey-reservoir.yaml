slug: ramsey-reservoir
title: Reservoir and book calculus for greedy Ramsey arguments
summary: Reservoir (clique plus common-neighbour pool) and two-colour reservoir state machines behind
  greedy Ramsey arguments. Proves that every threshold satisfying Pascal's inequality is a two-colour
  Ramsey bound, the Erdős–Szekeres recursion and binomial bound as instances, R(3, 3) = 6, the
  codegree–triangle identity, book bounds from triangle and edge density, book forcing, and anchored
  gluing for homogeneous block quotients.
