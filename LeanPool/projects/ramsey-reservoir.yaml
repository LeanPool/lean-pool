main_results:
- declaration: SimpleGraph.Bireservoir.IsWinning.exists_pivot
  informal: Let R satisfy Pascal's inequality and be positive at positive arguments. If both
    clique spines are short of their targets and the pool has at least R of the two deficits
    vertices, a pool vertex can be added to one spine while retaining at least R of the updated
    deficits common neighbours in that colour.
  source_ref: 'Upstream RamseyReservoir/Bireservoir.lean at 7024820542e42feb8177cbf2c624d64106813332.'
- declaration: SimpleGraph.ramseyBound_of_pascal
  informal: If R a (b + 1) + R (a + 1) b ≤ R (a + 1) (b + 1) and R (a + 1) (b + 1) > 0 for all
    a and b, then for all r and s every graph on R r s vertices has an r-clique or an independent
    set of size s.
  source_ref: 'Upstream RamseyReservoir/Bireservoir.lean at 7024820542e42feb8177cbf2c624d64106813332;
    proposed in #721.'
- declaration: SimpleGraph.ramseyBound_iff_ramseyNumber_le
  informal: The predicate RamseyBound n r s holds exactly when the FiniteRamsey Ramsey number
    ramseyNumber ![r, s] is at most n.
  source_ref: Lean Pool bridge to LeanPool.FiniteRamsey, added in this import.
- declaration: SimpleGraph.ramseyNumber_le_of_isPascal
  informal: Every threshold R satisfying Pascal's inequality and positive whenever both inputs
    are positive bounds the FiniteRamsey Ramsey number ramseyNumber ![r, s] above by R r s.
  source_ref: Lean Pool corollary of the upstream Pascal-potential theorem, added in this import.
- declaration: SimpleGraph.ramseyNumber_three_three
  informal: The FiniteRamsey Ramsey number ramseyNumber ![3, 3] equals 6. FiniteRamsey already
    proves the upper bound; the lower bound uses the five-cycle.
  source_ref: 'Upstream ramseyBound_six_three_three and not_ramseyBound_five_three_three at
    7024820542e42feb8177cbf2c624d64106813332.'
- declaration: SimpleGraph.Reservoir.exists_isNClique_of_card_nonadj_le
  informal: In a reservoir (a clique spine and a pool of common neighbours), if every pool vertex
    is non-adjacent to at most d pool vertices, counting itself, and j d is less than the pool
    size, then G has a clique of size (spine size + j + 1).
  source_ref: 'Upstream RamseyReservoir/Reservoir.lean at 7024820542e42feb8177cbf2c624d64106813332.'
- declaration: SimpleGraph.exists_isNClique_of_minDegree
  informal: A finite graph with minimum degree δ on n vertices and j (n - δ) < n contains a
    (j + 1)-clique. This empty-spine case also follows from Mathlib's Turán bound.
  source_ref: 'Upstream RamseyReservoir/Reservoir.lean at 7024820542e42feb8177cbf2c624d64106813332.'
- declaration: SimpleGraph.exists_adj_four_mul_card_edgeFinset_le
  informal: A finite graph with e > 0 edges on n vertices has an edge uv whose endpoints have c
    common neighbours with 4e ≤ n (c + n).
  source_ref: 'Upstream RamseyReservoir/Book.lean at 7024820542e42feb8177cbf2c624d64106813332.'
- declaration: SimpleGraph.ContainsBook.not_cliqueFree_or
  informal: If G has an m-clique with at least n common neighbours and every graph on n vertices
    has an (r - m)-clique or an independent s-set (truncated subtraction), then G has an r-clique
    or an independent s-set.
  source_ref: 'Upstream RamseyReservoir/Book.lean at 7024820542e42feb8177cbf2c624d64106813332.'
- declaration: SimpleGraph.HomogeneousBlocks.isNClique_anchor
  informal: For disjoint nonempty blocks with all-or-nothing adjacency between blocks, an n-clique
    inside one block of an m-clique of the quotient graph, together with representatives of the
    other m - 1 blocks, is an (n + m - 1)-clique.
  source_ref: 'Upstream RamseyReservoir/HomogeneousBlocks.lean at
    7024820542e42feb8177cbf2c624d64106813332.'
