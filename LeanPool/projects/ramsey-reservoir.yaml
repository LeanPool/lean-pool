slug: ramsey-reservoir
title: Reservoir and book calculus for greedy Ramsey arguments
summary: Reservoirs (a clique with a pool of common neighbours) and two-colour reservoirs, the state
  machines behind greedy clique-building Ramsey arguments. Proves that every threshold satisfying
  Pascal's inequality is a two-colour Ramsey bound, with the Erdős–Szekeres binomial bound and
  R(3, 3) = 6 as consequences. Also proves greedy and minimum-degree clique bounds, the
  codegree–triangle identity, books from triangle and edge density, book forcing and anchored
  gluing for homogeneous block quotients. The Ramsey predicate is proved equivalent to the
  FiniteRamsey project's two-colour Ramsey property and number.
