slug: ramsey-reservoir
title: Reservoir and book calculus for greedy Ramsey arguments
summary: Reservoirs track a clique and its pool of common neighbours. The winning-pivot theorem
  preserves a Pascal threshold for partially built two-colour clique spines. The development also
  proves greedy clique bounds from local non-adjacency budgets, books from triangle and edge
  density, book forcing, and anchored gluing for homogeneous block quotients. Starting from empty spines recovers Pascal
  upper bounds, including the Erdős–Szekeres binomial bound. A five-cycle gives the matching lower
  bound for R(3, 3) = 6. The Ramsey interface uses the two-colour Ramsey property in FiniteRamsey.
