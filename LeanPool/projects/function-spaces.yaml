slug: function-spaces
title: Characterizations of Besov, Triebel–Lizorkin and Sobolev spaces
summary: >-
  Formalizes characterizations of function spaces by finite differences, local
  means, atoms, wavelet coefficients and best approximation. The development
  includes approximation schemes, real interpolation, and extensions and traces
  on domains, as well as concrete results on Euclidean space and the torus.
