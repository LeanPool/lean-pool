main_results:
- declaration: PatternPoset.mcnamara_steingrimsson_Q9_5_false
  informal: >-
    Refutes McNamara–Steingrímsson (2015) Question 9.5: there exist permutations σ ≤ τ in the
    classical permutation pattern poset whose closed interval [σ, τ] is not Sperner.
- declaration: PatternPoset.not_sperner_interval7
  informal: >-
    The explicit closed interval [213, 2574613] in the classical permutation pattern poset is not
    Sperner (width 8 exceeds largest rank size 7).
- declaration: PatternPoset.interval7_card
  informal: >-
    The closed interval [213, 2574613] has exact cardinality 19.
- declaration: PatternPoset.interval7_rank_sizes
  informal: >-
    The closed interval [213, 2574613] has rank sizes 1, 3, 7, 7, 1 at lengths 3, 4, 5, 6, 7 and
    0 at all other ranks.
- declaration: PatternPoset.interval7_largestRank
  informal: >-
    The largest rank size of [213, 2574613] is 7.
- declaration: PatternPoset.interval7_width
  informal: >-
    The width of [213, 2574613] is 8, established by an explicit 8-element antichain and a
    matching 8-chain cover.
- declaration: PatternPoset.family_exact_deficiency
  informal: >-
    For every k ≥ 1, the principal downset [∅, τ_k] of the length-(6k + 4) two-leader permutation
    τ_k satisfies width (Downset (τ_k)) = largestRank (Downset (τ_k)) + k.
- declaration: PatternPoset.family_not_sperner
  informal: >-
    For every k ≥ 1, the principal downset [∅, τ_k] is not Sperner.
- declaration: PatternPoset.family_largestRank
  informal: >-
    For every k ≥ 1, the largest rank size of Downset (τ_k) is 3k² + 8k + 5, attained at rank
    3k + 3.
- declaration: PatternPoset.family_width
  informal: >-
    For every k ≥ 1, the width of Downset (τ_k) is 3k² + 9k + 5, established by an explicit
    antichain and a matching chain cover combining a 3D box symmetric chain decomposition with
    4k + 3 valley-free chains.
- declaration: PatternPoset.downset_tau_classify
  informal: >-
    Classifies every pattern π ≤ τ_k into two-leader valley patterns P(x, y, z), one-leader
    valley-free patterns Q(p, q), and strictly decreasing patterns D(l).
- declaration: PatternPoset.boxSlice_card
  informal: >-
    For the 3D integer box [0, 2k + 1] × [0, 2k + 1] × [0, 2k] and 0 ≤ t ≤ k, the slice of
    triples with coordinate sum 3k + 1 + t has cardinality 3k² + 5k + 2 − t².
