slug: quillen-suslin
title: Projective modules over polynomial rings (Quillen patching and Horrocks)
summary: Commutative algebra on the way to the Quillen–Suslin theorem, on Mathlib's carriers.
  For a commutative ring A, the monic polynomials form a submonoid of A[X], and the
  localisation A⟨X⟩ at them is a faithfully flat A-algebra; for a field k, k⟨X⟩ is a field,
  and for a principal ideal domain k, k⟨X⟩ is a principal ideal domain (Quillen's Lemma 2).
  Modules extended from a base ring are defined, and an A[X]-module is extended from A exactly
  when it is A[X] ⊗ M(0); extended modules stay extended after base change, in one and in
  several variables. Quillen's dilation lemma is proved for a not necessarily commutative
  A-algebra R and f ∈ A; for a unit θ of R_f[X] there is k such that θ(g₁X) θ(g₂X)⁻¹ comes from
  a unit of R[X] with constant term one whenever g₁ − g₂ ∈ fᵏA. Finitely generated
  projective modules over two comaximal localisations R_f and R_g that are isomorphic over
  R_fg glue to a finitely generated projective R-module with the given localisations.
  For a finitely presented A-module N and an A-algebra B, the polynomials over B ⊗ End(N) act on
  B[X] ⊗ N, bijectively for flat B, which turns automorphisms of extended modules into units
  of a polynomial ring. With the dilation lemma this proves Quillen's patching theorem. For a
  finitely presented A[X]-module M, the a ∈ A such that M becomes extended after inverting a
  form an ideal (the Quillen ideal), and M is extended from A as soon as it is extended after
  localising at every maximal ideal of A; the same holds for finitely presented modules over
  A[X₁, …, Xₙ], by induction on n through A[X₁, …, Xₙ₊₁] ≅ A[X₁, …, Xₙ][X]. Horrocks'
  theorem follows. Over a local ring, a finitely generated projective A[X]-module that becomes
  free over A⟨X⟩ is free; over any ring, such a module that becomes extended from A over A⟨X⟩
  is extended from A, and one that becomes free over A⟨X⟩ is free (Quillen's form). Bass's
  theorem holds too. Finitely generated projective A-modules that become isomorphic over A⟨X⟩
  are isomorphic.
