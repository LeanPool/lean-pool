slug: pseudoline-arrangements
title: Chirotopes, line arrangements and flag systems of maps
summary: Chirotopes of rank r (Björner–Las Vergnas–Sturmfels–White–Ziegler, in the
  three-term Grassmann–Plücker form) and combinatorial maps as flag systems acted on by
  Grothendieck's cartographic group, on native Mathlib carriers. The sign of the
  determinants of a spanning family of vectors over an ordered field is a chirotope, through
  the basis exchange property of the linear matroid and the three-term Plücker identity in
  every rank; reorientations and relabellings of chirotopes are chirotopes. For monotone
  arrangements of pseudolines the chirotope function is uniform exactly when the arrangement
  is simple, and for an arrangement of straight lines it equals the vector chirotope of the
  lines, hence is a realizable chirotope. A flag system is connected exactly when its flag
  graph is; its orientation double cover is orientable, connected exactly when the system is
  connected and not orientable, and, for closed surfaces, has twice as many cells of each
  dimension. Flag systems are the actions of the cartographic group; the monodromy
  homomorphism factors through a string Coxeter group exactly when the corresponding
  relations hold; morphisms to connected systems are surjective and automorphisms act
  freely. Connected flag systems are classified by conjugacy classes of subgroups of the
  cartographic group, orientability of closed-surface maps is read on the even part of the
  monodromy group, and regular flag systems are characterised by their automorphism groups,
  by normal subgroups, and as the flag systems of groups generated by involutions.
