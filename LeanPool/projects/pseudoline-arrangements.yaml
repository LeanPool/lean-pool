slug: pseudoline-arrangements
title: Chirotopes, line arrangements and flag systems of maps
summary: >-
  Chirotopes of rank r in the three-term Grassmann–Plücker form, monotone arrangements, and
  flag systems acted on by the cartographic group. The determinant signs of a spanning family
  over an ordered field form a chirotope, and reorientation and relabelling preserve that
  property. A monotone arrangement is simple exactly when its sign function is nonzero on
  every triple of distinct elements. For straight lines of strictly decreasing slope, that
  function equals the determinant signs of the line vectors. With at least two lines it is a
  realizable rank-three chirotope. Flag-system connectedness is equivalent to graph
  preconnectedness. The orientation double cover is orientable and, for nonempty systems with
  fixed-point-free involutions, is connected exactly when the original is connected and
  nonorientable. For closed-surface flag systems it doubles the natural cardinality of each
  cell type. Nonempty connected flag systems are classified by conjugacy classes of subgroups
  of the cartographic group. For nonempty connected closed-surface maps it characterizes
  orientability by even monodromy. It characterizes regularity using automorphisms, normal
  subgroups, and involutions satisfying the distant commutation relations.
