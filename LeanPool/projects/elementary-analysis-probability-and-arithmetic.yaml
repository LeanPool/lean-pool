slug: elementary-analysis-probability-and-arithmetic
title: Classical results of elementary analysis, probability and arithmetic
summary: A collection of classical results from undergraduate analysis, probability and
  arithmetic. Proves the de Moivre–Laplace theorem (the standardised binomial distribution
  converges in distribution to the standard Gaussian, also in terms of cumulative distribution
  functions), after showing that a sum of independent Bernoulli variables is binomial. Proves
  the variation of constants formula for the linear ODE y' = A y + F(t) with A in a complete
  normed real algebra, with uniqueness of the solution. Computes the volume of a solid of
  revolution, π ∫ f², via Cavalieri's principle, and the volume of a cone over a measurable base
  in any dimension, hence π R² H / 3. Shows that adjacent sequences converge to a common limit,
  that a nonnegative real is rational exactly when its digits in base b are eventually periodic,
  that n is squarefree exactly when a^(λ(n)+1) = a in ZMod n for the Carmichael function λ (so a
  Carmichael number n satisfies a^n = a for every residue), and gives the distance from a point
  to a hyperplane through its normal vector.
