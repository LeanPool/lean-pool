slug: pure-nock
title: Pure Nock semantics, trace certificates, and polynomial fingerprints
summary: >-
  Formalizes Pure Nock nouns with natural-number leaves, operational semantics,
  evaluator soundness and completeness, verifiable crash behavior, modular
  evaluation and guarded
  natural-number bridges, execution trace certificates, and polynomial
  fingerprints over arbitrary finite fields. Distinct field-valued noun data
  have bounded fingerprint collision probability, with a union bound for
  tables sharing one random evaluation point. A computable Horner evaluator
  agrees with the polynomial fingerprint. The language and fingerprint
  closure excludes the framework's zkVM, AIR, RAP, table security theorem,
  and concrete Goldilocks field. Manuscript line references concern the
  upstream bundled draft v0.1.6, rather than the posted ePrint revision.
