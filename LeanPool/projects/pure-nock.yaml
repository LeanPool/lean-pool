main_results:
- declaration: Nock.Verb.runProgram_adequate_complete
  informal: A subject and formula evaluate to a result under the small-step program machine with some finite fuel if and only if the derived paper evaluator produces that result with some finite fuel.
- declaration: Nock.Verb.runTraceProgram_certificate
  informal: Every successfully emitted program trace is consistent and complete, every adjacent transition and its final completion edge passes the Nock checker.
- declaration: Nock.paper_field_bridge
  informal: For a modulus greater than one and inputs whose atoms are below the modulus, successful guarded evaluation produces the same bounded result under natural-number paper evaluation, modular paper evaluation, the full modular evaluator, the natural-number reference evaluator, and the small-step program machine with some finite fuel.
- declaration: Nock.NPR.collision_prob_le
  informal: For nouns with at most Lambda leaves and distinct field-valued coefficient data or tree shapes, a uniformly selected point of a finite field makes their polynomial fingerprints coincide with probability at most 2 times (2 Lambda minus 1) divided by the field cardinality.
- declaration: Nock.NPR.fnHorner_eq_fn
  informal: The computable Horner fingerprint of every noun at every field evaluation point equals its polynomial fingerprint.
- declaration: Nock.Verb.eval_crash_iff_invalid
  informal: The three-valued evaluator reports a crash at some finite fuel exactly when the initial verb has a complete trace ending at a stuck nonterminal state.
- declaration: Nock.NPR.collision_table_prob_le
  informal: For a finite table of bounded-length nouns evaluated at one shared random field point, the probability that some pair with distinct field-valued data collides is at most the single-pair error times k times (k minus 1) divided by 2.
