main_results:
- declaration: Catalytic.rp_pass_two_iff
  informal: For a prime p and input-access budget t ≥ 1, a formal polynomial
    over the prime field is computable by a clean passive two-register program
    exactly when each exponent at least two with nonzero coefficient has
    base-p digit sum at most min(p − 1, t − 1).
- declaration: Catalytic.four_reg_powering_x13
  informal: For N ≥ 1, under the stated invertibility conditions on the
    certificate coefficient and two factorials, the radix-13 construction
    computes the Nth power with four registers. For ℓ the number of base-13
    digits of N minus one, three times the access count is less than 104 · 8^ℓ.
- declaration: Catalytic.balancedProdProg_clean
  informal: A balanced product of 2^k inputs can be added to an output
    register while restoring every other register.
- declaration: Catalytic.balancedOpCount_formula
  informal: The balanced product program has exactly (7 · 4^k − 4) / 3
    primitives, including input accesses.
