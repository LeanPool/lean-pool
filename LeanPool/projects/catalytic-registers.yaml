main_results:
- declaration: Catalytic.rp_pass_two_iff
  informal: For a prime p and input-access budget t ≥ 1, a formal polynomial
    over the prime field is computable as a formal identity by a clean passive
    two-register program with prime-field constants exactly when each exponent
    at least two with nonzero coefficient has
    base-p digit sum at most min(p − 1, t − 1).
- declaration: Catalytic.four_reg_powering_x13
  informal: For N ≥ 1, under the stated invertibility conditions on the
    certificate coefficient and two factorials, the radix-13 construction
    computes the Nth power with four registers. Let ℓ be one less than the
    number of base-13 digits of N. Three times the access count is less than 104 · 8^ℓ.
- declaration: Catalytic.balancedProdProg_clean
  informal: With sign +1, the balanced product program adds the product of
    2^k inputs to its target and restores every other register. The work
    registers must be pairwise distinct and disjoint from the target, with
    at least k + 1 work registers for k > 0. The pool may be empty at k = 0.
- declaration: Catalytic.balancedProdProg_length
  informal: The balanced product program has length balancedOpCount k if
    k = 0 or the work-register pool has at least k + 1 entries.
- declaration: Catalytic.balancedOpCount_formula
  informal: The exact count balancedOpCount k is (7 · 4^k − 4) / 3
    primitives, including input accesses.
