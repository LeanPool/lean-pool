slug: catalytic-registers
title: Passive catalytic register programs over finite fields and commutative rings
summary: Characterizes polynomials computable with two passive catalytic
  registers over a prime field using digit sums of their formal exponents.
  It verifies explicit three-register powering programs, composes them into
  a four-register construction, and proves exact costs and clean restoration
  for a balanced multilinear product program.
