title: The finite probabilistic method for graphs
summary: Finite, counting-based tools of the probabilistic method. Proves a quantitative asymmetric
  Lovász Local Lemma under lopsided dependence for arbitrary nonnegative weights of total one on a
  finite sample set, its p-biased-cube and symmetric corollaries for events determined by coordinate
  sets, dependent random choice in degree-moment and Fox–Sudakov average-degree forms, and
  first-moment and deletion bounds for cliques and independent sets of G(n, p). For a finite
  coordinate set in a countable type, and for a finite vertex type, it identifies the counting
  probability with Mathlib's setBer(U, p) and binomial random graph G(V, p).
