title: The finite probabilistic method for graphs
summary: Finite, counting-based tools of the probabilistic method. Proves the asymmetric lopsided
  Lovász Local Lemma for arbitrary nonnegative weights of total one on a finite sample set, its
  p-biased-cube and symmetric corollaries for events on coordinate sets, dependent random choice,
  and first-moment and deletion bounds for cliques and independent sets of G(n, p). Identifies the
  counting probability with Mathlib's setBer(U, p) and binomial random graph G(V, p).
