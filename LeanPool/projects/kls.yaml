main_results:
- declaration: FunctionalInequalities.KLS.kls
  informal: The Poincaré constant of a finite-dimensional log-concave probability
    measure with finite second moment is bounded by a universal constant times
    the operator norm of its covariance, including on singular affine supports.
  source_ref: P. Bizeul, B. Klartag and J. Lehec, arXiv:2610.05474v1, Theorem 1.1.
- declaration: KLSOpenAI.kls
  informal: One Poincaré constant works for isotropic log-concave probability
    densities in all positive dimensions and smooth compactly supported test functions.
  source_ref: OpenAI KLS model at commit adc7f1241b42e322a6451854ab7e4b4c146bf78a.
- declaration: KLSOpenAI.kls_locallyLipschitz
  informal: One Poincaré constant works for isotropic log-concave probability densities
    in all positive dimensions and locally Lipschitz square-integrable test functions,
    with extended gradient energy.
  source_ref: P. Bizeul, B. Klartag and J. Lehec, arXiv:2610.05474v1, Theorem 1.1.
