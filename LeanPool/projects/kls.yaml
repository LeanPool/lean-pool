slug: kls
title: The dimension-free Kannan–Lovász–Simonovits bound
summary: Formalizes the dimension-free Poincaré bound of Bizeul, Klartag and Lehec
  via cutoff stochastic localization. The project includes the covariance-normalized
  bound and two density formulations.
branch: probability theory and convex geometry
entry_module: LeanPool.KLS
