slug: cograph-distance
title: Connected cographs with distance eigenvalues approaching −2 from below
summary: >
  Constructs connected cographs with a distance eigenvalue arbitrarily close to
  −2 from below. For each positive m, the join of a singleton with the disjoint
  union of a singleton and m edges has a distance eigenvalue between
  −2 − 1/(2m) and −2. The proof lifts a root of a cubic to an explicit eigenvector.
branch: spectral graph theory
