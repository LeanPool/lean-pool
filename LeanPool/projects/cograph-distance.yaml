main_results:
- declaration: CographDist.family_theorem
  informal: For each positive m, the stated family is connected and P4-free
    and has a distance eigenvalue in (−2 − 1/(2m), −2).
- declaration: CographDist.openProblemI_negative
  informal: Every open interval with right endpoint −2 contains a distance
    eigenvalue of a finite connected cograph.
