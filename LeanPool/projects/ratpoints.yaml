main_results:
- declaration: Ratpoints.mem_bruteForce_iff
  informal: Membership in the brute-force output is equivalent to being a
    normalized integral solution (x, y, z) with max(|x|, z) at most the
    height bound.
- declaration: Ratpoints.Fast.isPoint_and_inRegion_of_mem_fastPoints
  informal: Every fast-search output is a normalized solution within the
    height bound. Its denominator is zero or meets the lower bound and any
    positive upper denominator bound.
- declaration: Ratpoints.Fast.mem_fastPoints_iff
  informal: For any tuning parameters, the fast search finds exactly the
    normalized solutions with max(|x|, z) within the height bound and
    with z zero or meeting the lower bound and any positive upper bound.
- declaration: Ratpoints.Fast.nodup_fastPoints
  informal: The fast search never returns a point twice.
