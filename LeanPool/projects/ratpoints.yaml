slug: ratpoints
title: Verified bounded-height rational-point search on hyperelliptic curves
summary: >
  Certifies a pure Lean brute-force reference and modular sieve for normalized
  integral triples (x, y, z) satisfying a hyperelliptic binary-form equation.
  Height is max(|x|, z), where x and z are the coprime numerator and denominator.
  Both searches include eligible points at infinity (z = 0). For finite points
  the fast search enforces the lower denominator bound and applies the upper
  bound only when it is positive. The fast search enumerates exactly these
  points without duplicates, using Tau Ceti's Sturm root count for pruning.
branch: computational number theory
