main_results:
- declaration: Ratpoints.mem_bruteForce_iff
  informal: Membership in the brute-force output is equivalent to being a
    normalized integral representative of a point within the height bound.
- declaration: Ratpoints.Fast.isPoint_and_inRegion_of_mem_fastPoints
  informal: The pure Lean fast search only returns bounded-height points whose
    denominators are within the requested range or zero.
- declaration: Ratpoints.Fast.mem_fastPoints_iff
  informal: The pure Lean fast search finds precisely all such points for any
    tuning parameters.
- declaration: Ratpoints.Fast.nodup_fastPoints
  informal: The fast search never returns a point twice.
