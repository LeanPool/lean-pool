slug: ratpoints
title: Verified bounded-height rational-point search on hyperelliptic curves
summary: >
  Formalizes a pure Lean search for normalized bounded-height points on
  hyperelliptic curves over the rationals, with a brute-force reference and an
  exact modular sieve. The fast search outputs all points in the requested
  denominator range or at infinity, with no duplicates. Its interval pruning
  uses the Sturm root count from Tau Ceti.
branch: computational number theory
entry_module: LeanPool.Ratpoints
