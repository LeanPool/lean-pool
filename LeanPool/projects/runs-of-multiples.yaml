main_results:
  - declaration: RunsOfMultiples.main_theorem
    informal: >-
      Every sufficiently large finite set S of positive integers has sum of its
      first missing multiple indices at most C*n*log(n)*log(log(n)); for every
      sufficiently large n, a set of exactly n positive integers attains at least
      c*n*log(n)*log(log(n)), for a fixed c>0. This proof uses entropy and smooth numbers.
  - declaration: RunsOfMultiples.main_theorem_alt
    informal: >-
      The identical sharp asymptotic statement, proved using compression
      to divisor-closed, prime-shift-closed sets and a box-times-simplex construction.
