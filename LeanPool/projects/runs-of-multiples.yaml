slug: runs-of-multiples
title: Sharp asymptotic bounds for runs of multiples in finite sets
summary: >-
  For a finite set S of n positive integers, let k(S,a) be the least positive
  integer k for which k*a is outside S. Proves an upper bound for every such S
  and a matching positive lower bound attained by some set of every sufficiently
  large cardinality n, establishing the extremal order n log n log log n.
  Contains entropy and chain-compression upper bounds and two lower-bound
  constructions, sharing definitions, prime estimates and padding. Preserves
  prime-weighted entropy estimates, smooth-number constructions and abstract
  cardinality-preserving compression lemmas.
