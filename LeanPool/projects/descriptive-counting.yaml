main_results:
- declaration: DescriptiveComplexity.sharpSat_sharpTseitin
  informal: >-
    For every finite nonempty ordered source structure, the CNF produced by the
    parsimonious Tseitin interpretation has exactly as many satisfying assignments as
    the source second-order block has witnesses satisfying its first-order kernel.
- declaration: DescriptiveComplexity.sharpSat_sharpP_parsimoniousComplete
  informal: >-
    Counting the satisfying assignments of a CNF is complete under parsimonious
    first-order reductions for counting problems defined by existential second-order
    witness counts on finite nonempty relational structures.
- declaration: DescriptiveComplexity.sharpSat_sharpP_complete
  informal: >-
    The same counting problem is complete for the library's #P under its
    subtractive reduction notion.
