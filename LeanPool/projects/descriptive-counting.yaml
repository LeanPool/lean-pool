slug: descriptive-counting
title: 'Descriptive counting complexity and parsimonious completeness of #SAT'
summary: >-
  Defines counting problems on finite nonempty relational structures, existential second-order
  witness counts, and first-order counting reductions. Constructs a parsimonious Tseitin
  interpretation and proves that the number of satisfying assignments of its CNF equals
  the number of witnesses of the source formula. Consequently #SAT is complete for the
  library's logically defined #P under parsimonious reductions. Includes the supporting
  first-order interpretation, second-order definability, fixed-point, and counting-reduction
  infrastructure. The scope is descriptive complexity; no equivalence with a string-based
  resource-bounded machine model is claimed by this import.
