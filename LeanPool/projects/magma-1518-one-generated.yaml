main_results:
- declaration: Magma1518.table
  informal: In every magma satisfying laws 1518 and 3862, for every x and all u, v in
    {x, x ◇ x, (x ◇ x) ◇ (x ◇ x)}, the product u ◇ v equals v ◇ v.
  source_ref: Tao's conjecture (Lean Zulip message 485148288), table part
- declaration: Magma1518.cube
  informal: In every magma satisfying laws 1518 and 3862, squaring three times is the identity,
    S (S (S x)) = x with S x = x ◇ x.
  source_ref: Tao's conjecture (Lean Zulip message 485148288), cyclicity part
- declaration: Magma1518.words_in_T
  informal: In every magma satisfying laws 1518 and 3862, every word in one generator x evaluates
    into {x, S x, S (S x)}, so this set is the submagma generated by x.
  source_ref: Tao's conjecture (Lean Zulip message 485148288), one-generated models
- declaration: Magma1518.one_or_three
  informal: In every magma satisfying laws 1518 and 3862, either S x = x = S (S x), or x, S x and
    S (S x) are pairwise distinct.
  source_ref: Tao's conjecture (Lean Zulip message 485148288), trivial or Z/3 shift
- declaration: Magma1518.family_members
  informal: The extensions of the Z/3 shift by F_5 and by F_13 with the stated coefficient
    matrices (15 and 39 elements) satisfy law 1518 and violate each of laws 47, 614, 817 and
    3862.
  source_ref: Upstream note, Theorem F (checked members only)
