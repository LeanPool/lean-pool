slug: magma-1518-one-generated
title: One-generated (1518 + 3862)-magmas are trivial or the Z/3 shift
summary: 'Proves, in core Lean, a classification conjectured by Terence Tao in the Equational
  Theories Project: in every magma satisfying ETP laws 1518 (x = (y ◇ y) ◇ (x ◇ (y ◇ x))) and
  3862 (x ◇ x = (x ◇ (x ◇ x)) ◇ x), the set {x, S x, S (S x)} with S x = x ◇ x is closed, carries
  the table u ◇ v = S v, and satisfies S (S (S x)) = x, so every one-generated such magma is the
  trivial magma or the three-element cyclic shift x ◇ y = y + 1. No finiteness is assumed. Tao
  stated the conjecture for 1518 with all four of laws 47, 614, 817 and 3862; Bolan observed that
  1518 and 3862 already imply the other three, so the hypotheses here are equivalent to his. The
  project also checks by kernel evaluation two finite magmas that satisfy 1518 and violate all four
  targets (15 and 39 elements), members of an explicit family of extensions of the shift; the
  15-element one is isomorphic to the ETP''s countermodel Refutation939, and the general family is
  not formalized.'
