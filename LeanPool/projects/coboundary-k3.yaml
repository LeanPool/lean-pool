main_results:
- declaration: CoboundaryK3.h1_eq_all
  informal: For every k ≥ 3, the Sym(3) permutation coboundary constant h1 k of the complete
    complex K_k, in the same-degree moved-point counting convention, equals k/3.
  source_ref: Theorem 8 of doi:10.5281/zenodo.23245792 (stated there for k ≥ 4).
- declaration: CoboundaryK3.k_div_three_le_h1
  informal: If K_k carries a Sym(3)-valued non-coboundary, then k/3 ≤ h1 k; the star gauges at
    the k vertices cost three times the triangle defect in total.
  source_ref: Proposition 1 of doi:10.5281/zenodo.23245792, which is Chapman–Lubotzky,
    arXiv:2311.06706, Proposition 3.2, here only for Sym(3) in the counting convention.
- declaration: CoboundaryK3.stair_gaugeDist
  informal: Kozlov's staircase cochain on K_{2t+1} has Sym(3) gauge distance exactly t(t+1).
  source_ref: Kozlov, arXiv:1610.07136, Definition 3.2 and Lemma 3.8, with the Sym(3) parity
    transfer of doi:10.5281/zenodo.23245792.
- declaration: CoboundaryK3.h1_eq_four_mul
  informal: Balanced replication of the k = 4 witness gives h1 (4q) = 4q/3 for every q ≥ 1.
  source_ref: Corollary 7 of doi:10.5281/zenodo.23245792.
- declaration: CoboundaryK3.witness_k8
  informal: The explicit k = 8 witness of Appendix A has triangle defect 72, every Sym(3) gauge
    costs at least 27, and the identity gauge costs exactly 27.
  source_ref: Theorem 4 and Appendix A of doi:10.5281/zenodo.23245792.
