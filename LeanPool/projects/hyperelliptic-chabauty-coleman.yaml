slug: hyperelliptic-chabauty-coleman
title: Chabauty–Coleman bounds for odd-degree hyperelliptic curves
summary: Proves the rank-sensitive Chabauty–Coleman point-count bound for monic
  odd-degree hyperelliptic curves over the rationals and number fields at primes
  of squarefree reduction. The Jacobian group is the ideal class group of the
  affine coordinate ring; its identification with an algebraic Jacobian variety
  is outside this formalization. Includes Mumford representatives, reduction of
  divisor classes, multivariable formal groups, p-adic logarithms, and residue-disk
  zero counts. Independent upstream archive results are omitted.
