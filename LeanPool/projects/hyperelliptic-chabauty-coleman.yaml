main_results:
- declaration: ChabautyColeman.main_affine_rat_of_rank_le
  informal: For a monic odd-degree hyperelliptic curve over Q whose coordinate-ring
    class group has rational rank at most r below the genus, and a prime p greater
    than 2r + 2 with an integral model of squarefree reduction, the affine rational
    point count plus one is at most the reduced affine point count plus one, plus 2r.
- declaration: ChabautyColeman.NumberFieldBase.main_affine_numberField
  informal: Over the fraction field of a Dedekind domain finite free over Z, the
    same class-group-rank bound holds at a prime of squarefree reduction when the
    residue characteristic exceeds 2r plus the absolute ramification index plus 1.
- declaration: ChabautyColeman.NumberFieldBase.ratPoints_finite_numberField
  informal: The set of rational affine points on a monic odd-degree hyperelliptic
    curve over a number field is finite when the rational rank of the ideal class
    group of its affine coordinate ring is smaller than its genus.
