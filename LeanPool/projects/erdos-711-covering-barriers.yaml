slug: erdos-711-covering-barriers
title: Cauchy–Schwarz covering barriers for Erdős problem 711
summary: Proves two lower bounds for the divisor-multiplicity sums in the three-path
  reflection method. For sufficiently large N, the results hold for every finite cover of
  (N/2, N] and give exponential corrections with exponents two thirds and one half, respectively.
