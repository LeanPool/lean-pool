main_results:
- declaration: FQFP.BCH.norm_suzukiProduct_pow_sub_septic_midpoint_le_of_skewAdjoint
  informal: For two skew-adjoint generators and any positive number of steps,
    the Suzuki product's normalized global error differs from the sum of the
    transported quintic and centered septic terms by at most an explicit remainder.
- declaration: FQFP.BCH.isBigO_fiveStageStrangProduct_pow_sub_septic_midpoint
  informal: With the generators and nonnegative final time fixed and contractive
    exponentials, the refined operator remainder is big O of the inverse eighth
    power of the number of steps.
- declaration: FQFP.BCH.tendsto_nat_pow_four_mul_norm_suzukiProduct_pow_sub_exp_of_skewAdjoint
  informal: For skew-adjoint generators, multiplying the global Suzuki error norm
    by the fourth power of the step count yields a limit determined by the integral
    of the conjugated quintic coefficient.
