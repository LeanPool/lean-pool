slug: suzuki-cancellation
title: Cancellation-aware error bounds for the fourth-order Suzuki formula
summary: The fourth-order binary Suzuki splitting admits a global error
  expansion through the centered septic term, with an eighth-order remainder
  at fixed time. The integral of the transported quintic coefficient gives
  the leading error constant.
