main_results:
- declaration: FQFP.BCH.norm_suzukiProduct_pow_sub_septic_midpoint_le_of_skewAdjoint
  informal: For two skew-adjoint generators in a complete C*-algebra with compatible
    real scalars, a nonnegative final time, and any positive number of steps, the
    left-normalized Suzuki product error differs from the sum of the transported
    quintic and centered septic terms by at most an explicit remainder.
- declaration: FQFP.BCH.isBigO_fiveStageStrangProduct_pow_sub_septic_midpoint
  informal: In a complete normed algebra, with the Suzuki cubic relation and
    contractive exponentials for both generators and their sum at every real time,
    the refined operator remainder at fixed nonnegative final time is big O of the
    inverse eighth power of the number of steps.
- declaration: FQFP.BCH.tendsto_nat_pow_four_mul_norm_suzukiProduct_pow_sub_exp_of_skewAdjoint
  informal: For skew-adjoint generators in a complete C*-algebra with compatible
    real scalars and fixed nonnegative final time, the global Suzuki error norm
    scaled by the fourth power of the step count converges to the fourth power
    of the final time times the norm of the integrated conjugated quintic coefficient
    as the natural-number step count tends to infinity.
