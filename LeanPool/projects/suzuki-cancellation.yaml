slug: suzuki-cancellation
title: Cancellation-aware error bounds for the fourth-order Suzuki formula
summary: In complete normed algebras with two-sided contractive exponentials, the binary
  fourth-order Suzuki splitting has a global error expansion through the centered
  septic term and an eighth-order remainder at fixed nonnegative time. For skew-adjoint
  generators in a complete C*-algebra, the integral of the transported quintic
  coefficient determines the leading error norm.
