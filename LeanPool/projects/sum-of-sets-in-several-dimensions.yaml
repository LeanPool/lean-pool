slug: sum-of-sets-in-several-dimensions
title: Sum of sets in several dimensions
summary: Proves Ruzsa's lower bound for sumsets in R^D. If A and B are finite with B
  nonempty, |B| ≤ |A| and A + B of affine dimension d, then
  |A + B| ≥ |A| + Σ_{t=1}^{|B|-1} min(d, |A| - t), and this bound is attained in R^d
  whenever d ≥ 1 and |A| ≥ d + 1, so it is the exact minimum. Derives the asymmetric
  form of Freiman's lemma, |A + B| ≥ |A| + d|B| - d(d+1)/2. Defines the Freiman
  dimension of a finite subset of a commutative monoid, transfers the bound to sets
  with a Freiman model in R^r, and shows that a set X with |X + X| ≤ κ|X| has Freiman
  dimension at most 2κ - 1 and at most κ - 1 + κ(2κ - 1)/|X|.
