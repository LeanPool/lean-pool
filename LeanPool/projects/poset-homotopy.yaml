main_results:
- declaration: LeanPool.PosetHomotopy.homotopic_iff_eqvGen
  informal: Two continuous maps f and g between finite topological spaces are homotopic exactly
    when they are related by the equivalence relation generated by the relation "f₁ x
    specializes to f₂ x for every point x".
- declaration: LeanPool.PosetHomotopy.exists_retraction_of_isBeatPoint
  informal: If x is a beat point of the specialization order of a finite T₀ space X (the
    elements strictly below x have a largest element, or the elements strictly above x have a
    smallest one), then there is a retraction of X onto the complement of x whose composite with
    the inclusion is homotopic to the identity of X relative to that complement.
- declaration: LeanPool.PosetHomotopy.exists_homeomorph_of_homotopyEquiv
  informal: The underlying map of a homotopy equivalence between two finite T₀ spaces whose
    specialization orders have no beat points is a homeomorphism.
- declaration: LeanPool.PosetHomotopy.exists_invariant_core
  informal: If a group acts by homeomorphisms on a finite T₀ space X, then X has an invariant
    subspace whose specialization order has no beat points, with a retraction of X onto it whose
    composite with the inclusion is homotopic to the identity of X relative to the subspace.
- declaration: LeanPool.PosetHomotopy.exists_fixedPoint_of_contractibleSpace
  informal: A group acting by homeomorphisms on a contractible finite T₀ space has a fixed
    point.
- declaration: LeanPool.PosetHomotopy.homotopic_realizationMap_of_le
  informal: For monotone maps f ≤ g between preorders, the maps they induce between the
    realizations of the order complexes are homotopic.
- declaration: LeanPool.PosetHomotopy.contractibleSpace_of_conical
  informal: A preorder with an element x₀ and a monotone self-map f such that x ≤ f x and
    x₀ ≤ f x for every x has a contractible order complex realization.
- declaration: LeanPool.PosetHomotopy.chainEulerChar_modEq_of_fixedPoints
  informal: Let a finite group P act by monotone maps on a finite partial order T. If, for every
    nontrivial subgroup Q of P, the alternating count of the nonempty chains of the subposet of
    points fixed by Q, each chain σ counted with sign (-1)^(#σ + 1), equals 1, then the same
    count for T is congruent to 1 modulo the order of P.
- declaration: LeanPool.PosetHomotopy.chainSum_eq_one_of_closure
  informal: If a finite set S of a partial order carries a monotone, inflationary, idempotent
    self-map φ and some element q of S with φ q = q lies below φ z for every z in S, then the
    alternating count of the nonempty chains contained in S is 1.
- declaration: LeanPool.PosetHomotopy.contractibleSpace_of_normal
  informal: Consider the poset of nontrivial subgroups H of G in which every element
    is killed by some power of p. If one such H is normal in G, the realization of the
    order complex of this poset is contractible.
- declaration: LeanPool.PosetHomotopy.contractibleSpace_withUpperSet_iff
  informal: For a finite group G and a natural number p, the poset of nontrivial p-subgroups of
    G with its upper-set topology is a contractible space exactly when G has a nontrivial normal
    p-subgroup.
- declaration: LeanPool.PosetHomotopy.eulerChar_pSubgroupPoset_modEq
  informal: For a finite group G and a prime p, the alternating count of the nonempty chains of
    nontrivial p-subgroups of G, each chain σ counted with sign (-1)^(#σ + 1), is congruent to 1
    modulo the largest power of p dividing the order of G.
