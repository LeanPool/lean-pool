slug: poset-homotopy
title: Homotopy of finite spaces, posets and subgroup complexes
summary: The homotopy theory of finite spaces and of posets, applied to the posets of
  p-subgroups of a group. Two maps between finite spaces are homotopic exactly when a fence of
  pointwise comparable maps joins them; removing a beat point of a finite T₀ space leaves a
  strong deformation retract; a homotopy equivalence between finite T₀ spaces without beat
  points is a homeomorphism (Stong's classification); and a finite T₀ space with a group action
  has an invariant core, so that a contractible one has a fixed point. For order complexes,
  comparable monotone maps realize to homotopic maps, through an explicit prism homotopy, and a
  conical preorder has a contractible realization. If a finite group acts monotonically on a
  finite poset and the alternating count of nonempty chains of every nontrivial subgroup's
  fixed subposet is 1, that count for the poset is 1 modulo the order of the group. The
  realization of the poset of nontrivial subgroups satisfying Mathlib's elementwise p-group
  condition is contractible when one of those subgroups is normal, following the proof of
  Quillen's Proposition 2.4. For finite groups, the poset with its upper-set topology is
  contractible exactly when such a normal subgroup exists (Stong). For finite groups and
  prime p, the alternating nonempty-chain count is 1 modulo the p-part of the group order
  (Brown's congruence).
