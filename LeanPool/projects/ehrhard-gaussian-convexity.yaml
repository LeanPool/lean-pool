slug: ehrhard-gaussian-convexity
title: Ehrhard's inequality and Gaussian log-MGF convexity
summary: Ehrhard's convex-set inequality for finite-dimensional Gaussian laws,
  including singular covariance, and convexity at every real order of the
  normalized logarithmic moment-generating function of a finite convex Gaussian
  functional with all positive exponential moments. Includes Gaussian interpolation,
  quantile transport, representation of Ehrhard-type laws as monotone convex
  Gaussian images, weak closure, and normalized moment bounds.
