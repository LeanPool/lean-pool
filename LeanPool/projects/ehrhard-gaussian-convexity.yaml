main_results:
- declaration: EhrhardGaussian.ehrhard_inequality
  informal: For a finite-dimensional Gaussian law, convex sets A and B, and
    t in [0,1], Gaussian CDF lower thresholds a and b for their probabilities
    give the CDF lower threshold (1-t)a+tb for the probability of their
    Minkowski combination. Singular covariance and unit masses are allowed;
    a zero-mass set has no finite admissible threshold.
- declaration: EhrhardGaussian.gaussian_convexity
  informal: For a finite convex real function of a finite-dimensional Gaussian
    vector with every positive exponential moment finite, log E[exp(qF)]/q,
    defined at q=0 by E[F], is convex on the whole real line.
- declaration: EhrhardGaussian.Provider.ehrhardType_representation
  informal: A real probability law is of Ehrhard type exactly when it is the
    pushforward of the standard Gaussian law by a finite monotone convex function;
    constant functions and Dirac laws are included.
- declaration: EhrhardGaussian.Provider.ehrhardType_weakClosure
  informal: The weak limit of a sequence of Ehrhard-type real probability laws
    is again of Ehrhard type.
- declaration: EhrhardGaussian.Provider.ehrhardType_momentBounds
  informal: An Ehrhard-type law with integrable exponential and E[exp(X)]=1 has
    an integrable square, variance at most -2 E[X], and the stated Gaussian
    negative exponential-moment bounds. A finite second positive exponential
    moment yields the further normalized moment comparison.
