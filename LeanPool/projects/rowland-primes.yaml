main_results:
- declaration: RowlandPrimes.rowland_diff_eq_one_or_prime
  informal: For Rowland's sequence a(1) = 7, a(n) = a(n - 1) + gcd(n, a(n - 1)), every
    increment a(n) - a(n - 1) with n >= 2 is 1 or a prime (Rowland 2008, Theorem 1; the
    statement of Formal Conjectures' RowlandSequence.rowland_diff_eq_one_or_prime).
- declaration: RowlandPrimes.increment_eq_one_or_minFac
  informal: For any sequence obeying a(n + 1) = a(n) + gcd(n + 1, a(n)) for n >= n0, if
    N >= n0, N >= 2 and a(N) = 3N, then for every n >= N the increment a(n + 1) - a(n) is
    either 1 or equal to the least prime factor of 2M - 1 for a checkpoint M with
    n + 1 = M + (minFac(2M - 1) - 1)/2 (the r = 3 case of Rowland's Lemma 1, iterated).
- declaration: RowlandPrimes.isCheckpoint_next
  informal: If a(N) = 3N with N >= 2 (and the recurrence holds from N on), then
    a(N + (p - 1)/2) = 3(N + (p - 1)/2), where p is the least prime factor of 2N - 1.
- declaration: RowlandPrimes.infinite_setOf_prime_rowlandDiff
  informal: Infinitely many increments of Rowland's sequence are prime.
- declaration: RowlandPrimes.rowlandSeqFrom_532_composite
  informal: With first term a(1) = 532 instead of 7, the increment a(18) - a(17) equals 9,
    which is not prime.
