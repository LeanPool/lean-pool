slug: rowland-primes
title: Rowland's prime-generating recurrence
summary: Proves Rowland's 2008 theorem that the sequence a(1) = 7, a(n) = a(n - 1) +
  gcd(n, a(n - 1)) has every increment a(n) - a(n - 1), n >= 2, equal to 1 or a prime, in the
  form stated without proof in Formal Conjectures. The core is the r = 3 case of Rowland's Lemma 1,
  proved for any sequence obeying the recurrence from some index on - from a point N >= 2 with
  a(N) = 3N the increments are 1 until the step into N + (p - 1)/2, which adds the least prime
  factor p of 2N - 1 and lands again on a = 3n. Consequences - no increment is 2, infinitely
  many increments are prime, a closed form between checkpoints, and a kernel-checked example
  showing that the first term matters (a(1) = 532 gives the composite increment 9 at n = 18).
