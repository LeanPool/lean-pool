slug: high-dimensional-steiner-spanners
title: Polynomial lower bounds for high-dimensional Steiner spanners
summary: >-
  For every real p at least one and constant stretch, some arbitrarily large
  point sets in real ell-p spaces force polynomial edge overhead in every
  non-metric Steiner spanner.
  Includes CSP code constructions, finite Bernoulli moment estimates, nearest
  terminal projection, Hamming-code hubs, Gaussian concentration, and linear
  Euclidean-to-ell-p embeddings.
