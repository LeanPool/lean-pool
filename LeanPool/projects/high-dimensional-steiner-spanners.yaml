main_results:
  - declaration: HighDimSteinerSpanners.thm_1_3_non_metric_steiner_spanner_lower_bound
    informal: >-
      For every real p at least one and constant stretch C at least one, arbitrarily
      large bounded-aspect-ratio point sets in dimension proportional to log n
      require at least a constant times n to the power 1+c edges in every
      non-metric Steiner spanner, with an explicit positive lower bound on c.
  - declaration: HighDimSteinerSpanners.thm_1_2_geometric_spanner_lower_bound
    informal: The same polynomial edge lower bound holds for geometric ell-p spanners.
  - declaration: HighDimSteinerSpanners.cor_1_4_lp_dvoretzky_lower_bound
    informal: >-
      For p greater than two, a polynomial edge lower bound holds in dimension
      proportional to the p-over-two power of log n, with an exponent bound
      independent of p.
  - declaration: HighDimSteinerSpanners.thm_2_3_locally_list_bounded_csp_codes
    informal: >-
      Constructs arbitrarily large finite codes with many exact-distance pairs,
      separation, and bounded local witness lists and overlaps.
  - declaration: HighDimSteinerSpanners.prop_3_4_three_hop_hypercube_collapse
    informal: >-
      High-rate hypercube subsets admit sparse three-hop Steiner paths in a
      prescribed Hamming-distance window. Under minimum separation this extends
      to all terminal pairs. Also constructs a sparse three-hop spanner for the
      full hypercube.
