main_results:
- declaration: MatrixMultiplicationAllFields.SpectralBooks.square_exponent
  informal: Over every field, the exponent of division-free square matrix multiplication
    in the formal polynomial model is 9/4.
- declaration: MatrixMultiplicationAllFields.SpectralBooks.dual_exponent
  informal: The dual exponent for multiplying rectangular matrices is 1/2 over
    every field.
- declaration: MatrixMultiplicationAllFields.SpectralBooks.rectangular_exponent
  informal: Over every field, the exact rectangular exponent is a symmetric function
    of the three nonnegative parts of its dimension weights.
