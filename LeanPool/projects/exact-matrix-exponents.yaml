slug: exact-matrix-exponents
title: Exact square, dual and rectangular matrix multiplication exponents
summary: Determines the arithmetic exponent of square matrix multiplication as 9/4
  over every field and the dual exponent as 1/2. It also gives a symmetric formula
  for the rectangular exponent, using formal polynomial identities in division-free
  arithmetic programs. The pinned Lean source states all three exact results.
  The accompanying preprint gives the square equality for circuits allowing
  division and states bounds for the dual exponent and rectangular rank.
