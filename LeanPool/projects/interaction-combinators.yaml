slug: interaction-combinators
title: Lafont's interaction combinators
summary: Formalizes interaction nets, reduction modulo wire substitutions, strong confluence,
  and Lafont's construction of a strict translation from any well-formed interaction system
  over a finite signature into the three interaction combinators.
