main_results:
- declaration: INet.Comb.universal
  informal: Every well-formed interaction system over a finite signature translates into
    Lafont's system of three interaction combinators, with rule reductions simulated up to wire
    equivalence.
- declaration: INet.Comb.universal_strict
  informal: The translation can be chosen so that the image of every source symbol begins
    with a cell.
