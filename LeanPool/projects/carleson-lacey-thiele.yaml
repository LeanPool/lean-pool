main_results:
- declaration: CarlesonLT.anisotropic_carleson
  informal: >-
    For positive integer anisotropies and sufficient multiplier smoothness, the
    associated maximally modulated multiplier operator obeys a weak L² bound on
    Schwartz functions, with a constant independent of the multiplier and function.
- declaration: CarlesonLT.classical_carleson
  informal: >-
    The symmetric Fourier partial sums of a 2π-periodic function that is square
    integrable on one period converge to the function almost everywhere on the real line.
