slug: carleson-lacey-thiele
title: Anisotropic Carleson bounds and almost-everywhere Fourier convergence
summary: >-
  Weak (2,2) bounds for maximally modulated anisotropically homogeneous smooth
  multipliers on Euclidean space, following the Lacey–Thiele time-frequency method,
  and almost-everywhere convergence of the Fourier series of periodic L² functions.
branch: harmonic analysis
