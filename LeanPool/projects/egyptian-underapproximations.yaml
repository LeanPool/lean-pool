main_results:
- declaration: Egyptian.eventuallyGreedy
  informal: For each positive rational target and either the nondecreasing or strictly increasing convention, among strict reciprocal underapproximations with denominators at least two, a single maximizing prefix extends optimally at every later length with the uniquely maximizing greedy tail of its remainder.
  source_ref: Theorem 1
- declaration: Egyptian.asymptoticRigidity
  informal: For every positive rational target a benchmark nondecreasing reciprocal expansion with denominators at least two exists. Each benchmark has a finite positive limit of the normalized denominator growth. Every nondecreasing reciprocal expansion of the same target with denominators at least two has a strictly smaller growth liminf or eventually agrees with that benchmark term by term.
  source_ref: Theorem 4
