main_results:
- declaration: Egyptian.eventuallyGreedy
  informal: For either denominator ordering convention, one maximizing prefix works at every later length when followed by the uniquely maximizing greedy tail for its remainder.
  source_ref: Theorem 1
- declaration: Egyptian.asymptoticRigidity
  informal: An optimizing nondecreasing reciprocal expansion has finite positive normalized denominator growth. Every competing expansion of the same rational target has strictly smaller lower growth limit or eventually agrees term by term.
  source_ref: Theorem 4
