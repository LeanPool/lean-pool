slug: egyptian-underapproximations
title: Eventually greedy best Egyptian underapproximations
summary: For every positive rational target, best strict Egyptian underapproximations can be constructed from a common optimal prefix followed by a uniquely optimal greedy tail. Among nondecreasing reciprocal expansions, matching the extremal asymptotic growth forces eventual agreement with an optimizing sequence.
branch: Egyptian fractions and discrete optimal control
