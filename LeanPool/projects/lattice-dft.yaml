main_results:
- declaration: DFT.generic_hk_lattice_fermions_w
  informal: >-
    For N interacting spinless fermions on a connected M-site graph with
    0 < N < M and symmetric hopping amplitudes of a common sign, potentials
    whose ground state is shared by a potential differing by more than a
    constant lie in a closed, nowhere dense Lebesgue null set.
- declaration: DFT.dimH_nonUVDens_lattice_fermions_w
  informal: >-
    On an M-site graph under the same hypotheses, densities from nondegenerate
    ground states shared with an inequivalent potential have Hausdorff dimension
    at most M minus three, truncated at zero.
- declaration: DFT.ks_potential_exists_interior
  informal: >-
    A lattice density with all occupations strictly between zero and one
    and total occupation N is a ground-state ensemble density for a
    noninteracting Kohn–Sham potential.
- declaration: DFT.lattice_myksoda
  informal: >-
    The regularized lattice Kohn–Sham iteration decreases the regularized
    energy and has a quasi-density accumulation point. The energy of the
    full sequence converges to its minimum. Along each convergent quasi-density
    subsequence, the Kohn–Sham potentials converge to a potential yielding
    a minimizing reference density.
