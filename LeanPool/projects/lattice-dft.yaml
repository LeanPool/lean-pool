slug: lattice-dft
title: Density-functional theory for lattice fermions
summary: >-
  Develops density-functional theory for spinless fermions on finite graphs.
  It proves generic uniqueness of the potential up to a constant, bounds the
  Hausdorff dimension of exceptional densities, and develops lattice Kohn–Sham
  representability. It proves full regularized energy convergence and
  potential convergence along convergent quasi-density subsequences.
