main_results:
- declaration: DFT.generic_hk_lattice_fermions_w
  informal: >-
    For N spinless fermions on a connected M-site graph, assume 0 < N < M,
    symmetric hopping of a common sign on the edges, and interactions diagonal
    in the occupation basis. The potentials whose ground state is shared by a
    potential differing by more than a constant lie in a closed, nowhere dense,
    Lebesgue-null set.
- declaration: DFT.dimH_nonUVDens_lattice_fermions_w
  informal: >-
    For N spinless fermions with 0 < N < M on a connected M-site graph,
    assume symmetric common-sign edge hopping and an interaction diagonal in
    the occupation basis. Densities of normalized, nondegenerate ground states
    shared with a second potential differing by more than a constant have
    Hausdorff dimension at most M minus three, truncated at zero.
- declaration: DFT.ks_potential_exists_interior
  informal: >-
    For N spinless fermions on an M-site graph with 0 < N < M, fix any
    uniform real hopping amplitude on that graph. A density with each
    occupation strictly between zero and one and total occupation N is
    realized by a ground-state ensemble for a site potential of the
    noninteracting Hamiltonian with that hopping.
- declaration: DFT.lattice_myksoda
  informal: >-
    Take a positive regularization parameter and real symmetric interacting
    and reference Hamiltonians on the same nonempty finite configuration
    space with a common occupation map. For sequences satisfying the
    MYKSODA update equations, the regularized energy is nonincreasing and
    the full energy sequence converges to its minimum. The quasi-density
    sequence has an accumulation point. Along each convergent quasi-density
    subsequence, the corresponding Kohn–Sham potentials converge to a
    potential yielding a minimizing reference density.
