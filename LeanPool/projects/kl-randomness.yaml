slug: kl-randomness
title: Kolmogorov–Loveland and Martin–Löf randomness
summary: >-
  Formalizes the separation of Martin–Löf randomness from Kolmogorov–Loveland
  randomness for binary sequences under Liu and Meng's convention of total
  fresh scans and uniformly computable real capital. It also proves that
  randomness for base-four strategies need not imply binary
  Kolmogorov–Loveland randomness under adjacent-bit grouping. The proof
  develops effective open tests, methods for conditioning on parity
  constraints, and success-preserving transformations of betting strategies.
