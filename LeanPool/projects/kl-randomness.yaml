main_results:
- declaration: Klr.martinLofRandom_ssubset_kolmogorovLovelandRandom
  informal: >-
    The binary sequences avoiding all Martin–Löf tests form a proper subset
    of those on which every total fresh computable betting strategy with
    nonnegative fair and uniformly computable real capital has bounded capital.
- declaration: Klr.exists_not_martinLofRandom_no_partial_rational_success
  informal: >-
    Some binary sequence fails a Martin–Löf test while every infinite fresh
    run of a partial rational-wager program on that sequence has bounded capital.
- declaration: Klr.binary_random_ssubset_baseFour_random
  informal: >-
    The binary Kolmogorov–Loveland random sequences form a proper subset of
    the sequences whose adjacent-bit pairs are Kolmogorov–Loveland random
    digits in base four, with total computable-real strategies in both bases.
    This is an additional upstream result from pull request 3, separate
    from the result registered with Palomar.
