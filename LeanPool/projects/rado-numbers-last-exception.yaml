slug: rado-numbers-last-exception
title: The Last Exception for Two-Colour Rado Numbers
summary: >-
  Determines the exact last exception c*(k) for the 2-colour Rado number R(c, k)
  of x + y + c = kz for every integer k ≥ 3, where c*(k) = k(k² + k − 4)/2 for odd k
  and k(k² − 2)/2 for even k. Proves both halves unconditionally in pure core Lean 4
  (zero Mathlib imports): (1) an original reflection proof (x ↦ N + 1 − x) combined with
  Martinelli and Schaal's lower bound showing R(c, k) = LB(c, k) for every valid c > c*(k)
  (k odd or c even), and (2) an explicit boundary colouring avoiding monochromatic
  solutions on [1, LB(c*(k), k)]. Finite existence of R(c*(k), k) is left outside
  the formalization. As a corollary, the project characterizes the
  cutoff ν(k) and settles the Kim–Song–Hwang (2023) conjecture ν(5) = 66.
branch: extremal combinatorics and Ramsey theory
