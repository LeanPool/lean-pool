main_results:
- declaration: RadoNu.rado_last_exception
  informal: >-
    For every k ≥ 3, (1) for every valid c > c*(k) (meaning k is odd or c is even),
    every 2-colouring of [1, LB(c, k)] has a monochromatic solution of x + y + c = kz while
    some 2-colouring of [1, LB(c, k) − 1] has none, and (2) some 2-colouring of
    [1, LB(c*(k), k)] has no monochromatic solution of x + y + c*(k) = kz.
    Finite existence of R(c*(k), k) is left outside the formalization.
- declaration: RadoNu.rado_eq_LB
  informal: >-
    For every k ≥ 3 and every valid c > c*(k), the 2-colour Rado number R(c, k)
    of x + y + c = kz equals the Martinelli–Schaal lower bound LB(c, k).
- declaration: RadoNu.not_forced_cstar
  informal: >-
    For every k ≥ 3, [1, LB(c*(k), k)] is not forced for x + y + c*(k) = kz, i.e.,
    there exists a 2-colouring of [1, LB(c*(k), k)] avoiding monochromatic solutions.
- declaration: RadoNu.nu_iff
  informal: >-
    For every k ≥ 3 and natural number v, R(c, k) = LB(c, k) holds for all valid
    c ≥ v if and only if c*(k) < v; hence the least integer cutoff is c*(k) + 1 and the
    least valid cutoff ν(k) is c*(k) + 1 for odd k and c*(k) + 2 for even k.
- declaration: RadoNu.nu_5_eq_66
  informal: >-
    Settles the Kim–Song–Hwang (2023) conjecture ν(5) = 66: R(c, 5) = LB(c, 5) for
    all c ≥ 66, and fails for c = 65.
- declaration: RadoNu.rado_last_exception_rado
  informal: >-
    Restates the both-halves characterization using IsRado and Forced, including
    that any Rado number R satisfying IsRado (c*(k)) k R must strictly exceed LB(c*(k), k).
- declaration: RadoNu.nu_small_values
  informal: >-
    Verifies by kernel decide that the least valid cutoffs ν(k) for k = 3..10 equal
    13, 30, 66, 104, 183, 250, 388, and 492.
