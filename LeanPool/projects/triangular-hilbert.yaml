slug: triangular-hilbert
title: The symmetric triangular Hilbert form
summary: >-
  Proves the symmetric L³ estimate and principal-value existence for the
  triangular Hilbert form on complex Schwartz inputs, and its unique bounded
  trilinear extension to L³. The proof develops matrix trace estimates, Gaussian
  scale kernels, heat-flow identities and the passage from finite lattice sums
  to the Euclidean estimate. As an application it reduces continuous periodic
  Fourier convergence to the triangular estimate through localized modulated
  kernel estimates. Lean Pool's CarlesonLT project proves the convergence theorem
  for periodic functions that are square-integrable on a period.
