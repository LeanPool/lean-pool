main_results:
  - declaration: Triangular.triangular_ht_bound
    informal: >-
      The norm of the triangular Hilbert trilinear form is at most an absolute
      constant times the product of the three L³ norms for complex Schwartz inputs.
  - declaration: Triangular.Auto.tendsto_truncatedForm
    informal: The trilinear truncations converge to the principal value as the cutoff decreases to zero.
  - declaration: Triangular.Auto.triangularHilbert_unique_extension
    informal: >-
      The principal-value form extends uniquely to a continuous complex
      trilinear form on L³, with the same norm bound.
