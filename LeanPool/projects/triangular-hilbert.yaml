slug: triangular-hilbert
title: The triangular Hilbert form and Carleson's theorem
summary: >-
  Proves the symmetric L³ estimate and principal-value existence for the
  triangular Hilbert form on complex Schwartz inputs, and its unique bounded
  trilinear extension to L³. Uses the trilinear estimate to deduce almost-everywhere convergence of symmetric Fourier
  partial sums for continuous one-periodic functions. The proof develops
  matrix trace estimates, Gaussian scale kernels, heat-flow identities and
  the passage from finite lattice sums to the Euclidean estimate.
