slug: read-l1
title: Read's invariant-subspace counterexample on complex ℓ¹
summary: >-
  Constructs a bounded linear operator on the complex Banach space ℓ¹ with
  no nontrivial closed invariant subspace. The proof follows Wiesław Śliwa's
  explicit form of Charles Read's construction. It verifies a concrete
  growth sequence, constructs the operator first on finitely supported
  sequences, and proves that every nonzero vector is cyclic. The development
  includes the bounded extension from coordinate images, polynomial
  truncation estimates, and the finite-rank projections used in the proof.
