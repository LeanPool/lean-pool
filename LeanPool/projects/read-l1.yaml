      A bounded complex-linear operator on ℓ¹ has no closed invariant
      subspace other than zero and the whole space.
  - declaration: ReadL1.norm_readOp_le
    informal: >-
      Under the construction's growth inequalities, the operator extending
      Śliwa's rule for the finitely supported vectors has norm at most eight.
  - declaration: ReadL1.theorem7Hyp_dRead
