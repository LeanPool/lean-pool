slug: classical-matching-factors
title: Classical matching and factor theorems in finite graphs
summary: >-
  Develops augmenting-path and odd-component certificates for maximum matchings,
  bipartite matching-cover duality, perfect matchings in bridgeless cubic graphs,
  Tutte's f-factor criterion, and decompositions of even-regular graphs into
  two-factors. Includes the finite Dilworth and Mirsky partition theorems as an
  order-theoretic companion. All graph results use Mathlib's SimpleGraph and
  matching predicates. Hall's and Tutte's one-factor theorems are imported from
  Mathlib; the general matching and factor conclusions are proved here.
  The collection integrates five Palomar-registered developments and does not
  claim new mathematical results or a formalization of polynomial-time algorithms.
