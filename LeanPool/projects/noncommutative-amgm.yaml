slug: noncommutative-amgm
title: Noncommutative arithmetic–geometric mean bounds for ordered products
summary: >-
  Bounds the mean of products of m distinct real positive semidefinite matrices
  in Loewner order when their sum is at most nI. Proves the two-sided quadratic
  threshold, the original sine-node and cubic criteria, and the strengthened
  lower bounds, using harmonic decomposition and Chebyshev quadrature on
  Boolean slices.
branch: matrix inequalities
