main_results:
- declaration: NoncommutativeAMGM.withoutReplacementMean_quadratic_bounds
  informal: The mean lies between −I and I when n ≥ 2⌈m/2⌉².
- declaration: NoncommutativeAMGM.withoutReplacementMean_rounded_lower
  informal: The mean is at least (−1 + 1/(2m))I when n ≥ 4m².
- declaration: NoncommutativeAMGM.withoutReplacementMean_endpoint_lower
  informal: Keeping the zero-slice endpoint yields the lower bound (−1 + 1/m)I at the quadratic threshold.
- declaration: NoncommutativeAMGM.withoutReplacementMean_sine_bounds
  informal: The paper's sine-node criterion implies the two-sided bound.
- declaration: NoncommutativeAMGM.withoutReplacementMean_cubic_bounds
  informal: The sufficient condition m³ ≤ 2n implies the two-sided bound.
