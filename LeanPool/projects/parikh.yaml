main_results:
- declaration: Parikh.parikhImage_isSemilinear_of_isContextFree
  informal: >-
    For every context-free language over a finite alphabet, its set of letter-count
    vectors is semilinear in Mathlib's sense.
- declaration: Parikh.exists_regularLanguage_with_parikhImage
  informal: >-
    Every semilinear set of natural-number vectors indexed by a finite alphabet is
    exactly the letter-count image of some regular language.
- declaration: Parikh.compileGrammar_correct
  informal: >-
    For every encoded finite grammar, the compiled finite representation denotes
    exactly the letter-count image of its decoded Mathlib grammar language.
- declaration: Parikh.compileGrammar_size_bounds
  informal: >-
    The compiled representation satisfies the explicit component-count, period-count,
    base-norm and period-norm bounds determined by the encoded grammar's size.
- declaration: Parikh.compileGrammar_bit_bound
  informal: >-
    The compiled representation's numerical entries satisfy the declared total bit
    budget, and every base and period coordinate fits its coordinate bit width.
