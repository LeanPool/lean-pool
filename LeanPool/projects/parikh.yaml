slug: parikh
title: Parikh's theorem and a certified semilinear grammar compiler
summary: >-
  Proves that the letter-count image of every context-free language over a finite
  alphabet is semilinear, using Mathlib's language, grammar and semilinear-set
  definitions. Proves the converse realization by a regular language and computes
  exact finite semilinear representations for encoded finite grammars, with
  component, period, coordinate and bit-budget bounds. Preserves production-labelled
  derivation trees, bounded decomposition, context activation and word-block automata.
  The language theorem does not require a finite ambient nonterminal type.
