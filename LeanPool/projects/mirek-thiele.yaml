main_results:
- declaration: MirekThiele.localT1
  informal: In positive dimension, a perfect multilinear Calderón–Zygmund form satisfying the local
    T(1) testing bound obeys a uniform Hölder bound on all dyadic test tuples,
    with a constant depending only on dimension, arity, exponents and testing bound.
- declaration: MirekThiele.localTb_all
  informal: In positive dimension, admissible collections of paths and testing functions satisfying
    the support, mean, norm, interdependence and local testing conditions imply
    the uniform Hölder bound, for every path length between one and the arity.
- declaration: MirekThiele.globalTb_all
  informal: In positive dimension, locally dyadic, bounded pseudo-accretive testing functions satisfying
    scale-normalized weak boundedness and BMO testing on functions with integrable
    dyadic square function imply a uniform Hölder bound for the perfect form.
- declaration: MirekThiele.carlesonEmbedding
  informal: In positive dimension, dyadic martingale averages and differences satisfy outer Lp bounds
    for every finite exponent greater than one, with constants depending only
    on the dimension and exponent.
