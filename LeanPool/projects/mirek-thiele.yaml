slug: mirek-thiele
title: Perfect multilinear local T(b) theorems
summary: Proves the perfect multilinear local T(1) and T(b) theorems with
  interdependent testing families. Develops dyadic stopping times, pruning,
  outer-measure interpolation and Carleson embedding. Also proves a global
  variant for locally dyadic testing functions with scale-normalized weak
  boundedness and finite-Hardy-norm BMO testing.
