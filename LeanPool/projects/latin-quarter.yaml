main_results:
  - declaration: LatinQuarter.Textbook.completions_even
    informal: >-
      Every set of fewer than floor(n²/4) filled triples of an order-n partial
      Latin square has an even number of labelled Latin-square completions.
  - declaration: LatinQuarter.Textbook.scs_eq_quarter
    informal: >-
      For every positive n, the smallest critical-set size among all Latin
      squares of order n, and the smallest critical-set size in the cyclic
      Latin square, both equal floor(n²/4).
  - declaration: LatinQuarter.defining_set_lower_bound
    informal: >-
      Every defining set in every labelled Latin square of order n has at least
      floor(n²/4) cells.
  - declaration: LatinQuarter.cornerSet_isCritical
    informal: >-
      For every positive n, the two opposite corner triangles form a critical
      set in the cyclic Latin square.
