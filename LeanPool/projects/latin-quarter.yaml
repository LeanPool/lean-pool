slug: latin-quarter
title: The smallest critical set in a Latin square
summary: >-
  Proves that every partial Latin square of order n with fewer than floor(n²/4)
  filled cells has an even number of completions. Consequently every defining
  set has at least floor(n²/4) entries, and the two corner triangles in the cyclic
  square attain this bound as a critical set. Includes general results on matrix
  minors, square-zero ideals, and square-free polynomial coefficients.
