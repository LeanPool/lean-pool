slug: hajnal-szemeredi
title: The Hajnal–Szemerédi theorem on equitable vertex colourings
summary: >-
  Every finite simple graph of maximum degree at most r admits a proper colouring
  with r + 1 colours whose class sizes differ by at most one. When the vertex count
  is s(r + 1), every class can have exactly s vertices. The proof follows the
  Kierstead–Kostochka argument, preserving finite-subgraph and arbitrary-palette
  recolouring, reachability, terminal-class and discharging infrastructure.
  The polynomial-time algorithm from Section 3 is outside the imported scope.
