main_results:
- declaration: HajnalSzemeredi.hajnalSzemeredi
  informal: >-
    Every finite simple graph whose vertex degrees are at most r has a proper
    colouring by Fin (r + 1) such that the size of any colour class is at most
    the size of any other colour class plus one.
- declaration: HajnalSzemeredi.hajnalSzemeredi_exact
  informal: >-
    If a finite simple graph has s(r + 1) vertices and every vertex degree is at
    most r, it has a proper colouring by Fin (r + 1) with every class of size s.
- declaration: HajnalSzemeredi.core
  informal: >-
    For any finite vertex subset S and finite natural-number palette P of size
    r + 1, if S has s(r + 1) vertices and every vertex has at most r neighbours
    within S, there is a proper colouring of S in P with all classes of size s.
