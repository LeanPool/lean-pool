main_results:
- declaration: TuranStability.furedi
  informal: A clique-free graph near Turán's edge bound has a large colourable subgraph.
  source_ref: Füredi's stability theorem.
- declaration: TuranStability.stability
  informal: An L-free graph near the Turán density for a (p+1)-colourable L is
    close in edit distance to a complete p-partite graph.
  source_ref: Erdős–Simonovits stability theorem.
- declaration: RemovalLemma.graph_removal
  informal: Few labelled copies of any fixed graph H can be destroyed by deleting
    few edges.
  source_ref: Erdős–Frankl–Rödl graph removal lemma; formal source
    https://github.com/jtraverso/graph-removal-lemma/tree/589cf03ef1e4c80ea8cdd6be77778232c62dd37c.
- declaration: RemovalExtremalStability.stability_of_few_copies
  informal: A graph near the Turán density with few labelled L copies is close
    in edit distance to a complete multipartite graph.
