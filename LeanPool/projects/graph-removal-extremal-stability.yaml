slug: graph-removal-extremal-stability
title: Graph removal and extremal stability
summary: Formalizes the graph removal lemma for every fixed graph, Füredi's sharp
  stability inequality and Erdős–Simonovits stability for colourable forbidden
  graphs. A bridge theorem shows that near-extremal graphs with few labelled
  forbidden copies are close to a complete multipartite graph.
