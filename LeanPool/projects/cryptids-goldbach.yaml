- declaration: ConjectureMachines.Goldbach21.Semantics.halts_candidate_iff_not_goldbach
  informal: The explicit 21-state binary Turing machine halts from the blank tape if and
    only if some even natural number greater than two is not the sum of two primes.
- declaration: ConjectureMachines.Goldbach21.candidate_equivalent
  informal: The explicit 21-state and 25-state binary machines have the same blank-tape
    halting behavior.
- declaration: ConjectureMachines.Goldbach21.candidate_fewer_states
  informal: The candidate machine has 21 states, strictly fewer than the reference's 25.
- declaration: ConjectureMachines.Goldbach21.Semantics.halts_reference_iff_not_goldbach
  informal: The 25-state reference machine halts from the blank tape exactly when
