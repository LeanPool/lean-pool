slug: cryptids-goldbach
title: A 21-state Turing machine for Goldbach's conjecture
summary: A concrete 21-state binary Turing machine halts on the blank tape exactly when
  Goldbach's conjecture is false. The proof connects it to the earlier 25-state machine,
  verifies both machines' prime-search semantics, and preserves finite-machine execution,
  tape-scanning and reachability infrastructure. This imports only the Goldbach dependency
  closure of Cryptids, excluding its Riemann, ZF and Busy Beaver developments.
