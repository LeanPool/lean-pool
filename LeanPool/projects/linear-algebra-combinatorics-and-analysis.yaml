slug: linear-algebra-combinatorics-and-analysis
title: Singular values, minors and elementary matrices, with lemmas in combinatorics and analysis
summary: A collection of general results centred on linear algebra. For linear maps between
  finite-dimensional inner product spaces over ℝ or ℂ, its main result is an analogue of
  Ky Fan's subadditivity for the second elementary symmetric function of the n largest
  singular values. Ky Fan's subadditivity is reused from the pool. The included
  maximum-principle upper bound is a supporting restatement that follows from the pool's
  existing contraction-family bound and finite-dimensional gauge identity; no attainment
  theorem is claimed. Its cited reference remains K. Fan, "Maximum properties and inequalities
  for the eigenvalues of completely continuous operators", Proc. Natl. Acad. Sci. USA 37
  (1951), 760–766, Theorem 1 with m = 1. Proves the factorisation and unit determinant of the
  symmetric Pascal matrix and the trace of odd powers of a difference of two idempotent
  matrices, a characterisation of finite monoids with a right zero, continuity of currying for
  compact-open topologies out of an R1 space, quasi-sobriety of arbitrary products of
  quasi-sober spaces, an almost-everywhere diagonal bound for inner products of a
  non-measurable map, that C¹ self-maps of a finite-dimensional real space send meagre sets to
  meagre sets, and the congruence choose (p^a − 1) k ≡ (−1)^k mod p. Supporting files restate,
  in the forms these proofs use, results that also exist elsewhere, namely Cauchy–Binet for minors
  (in the pool and Tau Ceti), perfectness of E(n, A) and the Whitehead lemma (Tau Ceti), the
  finite q-binomial theorem (in the pool) and the class-two power formula (Tau Ceti); they are
  not headline claims.
