slug: linear-algebra-combinatorics-and-analysis
title: Singular values, minors and elementary matrices, with lemmas in combinatorics and analysis
summary: A collection of general results centred on linear algebra. For linear maps between
  finite-dimensional inner product spaces over ℝ or ℂ, proves Ky Fan's maximum principle and
  Ky Fan's inequality (the sum of the n largest singular values is subadditive) and an analogue
  for the second elementary symmetric function of the n largest singular values. Proves the
  Cauchy–Binet formula via exterior powers, the factorisation and unit determinant of the
  symmetric Pascal matrix, and the trace of odd powers of a difference of two idempotent
  matrices. Over an arbitrary (noncommutative) ring, proves that the elementary subgroup E(n, A)
  is perfect for n ≥ 3 and the Whitehead lemma diag(θ, θ⁻¹) ∈ E(2n, A). Around these, it proves
  the q-binomial theorem for Gaussian binomial coefficients, the congruence
  choose (p^a − 1) k ≡ (−1)^k mod p, the power formula (uv)^n = u^n v^n d^(n choose 2) in
  nilpotency class two, a characterisation of finite monoids with a right zero, continuity of
  currying for compact-open topologies out of an R1 space, quasi-sobriety of arbitrary products
  of quasi-sober spaces, an almost-everywhere diagonal bound for inner products of a
  non-measurable map, and that C¹ self-maps of a finite-dimensional real space send meagre sets
  to meagre sets.
