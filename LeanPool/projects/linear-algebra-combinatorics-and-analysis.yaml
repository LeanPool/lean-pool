main_results:
- declaration: LinearMap.sum_singularValues_add_le
  informal: For linear maps u, v between finite-dimensional inner product spaces over ℝ or ℂ
    and every n, the sum of the n largest singular values of u + v is at most the sum of the n
    largest singular values of u plus that of v (Ky Fan's inequality).
  source_ref: K. Fan, "Maximum properties and inequalities for the eigenvalues of completely
    continuous operators", Proc. Natl. Acad. Sci. USA 37 (1951), 760–766, inequality (20) in
    the proof of Theorem 5.
- declaration: LinearMap.norm_sum_inner_le_sum_singularValues
  informal: For pairwise orthogonal families (x_i) in E and (y_i) in F of vectors of norm at
    most 1, indexed by a finite set with at most n elements, the norm of the sum of the inner
    products ⟪y_i, T x_i⟫ is at most the sum of the n largest singular values of T (Ky Fan's
    maximum principle).
  source_ref: K. Fan, "Maximum properties and inequalities for the eigenvalues of completely
    continuous operators", Proc. Natl. Acad. Sci. USA 37 (1951), 760–766, Theorem 1 with m = 1.
- declaration: LinearMap.sum_powersetCard_two_prod_singularValues_add_le
  informal: Writing σ₂(T) for the second elementary symmetric function of the n largest
    singular values of T, σ₂(u + v) ≤ σ₂(u) + (∑_{j<n} s_j(u)) (∑_{j<n} s_j(v)) + σ₂(v).
- declaration: Matrix.det_mul_eq_sum_powersetCard
  informal: For an n × ι matrix A and an ι × n matrix B over a commutative ring, with ι a
    finite linear order, det (A B) is the sum over the n-element subsets s of ι of the product
    of the minor of A on the columns s and the minor of B on the rows s (Cauchy–Binet).
  source_ref: R. A. Horn and C. R. Johnson, Matrix Analysis, 2nd ed., Cambridge University
    Press (2013), Section 0.8.7.
- declaration: Matrix.det_pascal
  informal: Over every commutative ring, the n × n symmetric Pascal matrix with entries
    choose (i + j) i has determinant 1; it is the product of the lower unitriangular matrix
    (choose i j) and its transpose.
- declaration: Matrix.trace_sub_pow_odd_of_isIdempotentElem
  informal: For idempotent square matrices P and Q over a commutative ring and every k, the
    trace of (P − Q)^(2k+1) is tr P − tr Q.
- declaration: Matrix.isPerfect_elementarySubgroup
  informal: Over any ring A with unit, the subgroup E(n, A) of GL(n, A) generated by the
    elementary matrices 1 + a e_ij, i ≠ j, is perfect when n has at least three elements.
  source_ref: J. Milnor, Introduction to Algebraic K-Theory, Annals of Mathematics Studies 72,
    Princeton University Press (1971), §3.
- declaration: Matrix.exists_mem_elementarySubgroup_fromBlocks_inv
  informal: For any ring A with unit and every unit θ of the n × n matrix ring over A, the
    block diagonal matrix diag(θ, θ⁻¹) lies in the elementary subgroup E(n ⊕ n, A) (the
    Whitehead lemma).
  source_ref: J. Milnor, Introduction to Algebraic K-Theory, Annals of Mathematics Studies 72,
    Princeton University Press (1971), §3.
- declaration: prod_one_add_pow_mul_eq_sum_qBinomial
  informal: For q and t in a commutative ring, ∏_{i<n} (1 + q^i t) equals the sum over k ≤ n
    of q^(k choose 2) [n, k]_q t^k, where [n, k]_q is the Gaussian binomial coefficient (the
    q-binomial theorem).
  source_ref: G. E. Andrews, The Theory of Partitions, Addison-Wesley (1976), Chapter 3.
- declaration: Choose.choose_pow_sub_one_modEq_neg_one_pow
  informal: For a prime p and k ≤ p^a − 1, choose (p^a − 1) k is congruent to (−1)^k modulo p.
- declaration: mul_pow_eq_of_commute_commutator
  informal: In a group, if v u = d u v and d commutes with u and v, then
    (u v)^n = u^n v^n d^(n choose 2).
- declaration: Monoid.exists_forall_mul_eq_self_iff_of_finite
  informal: A finite monoid has an element p with u p = p for every u if and only if any two
    of its principal right ideals meet and every monoid morphism from it to a group is
    trivial.
- declaration: Homeomorph.curryOfR1Space
  informal: For X an R1 space (for instance Hausdorff) and Y locally compact, currying is a
    homeomorphism C(X × Y, Z) ≃ C(X, C(Y, Z)) for the compact-open topologies, with no
    hypothesis on Z.
- declaration: quasiSober_pi
  informal: An arbitrary product of quasi-sober topological spaces is quasi-sober.
- declaration: MeasureTheory.ae_norm_sq_le_of_ae_inner_le
  informal: For an s-finite measure m on T and any map f from T to a separable real inner
    product space, if ⟪f t, f t'⟫ ≤ M for m ⊗ m-almost every (t, t'), then ‖f t‖² ≤ M for
    m-almost every t.
- declaration: ContDiffOn.isMeagre_image
  informal: If f is C¹ on an open subset A of a finite-dimensional real normed space E, with
    values in E, then f sends meagre subsets of A to meagre subsets of E.
