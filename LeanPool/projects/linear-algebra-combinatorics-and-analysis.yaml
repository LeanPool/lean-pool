main_results:
- declaration: LinearMap.sum_powersetCard_two_prod_singularValues_add_le
  informal: Writing σ₂(T) for the second elementary symmetric function of the n largest
    singular values of T, σ₂(u + v) ≤ σ₂(u) + (∑_{j<n} s_j(u)) (∑_{j<n} s_j(v)) + σ₂(v).
- declaration: Matrix.det_pascal
  informal: Over every commutative ring, the n × n symmetric Pascal matrix with entries
    choose (i + j) i has determinant 1; it is the product of the lower unitriangular matrix
    (choose i j) and its transpose.
- declaration: Matrix.trace_sub_pow_odd_of_isIdempotentElem
  informal: For idempotent square matrices P and Q over a commutative ring and every k, the
    trace of (P − Q)^(2k+1) is tr P − tr Q.
- declaration: Choose.choose_pow_sub_one_modEq_neg_one_pow
  informal: For a prime p and k ≤ p^a − 1, choose (p^a − 1) k is congruent to (−1)^k modulo p.
- declaration: Monoid.exists_forall_mul_eq_self_iff_of_finite
  informal: A finite monoid has an element p with u p = p for every u if and only if any two
    of its principal right ideals meet and every monoid morphism from it to a group is
    trivial.
- declaration: Homeomorph.curryOfR1Space
  informal: For X an R1 space (for instance Hausdorff) and Y locally compact, currying is a
    homeomorphism C(X × Y, Z) ≃ C(X, C(Y, Z)) for the compact-open topologies, with no
    hypothesis on Z.
- declaration: quasiSober_pi
  informal: An arbitrary product of quasi-sober topological spaces is quasi-sober.
- declaration: MeasureTheory.ae_norm_sq_le_of_ae_inner_le
  informal: For an s-finite measure m on T and any map f from T to a separable real inner
    product space, if ⟪f t, f t'⟫ ≤ M for m ⊗ m-almost every (t, t'), then ‖f t‖² ≤ M for
    m-almost every t.
- declaration: ContDiffOn.isMeagre_image
  informal: If f is C¹ on an open subset A of a finite-dimensional real normed space E, with
    values in E, then f sends meagre subsets of A to meagre subsets of E.
