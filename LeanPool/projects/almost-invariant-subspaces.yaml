main_results:
- declaration: KPFullFinal.kp_family_finite_form_sharp
  informal: For an equivariant nonempty family over a division ring in any
    dimension, a pairwise quotient-rank bound r yields an invariant finite sum
    of finite intersections. Its two directed errors are at most r and r times
    the sum of the ceilings of (r + 1) divided by j for j from 1 to r.
- declaration: KPFullFinal.kp_family_canonical
  informal: The chosen subspace can be fixed by every order automorphism of the
    subspace lattice that permutes the given family.
- declaration: KPFullFinal.kp_family_finite_form_lattice
  informal: The same finite-sum and quantitative conclusions hold for a group
    acting on a submodule lattice over an arbitrary ring, with module length
    in place of quotient rank.
- declaration: AlmostInvariant.question_negative_complex
  informal: No bound depending only on the pairwise directed error controls
    the codimension in the initial subspace of the sum of intersections
    over strict majorities of translates. The counterexample uses a finite
    cyclic action on a complex vector space and pairwise error at most one.
