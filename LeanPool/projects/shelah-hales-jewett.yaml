slug: shelah-hales-jewett
title: Shelah's bound for the Hales–Jewett numbers
summary: Proves the Hales–Jewett theorem with Shelah's primitive recursive bound. The
  proof is by induction on the alphabet; to add a letter it finds a subspace on which
  the coloring is insensitive to replacing the new letter by an old one, building each
  dimension of the subspace from a line given by the pigeonhole principle. This gives an
  explicit recursion shelahBound k r for the dimension, which is proved to be below the
  fifth level of the Ackermann function, so every r-coloring of the words of length
  n ≥ A(5, 2k + r) over k ≥ 1 letters has a monochromatic combinatorial line.
