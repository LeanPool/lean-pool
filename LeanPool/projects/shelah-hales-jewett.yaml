main_results:
- declaration: Combinatorics.Line.exists_mono_of_shelahBound_le
  informal: Over a nonempty finite alphabet α, every coloring with κ colors of the
    words indexed by a finite type ι has a monochromatic combinatorial line when
    |ι| ≥ shelahBound |α| |κ|.
  source_ref: The Hales–Jewett theorem with Shelah's bound.
- declaration: Combinatorics.Subspace.exists_insensitive
  informal: For letters a and b and a finite type η, in a cube of dimension
    insensitiveBound every coloring has an η-dimensional subspace on which replacing
    a by b in any coordinates does not change the color.
  source_ref: Shelah's insensitivity lemma.
- declaration: Combinatorics.Line.shelahBound_lt_ack
  informal: shelahBound k r < A(5, 2k + r), where A is the Ackermann function.
- declaration: Combinatorics.Line.exists_mono_of_ack_le
  informal: Over a nonempty finite alphabet of k letters, every coloring with r colors
    of the words of length n ≥ A(5, 2k + r) has a monochromatic combinatorial line.
