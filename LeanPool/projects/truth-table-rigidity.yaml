slug: truth-table-rigidity
title: Baire-measurable rigidity of the truth-table degrees
summary: Proves that an automorphism of the truth-table degrees induced by a Baire-measurable
  map on Cantor space is the identity. It suffices to have a continuous inducing map on
  a comeager set. The formalization develops total oracle functionals, the truth-table degree
  order, and a Baire-category coding and inversion argument.
