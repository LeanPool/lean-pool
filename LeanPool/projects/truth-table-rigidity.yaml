main_results:
- declaration: TT.eq_refl_of_inducedOn_comeager
  informal: An order automorphism of the truth-table degrees is the identity if some Cantor-space
    map induces it on a comeager set and is continuous there.
  source_ref: Theorem 1.1 of arXiv:2610.16059, submitted 2026-10-12T02:01:06Z.
- declaration: TT.eq_refl_of_inducedByBaireMeasurable'
  informal: A Baire-measurable map on Cantor space can induce only the identity automorphism
    of the truth-table degrees.
  source_ref: Corollary 1.2 of arXiv:2610.16059.
