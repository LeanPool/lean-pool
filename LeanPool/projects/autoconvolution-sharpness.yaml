slug: autoconvolution-sharpness
title: Sharpness of the Martin–O’Bryant autoconvolution inequality
summary: Proves that nonzero nonnegative finite step functions on the real line
  have autoconvolution norm ratios arbitrarily close to one. The ratio is the
  squared L2 norm divided by the product of the L1 and essential-supremum norms,
  all for Lebesgue measure. Develops polynomial coefficient blocks, digit
  separation, collision estimates, and reusable convolution plateau bounds.
