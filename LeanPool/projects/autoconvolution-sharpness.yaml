main_results:
- declaration: Autoconvolutions.sharpness
  informal: For every positive real epsilon, some finite sequence of nonnegative
    real heights, including a positive height, gives a step function on successive
    integer unit intervals whose autoconvolution norm ratio exceeds one minus epsilon.
- declaration: Autoconvolutions.Construction.witness_ratio_lower
  informal: The explicitly constructed polynomial gives a quantitative lower bound
    for the Lebesgue autoconvolution ratio in terms of factorial and geometric factors.
- declaration: Autoconvolutions.blocks_energy_le
  informal: An injectively indexed family of separated coefficient plateaus supplies
    a lower bound on the squared L2 norm of a step function's autoconvolution.
