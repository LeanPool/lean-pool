main_results:
- declaration: PackingCertificate.packing_density
  informal: >-
    The published four-tetrahedron motif has positive common edge length.
    All integer translates by the three given periods have pairwise disjoint
    interiors. The fraction of covered volume tends to 4000/4671 in expanding
    origin-centered coordinate cubes.
  source_ref: Definition 2 and the packing and density claims of Theorem 1, equations (15)–(16).
- declaration: TetrahedronPacking.periodic_convex_density
  informal: >-
    In a positive-dimensional real coordinate space, suppose a finite bounded
    convex motif and a full lattice give pairwise interior-disjoint translates.
    The expanding-cube density equals the total motif volume divided by the
    lattice covolume.
