slug: tetrahedron-packing
title: Chen–Engel–Glotzer periodic tetrahedron packing
summary: >-
  Verifies the four congruent regular tetrahedra and pairwise disjoint interiors
  of the periodic Chen–Engel–Glotzer construction. The covered fraction of
  expanding coordinate cubes tends to 4000/4671. The development gives a
  periodic density theorem in positive-dimensional real coordinate spaces and
  a finite integer separation criterion.
