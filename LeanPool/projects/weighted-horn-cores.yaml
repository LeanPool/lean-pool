slug: weighted-horn-cores
title: Small unsatisfiable cores in weighted Horn formulas
summary: >-
  For finite weighted Horn formulas, bounds the number of distinct clauses
  needed for an unsatisfiable subset in terms of the minimum assignment loss
  and the weight of rules with two premises. The subset uses only positive
  weights. A unary chain shows the linear inverse-gap factor is necessary.
