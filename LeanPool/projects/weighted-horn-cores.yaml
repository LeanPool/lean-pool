main_results:
- declaration: WeightedHornCores.exists_positive_core
  informal: >-
    Suppose the positive-headed rules have at most two premises, denials
    have at most a premises, and every assignment violates weight at least
    t > 0. If W is the total nonnegative weight and B is the weight of
    two-premise positive-headed rules, an unsatisfiable subset of positive
    weight clauses has size at most 1 + a(1 + W/(t ln 2)) 2^(1 + B/t).
  source_ref: Direct finite charging argument in CoreBound.lean and RealBound.lean.
- declaration: WeightedHornCores.eq_unaryChain_of_unsatisfiable
  informal: >-
    The unary implication chain with opposing endpoint units has no proper
    unsatisfiable subset.
  source_ref: Cut assignments in UnaryChain.lean.
- declaration: WeightedHornCores.card_unaryChain
  informal: The unary chain with n links has n+2 distinct clauses.
  source_ref: UnaryChain.lean.
- declaration: WeightedHornCores.branchingWeight_unaryChain
  informal: The unary chain has branching weight zero for any weight function.
  source_ref: UnaryChain.lean.
- declaration: WeightedHornCores.unaryChain_isLeast_violationWeight
  informal: Under unit weights, the minimum violated weight over all assignments is one.
  source_ref: UnaryChain.lean.
