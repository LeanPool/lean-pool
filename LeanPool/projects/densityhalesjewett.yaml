slug: densityhalesjewett
title: The density Hales–Jewett theorem and Szemerédi's theorem
summary: Formalizes the combinatorial proof of the density Hales–Jewett theorem by Dodos,
  Kanellopoulos and Tyros, with an explicit bound. Over an alphabet of k letters and
  for δ > 0, every set of at least δ·k^n words of length n ≥ A(4k, k + ⌈1/δ⌉) contains
  a combinatorial line, where A is the Ackermann function. The thresholds are built on
  Shelah's bound for the Hales–Jewett numbers from the ShelahHalesJewett project,
  through the finite-unions theorem, block canonization and the Graham–Rothschild
  theorem for lines. Derives Szemerédi's theorem on the integers by a digital transfer,
  every subset of {0, …, n − 1} of size at least δn with n ≥ A(4k + 1, k + ⌈1/δ⌉)
  contains a nonconstant k-term arithmetic progression, and Varnavides' theorem that it
  contains at least n²/A(4k + 1, k + ⌈1/δ⌉) of them.
