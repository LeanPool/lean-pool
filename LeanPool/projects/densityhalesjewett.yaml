slug: densityhalesjewett
title: The density Hales–Jewett theorem and Szemerédi's theorem
summary: 'A Lean 4 formalization of the density Hales–Jewett theorem: for every finite
  alphabet α and every density δ > 0, all sufficiently large n have the property that
  any set of at least δ·|α|^n words of length n over α contains a combinatorial line.
  The basis for the formalization is the combinatorial proof of Dodos, Kanellopoulos,
  and Tyros. As a consequence, we also formalize Szemerédi''s theorem on the integers:
  for every k ≥ 3 and δ > 0, the following holds for all sufficiently large n. Any
  subset of {0, …, n−1} of size at least δ·n contains a nonconstant arithmetic progression
  of length k. The thresholds are explicit: the density Hales–Jewett theorem holds for
  n ≥ A(4|α|, |α| + ⌈1/δ⌉) and Szemerédi''s theorem for n ≥ A(4k + 1, k + ⌈1/δ⌉), where A
  is the Ackermann function, built on Shelah''s bound for the Hales–Jewett numbers from the
  ShelahHalesJewett project. Varnavides'' theorem gives at least n²/A(4k + 1, k + ⌈1/δ⌉)
  such progressions.'
