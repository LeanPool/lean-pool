main_results:
- declaration: Combinatorics.Line.exists_of_density
  informal: For a finite alphabet α of k letters, δ > 0 and n ≥ A(4k, k + ⌈1/δ⌉), every
    set of at least δ·k^n words of length n over α contains a combinatorial line.
  source_ref: Theorem 1, with an explicit threshold.
- declaration: Combinatorics.Line.dhjNumber_le_ack
  informal: For δ > 0, the density Hales–Jewett number of k letters and density δ is
    at most A(4k, k + ⌈1/δ⌉).
- declaration: Combinatorics.ArithmeticProgression.exists_of_density_nat
  informal: For k ≥ 3, δ > 0 and n ≥ A(4k + 1, k + ⌈1/δ⌉), every subset of
    {0, …, n − 1} with at least δn elements contains a nonconstant arithmetic
    progression of length k.
  source_ref: Szemerédi's theorem, derived from Theorem 1.
- declaration: Combinatorics.ArithmeticProgression.exists_many_of_density_nat
  informal: Under the same hypotheses, the subset contains at least
    n²/A(4k + 1, k + ⌈1/δ⌉) arithmetic progressions of length k.
  source_ref: Varnavides' theorem.
