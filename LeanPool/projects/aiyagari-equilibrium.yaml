main_results:
- declaration: LeanEconomics.aiyagariTauchen_equilibriumRate_unique_Ioo
  informal: For capped log households with discount 24/25, no borrowing and a finite Tauchen
    chain with persistence in [0,1), two rates in (-2/25, 1/24) whose stationary household
    distributions have mean assets equal to 9 / (16 * (r + 2/25)) coincide, provided the
    explicit asset-cap inequality holds at their larger rate. This is the prescribed unit-wage
    normalized clearing equation; a bridge to full competitive equilibrium for arbitrary
    earnings scales is not supplied.
- declaration: LeanEconomics.IncomeFluctuation.aiyagari1994_log_bisection
  informal: Given a rate satisfying the same unit-wage normalized clearing equation in a
    compact interval inside (-2/25, 1/24), a stationary-distribution selection and the stated
    cap, monotonicity and reachability hypotheses, bisection on normalized excess supply
    brackets that rate, bounds midpoint error by the initial width divided by 2^(n+1), and
    has left endpoints converging to it. Existence of a solution to this equation is assumed.
- declaration: LeanEconomics.continuousAt_maxValue
  informal: A continuous objective maximized over a nonempty compact-valued correspondence
    that is upper and lower hemicontinuous has a continuous maximum value at the parameter.
- declaration: LeanEconomics.Blackwell.contractingWith
  informal: A monotone operator on bounded continuous real functions that discounts constants
    by a nonnegative factor below one is a contraction with that factor.
