main_results:
  - declaration: LeanEconomics.aiyagariTauchen_equilibriumRate_unique_Ioo
    informal: >-
      For log households with discount 24/25, capital share 9/25,
      depreciation 2/25, no borrowing, and a finite Tauchen earnings chain
      with nonnegative persistence below one, two stationary equilibria
      with rates in (-2/25, 1/24) coincide, provided the explicit asset-cap
      inequality holds at their larger rate.
  - declaration: LeanEconomics.IncomeFluctuation.aiyagari1994_log_bisection
    informal: >-
      Given an equilibrium rate in a compact interval inside (-2/25, 1/24),
      a stationary-distribution selection and the cap and monotonicity
      hypotheses, bisection on excess supply brackets that rate at every
      step, bounds the midpoint error by the initial width divided by
      2^(n+1), and has left endpoints converging to the rate.
  - declaration: LeanEconomics.continuousAt_maxValue
    informal: >-
      A continuous objective maximized over a nonempty compact-valued
      correspondence that is upper and lower hemicontinuous has a
      continuous maximum value at the parameter.
  - declaration: LeanEconomics.Blackwell.contractingWith
    informal: >-
      A monotone operator on bounded continuous real functions that
      discounts constants by a nonnegative factor below one is a
      contraction with that factor.
