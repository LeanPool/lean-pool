slug: aiyagari-equilibrium
title: Normalized capped log-household clearing and dynamic programming
summary: 'Proves conditional uniqueness of a rate solving the unit-wage normalized clearing
  equation: mean household assets equal α / ((1 - α) * (r + δ)), with α = 9/25 and δ = 2/25.
  Households have capped log utility, discount 24/25, no borrowing, and monotone finite
  earnings transitions with positive one-step access to a lowest-income state; an explicit
  cap-slack inequality is required. Finite Tauchen chains instantiate the household model.
  Bisection converges to a given solution of this normalized equation along a stationary-distribution
  selection. Equivalence to full competitive market clearing for arbitrary earnings scales
  is not established. Preserves Bellman contraction, Berge maximum theorems, stationary
  Markov theory, Euler inequalities, consumption concavity and marginal-propensity bounds.'
