slug: turing-cone-rigidity
title: Pairwise rigidity of principal upper cones of the Turing degrees
summary: Proves that principal upper cones of ordinary Turing degrees are order-isomorphic exactly
  when their base degrees agree, and that every such isomorphism fixes every underlying degree.
  Includes the required computability, degree coding, countable-model, forcing, persistence,
  and Baire-category infrastructure inherited from OpenAI's degree-rigidity development, together
  with the cone-specific extensions. No determinacy or regularity premise is imposed. The separate
  historical truth-table-degree project is outside this import.
