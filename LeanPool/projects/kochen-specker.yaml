main_results:
- declaration: KochenSpecker.kochen_specker
  informal: In Euclidean dimension d ≥ 3 over an RCLike field, no Boolean map
    marks exactly one vector in each orthonormal basis.
  source_ref: Kochen and Specker, Theorem 1, for the real dimension-three obstruction; Peres, DOI 10.1088/0305-4470/24/4/003, for the 33-ray configuration.
- declaration: KochenSpecker.not_isValuation
  informal: The same nonexistence holds in any inner product space of finite
    dimension d ≥ 3 over an RCLike field.
  source_ref: Imported formalization, with the dimension-three certificate propagated by orthogonal-complement restriction.
- declaration: KochenSpecker.kochen_specker_of_four_le
  informal: Cabello's four-dimensional configuration yields the Euclidean
    nonexistence result for every d ≥ 4 by a parity argument and dimension propagation.
  source_ref: Cabello, Estebaranz, and García-Alcaine, DOI 10.1016/0375-9601(96)00134-X, for the four-dimensional configuration.
