slug: kochen-specker
title: The Kochen–Specker theorem in every finite dimension
summary: Rules out Boolean valuations that mark exactly one vector in each
  orthonormal basis of a real or complex inner product space of dimension at
  least three. The proof checks a case-split certificate for Peres's rays,
  propagates nonexistence by restriction to orthogonal complements, and includes
  a second proof from Cabello's parity construction beginning in dimension four.
