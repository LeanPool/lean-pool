main_results:
- declaration: SixExponentials.SX.six_exponentials_of_numberField
  informal: If d + l < d l, x₁, …, x_d are complex numbers linearly independent over ℚ, y₁, …, y_l
    are complex numbers linearly independent over ℚ, and K is a subfield of ℂ of finite degree
    over ℚ, then some exp(xᵢ yⱼ) does not lie in K.
  source_ref: Lang 1966, chapter II; Ramachandra 1968 (number-field form)
- declaration: SixExponentials.exists_transcendental_exp
  informal: If d + l < d l and the families x₁, …, x_d and y₁, …, y_l of complex numbers are each
    linearly independent over ℚ, then some exp(xᵢ yⱼ) is transcendental over ℚ.
  source_ref: Lang 1966, chapter II; Ramachandra 1968
- declaration: SixExponentials.six_exponentials_theorem
  informal: If x₁, x₂ are complex numbers linearly independent over ℚ and y₁, y₂, y₃ are complex
    numbers linearly independent over ℚ, then at least one of the six numbers exp(xᵢ yⱼ) is
    transcendental over ℚ.
  source_ref: Lang 1966, chapter II; Ramachandra 1968 (six exponentials theorem)
