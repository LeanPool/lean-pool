slug: six-exponentials
title: The six exponentials theorem of Lang and Ramachandra
summary: 'Proves the six exponentials theorem in the general form of Lang and Ramachandra: for
  d complex numbers x₁, …, x_d linearly independent over ℚ and l complex numbers y₁, …, y_l
  linearly independent over ℚ, with d + l < d l, at least one of the numbers exp(xᵢ yⱼ) is
  transcendental; more precisely, for every subfield K of ℂ of finite degree over ℚ some
  exp(xᵢ yⱼ) lies outside K. The classical six exponentials theorem is the case d = 2, l = 3.
  The proof is Schneider''s method relative to a number field: Siegel''s lemma gives an
  exponential polynomial with integer coefficients, not all zero, vanishing on a box of lattice
  points ∑ mⱼ yⱼ; a Cauchy estimate with zeros, played against Liouville''s inequality, extends
  the vanishing from each box to the next; and an exponential polynomial vanishing on the whole
  lattice has zero coefficients by Dedekind''s independence of characters. The pool''s
  roy-strong-six project proves Roy''s strong six exponentials theorem, whose hypotheses are
  linear independence over the algebraic numbers rather than over ℚ and whose proof goes through
  Philippon''s multiplicity estimate; this project assumes only ℚ-independence, covers every
  (d, l) with d + l < d l, and gives the elementary auxiliary-function proof.'
