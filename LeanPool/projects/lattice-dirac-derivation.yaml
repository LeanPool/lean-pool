main_results:
- declaration: LeanDirac.V2.v35_complete_covariant_observables
  informal: >-
    The cumulative V3.5 certificate assembles the unchanged V3.4 free-spinor
    result with the antiparticle residue, generated finite-transformation,
    covariant-solution, bilinear, Clifford/Fierz, and moving-spin certificates.
- declaration: LeanDirac.V2.v35_antiparticle_spin_sum_is_negative_pole
  informal: >-
    On the mass shell, when energy plus mass is positive and energy is nonzero,
    the antiparticle spin sum equals energy times the negative-pole numerator
    at reversed spatial momentum, composed on the right with beta.
- declaration: LeanDirac.V2.v35_lorentz_word_covariant
  informal: >-
    For every finite word generated by the inherited cubical rotations and
    boosts, transforming both momentum-energy data and a four-component state
    intertwines the free Dirac residual with the same spinor transformation.
- declaration: LeanDirac.V2.v35_lorentz_word_preserves_solutions
  informal: >-
    Every zero of the free Dirac residual remains a zero after any finite word
    generated by the inherited cubical rotations and boosts, with the
    corresponding transformed momentum-energy data.
- declaration: LeanDirac.V2.v35_fierz_completeness
  informal: >-
    The scalar, pseudoscalar, four vector, four axial, and six independent
    antisymmetric-tensor channels satisfy the displayed componentwise Fierz
    completeness identity. Its one-quarter and one-half normalizations are
    defined as inverses of finite cardinalities four and two.
- declaration: LeanDirac.V2.v35_on_shell_pauli_lubanski_spin_half
  informal: >-
    If energy and momentum obey the stated mass-shell equation, the square of
    the inherited cubical Pauli--Lubanski operator acts as minus three quarters
    of the mass squared on every four-component state.
- declaration: LeanDirac.V2.v35_helicity_is_normalized_pauli_lubanski_time
  informal: >-
    At positive radius whose square equals the momentum norm squared, the time
    component of the inherited cubical Pauli--Lubanski operator equals radius
    times the V3.4 momentum-helicity operator after the proved cube-generator
    orientation map.
- declaration: LeanDirac.V2.v32_no_global_exact_local_oriented_root
  informal: >-
    The continuum-oriented Clifford root cannot be relabeled as an exact
    global local root of the finite C19 scalar symbol; an explicit
    Brillouin-zone witness separates the two.
- declaration: LeanDirac.V2.v32_absolute_energy_scale_not_selected
  informal: >-
    Physical rest energy is 19 times the supplied conversion factor. The
    theorem exhibits two choices of factor that give different rest energies.
