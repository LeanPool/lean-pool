slug: lattice-dirac-derivation
title: Free Dirac dynamics and cubical spin from a reciprocal C19 lattice action
summary: >-
  Derives the linearized free Dirac equation for a reciprocal two-field action
  on the C19 cubic stencil at an exact zero-energy vacuum. V3.2 keeps that
  action unchanged and adds the exact scalar C19 spectrum, continuum spectral
  projectors, a unique-zero theorem for the scalar transport symbol, the
  classification of the two cubical
  four-component copies, a scoped irreducibility result for the massive rest
  spin sector, axial finite-boost group laws, discrete symmetries, the
  nonrelativistic reduction, and explicit finite-lattice artifacts. Its
  cumulative certificate collects the spatial and centered-time continuum
  defect bounds and transport results. In the native normalization the rest
  mass is 19. The physical rest-energy formula takes the conversion factor
  as an explicit input.
  It explicitly distinguishes the exact finite-C19 scalar spectrum from the
  continuum Clifford factorization instead of promoting the latter to a global
  exact finite-lattice root.
