slug: lattice-dirac-derivation
title: Free Dirac covariance and observables from a reciprocal C19 lattice action
summary: >-
  Derives the linearized free Dirac equation for a reciprocal two-field action
  on the C19 cubic stencil at an exact zero-energy vacuum. The cumulative V3.5
  certificate keeps that action, geometry, coefficients, vacuum, and native
  mass unchanged. It connects the antiparticle spin sum to the negative
  spectral pole, proves covariance of the free Dirac residual and its zero set
  under finite words generated by inherited cubical rotations and boosts,
  defines the five standard bilinear classes, proves the sixteen-channel
  Clifford/Fierz completeness identity with finite-count normalizations, and
  evaluates the Pauli--Lubanski square at arbitrary momentum. On the mass shell
  the latter equals minus three quarters of the mass squared, and its time
  component agrees with the inherited helicity operator after the stated cube
  orientation and positive-radius normalization. The scope remains the free
  linearized theory, not a localized or interacting electron.
