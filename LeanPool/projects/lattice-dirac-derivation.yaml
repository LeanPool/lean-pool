main_results:
- declaration: LeanDirac.V2.v32_complete_free_fermion
  informal: >-
    The cumulative V3.2 certificate assembles the unchanged action and V3.1
    free-Dirac and Lorentz-spin results with the spectrum, projector,
    Brillouin-zone, copy, rest-sector, symmetry, nonrelativistic, convergence,
    lattice-artifact, rest-mass, robustness, and transport certificates.
- declaration: LeanDirac.V2.v32_no_global_exact_local_oriented_root
  informal: >-
    The continuum-oriented Clifford root cannot be relabeled as an exact
    global local root of the finite C19 scalar symbol; an explicit
    Brillouin-zone witness separates the two.
- declaration: LeanDirac.V2.c19_no_momentum_doublers
  informal: >-
    Inside the fundamental Brillouin box, the positive C19 bond sum has no
    transport-symbol zero away from the origin.
- declaration: LeanDirac.V2.v32_rest_spin_commutant_is_scalar
  informal: >-
    Within the declared two-coordinate rest-spin matrix class, every operator
    commuting with all three derived spin generators is scalar.
- declaration: LeanDirac.V2.v32_free_schrodinger_multiplier_with_exact_remainder
  informal: >-
    After subtracting the rest oscillation, the positive branch has the usual
    free nonrelativistic kinetic multiplier plus an exact relativistic
    remainder.
- declaration: LeanDirac.V2.v32_native_rest_mass
  informal: >-
    The unchanged native normalization fixes rest mass 19, rest-branch gap 38,
    the native inertial coefficient, and the unit density of two explicit
    positive-energy rest spinors.
- declaration: LeanDirac.V2.v32_absolute_energy_scale_not_selected
  informal: >-
    The modeled physical rest energy is 19 times the supplied conversion
    factor. The theorem exhibits two choices of factor yielding different values.
