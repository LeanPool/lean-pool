slug: lattice-dirac-derivation
title: Free Dirac dynamics from a reciprocal C19 lattice action
summary: >-
  Derives the linearized free Dirac equation for a reciprocal two-field action
  on the C19 cubic stencil, at an exact zero-energy vacuum of the action.
  The oriented cubical Clifford representation decomposes into two invariant
  four-component sectors carrying the same free generator. The development
  gives finite-periodic Fourier completeness, a bijective spectral readout,
  spatial and centered-time defect estimates, and the integrated
  positive-frequency charge and current identities. The conventional chi-field
  kinetic coefficient is 1197. The transverse result holds for every value of
  that coefficient.
