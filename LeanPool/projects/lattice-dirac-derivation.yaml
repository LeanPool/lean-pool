main_results:
- declaration: LeanDirac.V2.v34_complete_covariant_free_spinor
  informal: >-
    The cumulative V3.4 certificate assembles the unchanged action and V3.2
    free-fermion result with the V3.3 observable layer and the V3.4 covariant
    spinor, sector-basis, spin-sum, helicity, Gordon, and propagator-residue
    certificates.
- declaration: LeanDirac.V2.v34_every_spinor_has_unique_two_plus_two_coordinates
  informal: >-
    On the mass shell, with nonzero energy and energy plus mass positive,
    every four-component spinor has unique coordinates in the two-dimensional
    positive- and negative-frequency sectors.
- declaration: LeanDirac.V2.v34_positive_covariant_spin_sum
  informal: >-
    On the mass shell, with energy plus mass positive, the sum of the two
    positive-frequency spinors' outer products with their Dirac adjoints
    equals half the sum of the Dirac momentum slash and the mass times the
    identity.
- declaration: LeanDirac.V2.v34_momentum_helicity
  informal: >-
    For arbitrary nonzero momentum, the derived helicity operator squares to
    one quarter and its complementary projectors define the plus and minus
    one-half eigenbranches.
- declaration: LeanDirac.V2.v34_nonforward_gordon_for_native_spinors
  informal: >-
    For independent incoming and outgoing on-shell momenta with energy plus
    mass nonzero in each branch, the native-derived spinors satisfy the
    non-forward Gordon identity. The proof derives the left and right
    covariant Dirac equations from the existing Hamiltonian branch.
- declaration: LeanDirac.V2.v34_resolvent_spectral_decomposition
  informal: >-
    At nonzero on-shell energy, the free resolvent away from its poles
    decomposes into the two V3.2 spectral projectors. When energy plus mass is
    positive, the positive-frequency spinor sum equals energy times the
    positive projector composed on the right with beta.
- declaration: LeanDirac.V2.v32_no_global_exact_local_oriented_root
  informal: >-
    The continuum-oriented Clifford root cannot be relabeled as an exact
    global local root of the finite C19 scalar symbol; an explicit
    Brillouin-zone witness separates the two.
- declaration: LeanDirac.V2.v32_absolute_energy_scale_not_selected
  informal: >-
    Physical rest energy is 19 times the supplied conversion factor. The
    theorem exhibits two choices of factor that give different rest energies.
