main_results:
- declaration: LeanDirac.V2.complete_first_principles_free_dirac
  informal: >-
    The declared lattice action has an exact critical zero-energy vacuum.
    Its transverse periodic tangent dynamics admit lossless four-component
    spectral coordinates. The certificate assembles the cubical Clifford
    generator, exact lattice evolution, controlled defects in the free
    continuum equation, and the positive-frequency current identities.
- declaration: LeanDirac.V2.cubical_flavor_classification
  informal: >-
    The oriented cube decomposes into two flavor eigenspaces. Each is
    parametrized injectively by four complex coordinates, and their
    intersection is zero.
- declaration: LeanDirac.V2.periodic_quantized_add_char_bijective
  informal: >-
    The quantized modes on a finite periodic cubic lattice enumerate all its
    additive characters bijectively.
- declaration: LeanDirac.V2.periodic_integrated_positive_packet_current_bridge
  informal: >-
    For on-shell positive-frequency packets on a finite torus, the averaged
    native flux equals the averaged current of the same Dirac packet plus
    the sum of the explicit C19 remainders.
- declaration: LeanDirac.V2.positive_packet_pointwise_bridge_is_false
  informal: >-
    A two-mode interference example disproves extending the separate-mode
    charge identity pointwise to all positive-frequency superpositions.
- declaration: LeanDirac.V2.lorentz_spin_half_from_native_action
  informal: >-
    From the already-derived cubical Clifford root, the certificate constructs
    the local plane-bivector spin generators, proves the scoped operational
    half-spin normalization and its action on both four-component sectors,
    establishes the finite two-pi sign and four-pi return, and collects the
    Lorentz commutators, Dirac-symbol covariance, and Pauli--Lubanski
    orthogonality and rest-frame Casimir identities. It changes no native
    action term, vacuum, or continuum readout.
