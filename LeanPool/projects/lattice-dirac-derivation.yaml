slug: lattice-dirac-derivation
title: Free Dirac dynamics and cubical spin from a reciprocal C19 lattice action
summary: >-
  Derives the linearized free Dirac equation for a reciprocal two-field action
  on the C19 cubic stencil, at an exact zero-energy vacuum of the action.
  The oriented cubical Clifford representation decomposes into two invariant
  four-component sectors carrying the same free generator. The development
  gives finite-periodic Fourier completeness, a bijective spectral readout,
  spatial and centered-time defect estimates, and the integrated
  positive-frequency charge and current identities. Downstream cubical plane
  bivectors determine the half-spin normalization within the declared local
  class and provide the finite rotations, Lorentz Lie algebra, Dirac-symbol
  covariance, and Pauli--Lubanski identities recorded by the V3.1 certificate.
  The conventional chi-field kinetic coefficient is 1197. The transverse result
  holds for every value of that coefficient.
