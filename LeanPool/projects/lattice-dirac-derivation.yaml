slug: lattice-dirac-derivation
title: Cubical lattice Dirac factorization and its continuum limit
summary: Studies a quartic two-field lattice action on the 18-neighbour cubic stencil with
  fixed numerical constants. On a fixed period-two background, its quadratic fluctuation
  symbol splits into a continuum Klein-Gordon symbol and a fourth-order lattice remainder.
  The four-component Dirac Hamiltonian squares to that continuum symbol. Two flavour copies
  of a cubical Clifford representation, built from signed cube incidence maps, are equivalent
  to the standard alpha/beta Dirac representation. A first-order branch solves the centred
  time recurrence with the continuum symbol in place of the lattice symbol. In the exact
  lattice recurrence it leaves an explicit defect proportional to dt^2 times the lattice
  remainder, and its generator tends to the Dirac Hamiltonian as the time step vanishes.
  The project also proves local continuity for the linearized lattice dynamics, the
  continuum limit of the lattice current, an orthonormal Fourier frame on
  finite abelian groups, and spin one-half rotation generators. Free continuum identities
  include Lorentz boosts, the Pauli-Lubanski invariant and the Gordon decomposition. All
  results are about this lattice model and the free four-component continuum operator. They
  do not establish properties of physical electrons.
