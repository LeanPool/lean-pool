slug: lattice-dirac-derivation
title: Free Dirac dynamics and covariant spinors from a reciprocal C19 lattice action
summary: >-
  Derives the linearized free Dirac equation for a reciprocal two-field action
  on the C19 cubic stencil at an exact zero-energy vacuum. The cumulative V3.4
  certificate keeps that action, geometry, coefficients, vacuum, and native
  mass unchanged while extending the V3.2 free-fermion result through a
  complete free-spinor observable layer. It constructs positive-frequency and
  antiparticle covariant spinors, proves their two-plus-two sector
  decomposition and covariant spin sums, establishes arbitrary nonzero-momentum
  helicity projectors with eigenvalues plus or minus one half, proves the
  non-forward Gordon identity for native-derived on-shell spinors, and
  decomposes the free resolvent into its spectral projectors and pole
  numerators. The project continues to distinguish the exact finite-C19 scalar
  spectrum from the continuum Clifford factorization. Its scope is the free
  linearized theory, including the inherited free transport results.
