main_results:
- declaration: PointwiseComposition.no_quotient_of_enumerable_axioms
  informal: For every consistent extension T of Peano arithmetic with recursively enumerable axiom
    codes, no binary operation on the pointwise-provability quotient of actual natural-number program
    indices respects their actual composition.
- declaration: PointwiseComposition.FailureOfComposition.ConcreteIndices.no_index_quotient_of_re_axioms
  informal: For every consistent extension T of Peano arithmetic with recursively enumerable axiom
    codes, no binary operation on the pointwise-provability quotient of actual natural-number program
    indices respects their actual composition.
- declaration: PointwiseComposition.FailureOfComposition.ConcreteIndices.pi_one_characterization
  informal: For every consistent extension of Peano arithmetic, right compatibility, composition
    congruence, completeness for true Pi-one sentences, and agreement with extensional equality of
    partial functions are equivalent.
- declaration: PointwiseComposition.FailureOfComposition.ConcreteIndices.generated_congruence_classification
  informal: For every extension of Peano arithmetic, with no consistency or enumerability hypothesis,
    the least composition congruence containing pointwise provable equality is extensional equality
    if the theory is Sigma-one sound and the universal relation otherwise.
- declaration: PointwiseComposition.FailureOfComposition.ConcreteIndices.generatedQuotientPartialRecursiveEquiv
  informal: For every Sigma-one sound extension of Peano arithmetic, the generated quotient is a
    monoid isomorphic to actual unary partial recursive functions with partial-function composition.
