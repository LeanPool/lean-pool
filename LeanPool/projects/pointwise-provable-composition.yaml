slug: pointwise-provable-composition
title: Pointwise provable equality and the failure of composition
summary: For every consistent recursively enumerable extension of Peano arithmetic, pointwise provable
  equality of unary programs fails to respect composition. Separate productive-set and Goedel incompleteness
  proofs establish the obstruction. For consistent extensions, compatibility is equivalent to Pi-one
  completeness. For every extension, the generated composition congruence is extensional equality
  in the Sigma-one sound case and universal otherwise. The development also proves weak-totality
  and range obstructions and identifies the sound generated quotient with actual unary partial recursive
  functions. Its coherent dependency closure preserves the concrete evaluator, arithmetization, first-order
  syntax, semantics and provability infrastructure. Main-result proofs were produced by AI agents
  under Florian Lengyel's direction; the Foundation dependency includes substantial human formalization
  by the Formalized Formal Logic contributors.
