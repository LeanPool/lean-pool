slug: herstein-jordan
title: Herstein–Smiley theorems on Jordan homomorphisms of prime rings
summary: Classifies surjective Jordan homomorphisms onto prime rings without
  two-torsion as multiplicative or anti-multiplicative. Also proves Smiley's
  square-and-triple-identity form in every characteristic and the
  Jacobson–Rickart domain form without surjectivity, with counterexamples
  separating the original hypotheses and general biadditive and prime-ring lemmas.
