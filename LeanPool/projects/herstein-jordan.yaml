main_results:
- declaration: JordanPrime.jordan_onto_prime
  informal: A surjective additive Jordan homomorphism of possibly nonunital
    rings onto a prime ring without two-torsion is multiplicative or
    anti-multiplicative.
- declaration: JordanPrime.twoIdentity_onto_prime
  informal: In every characteristic a surjective additive map onto a prime
    ring that preserves squares and triple products aba is multiplicative
    or anti-multiplicative.
- declaration: JordanPrime.twoIdentity_into_domain
  informal: An additive map preserving squares and triple products into a
    ring without zero divisors is multiplicative or anti-multiplicative,
    without assuming surjectivity or excluding any characteristic.
- declaration: JordanPrime.onto_needed
  informal: An explicit integer-matrix Jordan homomorphism shows that
    surjectivity cannot be dropped from the first theorem.
- declaration: JordanPrime.prime_needed
  informal: Transposing one factor in a product of integer-matrix rings shows
    that the prime-target hypothesis cannot be dropped.
- declaration: JordanPrime.two_needed
  informal: Addition from two copies of the field with two elements shows
    that the two-torsion hypothesis cannot be dropped from the first theorem.
