slug: apollonian-superharmonic
title: Apollonian classification of integer superharmonic matrices
summary: Characterizes quadratic growths of integer-valued functions on the square
  lattice with discrete Laplacian at most one by the downsets of matrices associated
  to circles in the Apollonian band packing, together with nonpositive-trace matrices.
  Constructs maximal periodic odometers and rotationally symmetric lattice tilings,
  and identifies the tiling and integrality lattices.
