main_results:
- declaration: ApollonianSuperharmonic.IntegerSuperharmonicCharacterization
  informal: A real symmetric two-by-two matrix admits an integer-valued lattice
    function with its quadratic growth and discrete Laplacian at most one if and
    only if it is below a band-circle matrix in the positive-semidefinite order
    or has nonpositive trace.
- declaration: ApollonianSuperharmonic.BandOdometerTheorem
  informal: Every band-circle matrix has an integer superharmonic representative
    with the integrality-lattice cocycle identity, maximal among functions above
    it with discrete Laplacian at most one, up to a bounded difference.
- declaration: ApollonianSuperharmonic.IntegralityTiling
  informal: Every band circle admits a quarter-turn-symmetric lattice tile whose
    integrality-lattice translates tile the plane, with six neighboring tiles
    except for circles of curvature one.
- declaration: ApollonianSuperharmonic.LambdaTiling
  informal: Every band circle admits the analogous symmetric tiling by translates
    along its recursively defined tiling lattice.
- declaration: ApollonianSuperharmonic.BandLatticeEquality
  informal: For each band circle the recursively defined tiling lattice equals
    the lattice of integer vectors sent to integer vectors by its circle matrix.
