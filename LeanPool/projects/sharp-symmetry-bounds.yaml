slug: sharp-symmetry-bounds
title: Sharp symmetry bounds for real plane algebraic curves
summary: 'Let C be an infinite real plane algebraic curve defined by a polynomial of degree d ≥ 2
  that is irreducible over the complex numbers, and suppose C is not a circle. The project proves
  that the group of Euclidean symmetries of C (Mathlib isometries of ℂ mapping C onto itself) is
  finite, that its orientation-preserving part is cyclic of order at most max(d, 2d − 4), and that
  the full group has order at most 2d. Both bounds are attained in every degree d ≥ 2. For d ≥ 5
  the curves attaining the rotation bound are classified: up to an orientation-preserving
  similarity they are the curves Re(z^(d−2)(|z|² + α)) = 0 with |α| = 1 and α not real, and
  conversely every such curve with d − 2 ≥ 3 attains the bound. The rotation bound uses the
  coefficient-weight criterion of Lebmeir and Richter-Gebert; the bound 2d sharpens the auxiliary
  bound 4d of Pach and de Zeeuw, and the quintic Re(z³(|z|² + i)) = 0, with six rotations, is a
  counterexample to the degree restriction in Lemma 9 of Alcázar, Lávička and Vršek
  (arXiv:1801.09962v1). This is Theorem 1 of the author''s note; the note''s second theorem is not
  included.'
