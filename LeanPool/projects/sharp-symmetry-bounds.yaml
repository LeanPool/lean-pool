main_results:
- declaration: SharpSymmetryBounds.sharp_bounds
  informal: For a real plane polynomial f of degree d ≥ 2, irreducible over ℂ, whose real zero set
    C is infinite and not a circle, the Euclidean symmetries of C form a finite set, the
    orientation-preserving ones are the powers of a single isometry and number at most
    max(d, 2d − 4), and all of them number at most 2d.
  source_ref: Note, Theorem 1 (bounds)
- declaration: SharpSymmetryBounds.rotation_bound_sharp
  informal: In every degree d ≥ 2 there is such a curve with exactly max(d, 2d − 4)
    orientation-preserving symmetries.
  source_ref: Note, Theorem 1 (sharpness of the rotation bound)
- declaration: SharpSymmetryBounds.full_bound_sharp
  informal: In every degree d ≥ 2 there is such a curve with exactly 2d Euclidean symmetries.
  source_ref: Note, Theorem 1 (sharpness of the full bound)
- declaration: SharpSymmetryBounds.equality_classification
  informal: If d ≥ 5 and the curve has exactly 2d − 4 orientation-preserving symmetries, then an
    orientation-preserving similarity z ↦ a z + b maps it onto Re(z^(d−2)(|z|² + α)) = 0 for some
    α with |α| = 1 and nonzero imaginary part.
  source_ref: Note, Theorem 1 (equality case, d ≥ 5)
- declaration: SharpSymmetryBounds.family_attains_bound
  informal: For m ≥ 3 and α with nonzero imaginary part, the curve Re(z^m(|z|² + α)) = 0 is the
    real zero set of a polynomial of degree m + 2, irreducible over ℂ, with infinite real locus,
    not a circle, and with exactly 2m orientation-preserving symmetries.
  source_ref: Note, Theorem 1 (converse)
