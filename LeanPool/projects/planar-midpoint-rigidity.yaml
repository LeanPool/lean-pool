license: MIT
status: verified
provenance: AI
summary: >-
  Complementary canonical local midpoints for two Euclidean dual torsion-free
  connections force their symmetric cubic tensor to be constant on a connected
  open planar domain. The proof constructs the local geodesic germs and derives
  the fourth-order obstruction, including its exceptional tensors. A differential
  strengthening needs only differentiability; five fixed direction tests suffice.
branch: Differential geometry
main_declarations:
  - PlanarMidpoint.planar_dual_midpoint_rigidity
main_results:
  - declaration: PlanarMidpoint.planar_dual_midpoint_rigidity
    informal: >-
      On an open preconnected Euclidean planar domain, a smooth symmetric cubic
      tensor field whose canonical local dual geodesic midpoints sum to the
      endpoints is constant.
  - declaration: PlanarMidpoint.planar_midpoint_rigidity_C2
    informal: The geometric midpoint rigidity theorem already holds for C2 coefficient fields.
  - declaration: PlanarMidpoint.planar_obstruction_rigidity
    informal: >-
      A differentiable planar cubic coefficient field is constant if its quartic
      midpoint obstruction vanishes at every point and in every direction.
  - declaration: PlanarMidpoint.planar_five_direction_rigidity
    informal: >-
      The differential obstruction criterion needs only the five directions
      (j, 1) for j = 0, 1, 2, 3, 4 at every point.
