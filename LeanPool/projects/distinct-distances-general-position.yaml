slug: distinct-distances-general-position
title: An explicit improvement to the planar distinct-distance bound in general position
summary: >-
  Proves that an injectively indexed configuration of n at least 10000 planar points,
  with no three collinear and no four concyclic, determines more than (1/3 + 1/40)n
  distinct distances. The argument combines distance multiplicity and energy bounds,
  a thin annulus about the centroid, geometric constraints on close pairs and
  equidistant witnesses, and a kernel-checked rational certificate covering 60 cases.
  Reusable infrastructure includes an exact packed Farkas certificate checker with
  a general soundness theorem, annular geometry, and distance-counting identities.
