slug: homotopy-theory-of-categories
title: Basic localizers and the homotopy theory of small categories
summary: Grothendieck's homotopy theory of small categories, after Pursuing Stacks and
  Cisinski. The classes W₀ (functors bijective on connected components) and W₁ (functors
  inducing an equivalence of fundamental groupoids) are compared, and a functor between
  groupoids is an equivalence exactly when it is bijective on connected components and on
  automorphism groups; fibrations of groupoids have an exact sequence of fibre, total groupoid
  and base. Basic localizers are defined, the minimal one W∞ is the intersection of all of
  them, W₀ and W₋₁ are basic localizers, Quillen's Theorem A holds for any basic localizer,
  and every functor with an adjoint lies in every basic localizer. For presheaves, the
  adjunction between the category-of-elements functor and its right adjoint is constructed.
  Direct categories are those with a well-founded relation of non-identity morphisms; those
  of finite ranks are characterised by direct Reedy structures with natural-number degrees,
  and a partial order is direct exactly when it is well-founded. Non-singular presheaves are those whose category of elements is thin, and
  categories of elements give discrete fibrations. In a cofibration category, Brown's
  factorization lemma holds between cofibrant objects. For a map of abelian groups d, the
  gr-category of two-term complexes has π₀ the cokernel and π₁ the kernel of d.
