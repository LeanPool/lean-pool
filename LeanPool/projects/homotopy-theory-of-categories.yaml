main_results:
- declaration: LeanPool.HomotopyTheoryOfCategories.Groupoid.isEquivalence_iff_bijective
  informal: A functor between groupoids is an equivalence exactly when it is bijective on
    connected components and induces isomorphisms on all automorphism groups.
- declaration: LeanPool.HomotopyTheoryOfCategories.W₁_iff_isEquivalence
  informal: A functor between small groupoids induces an equivalence of fundamental groupoids
    exactly when it is an equivalence.
- declaration: LeanPool.HomotopyTheoryOfCategories.IsGroupoidFibration.range_mapAut_fiberInclusion
  informal: For a fibration of groupoids, the image of the automorphism group of a point in
    its fibre is the kernel of the map on automorphism groups to the base.
- declaration: LeanPool.HomotopyTheoryOfCategories.IsGroupoidFibration.mapConnectedComponents_eq_iff
  informal: For a fibration of groupoids, two points of a fibre lie in the same connected
    component of the total groupoid exactly when one is moved to the component of the other
    by a lift of an automorphism of the base point.
- declaration: LeanPool.HomotopyTheoryOfCategories.isBasicLocalizer_Winfty
  informal: The intersection of all basic localizers is a basic localizer.
- declaration: LeanPool.HomotopyTheoryOfCategories.Winfty_le
  informal: The intersection of all basic localizers is contained in every basic localizer.
- declaration: LeanPool.HomotopyTheoryOfCategories.isBasicLocalizer_W₀
  informal: The functors between small categories that are bijective on connected components
    form a basic localizer.
- declaration: LeanPool.HomotopyTheoryOfCategories.isBasicLocalizer_WNeg₁
  informal: The functors between small categories whose source is nonempty exactly when
    their target is form a basic localizer.
- declaration: LeanPool.HomotopyTheoryOfCategories.mem_of_isAsphericalFunctor
  informal: Quillen's Theorem A for a basic localizer W; a functor between small categories
    all of whose comma categories are W-aspherical lies in W.
- declaration: LeanPool.HomotopyTheoryOfCategories.mem_of_isLeftAdjoint
  informal: Every left adjoint between small categories lies in every basic localizer.
- declaration: LeanPool.HomotopyTheoryOfCategories.mem_of_isRightAdjoint
  informal: Every right adjoint between small categories lies in every basic localizer.
- declaration: LeanPool.HomotopyTheoryOfCategories.nonempty_iAAdjunction
  informal: The functor sending a presheaf to its category of elements has a right adjoint.
- declaration: LeanPool.HomotopyTheoryOfCategories.nonempty_reedyStructure_nat_iff
  informal: A category has a Reedy structure with natural-number degrees whose degree-raising
    maps are all its morphisms and whose degree-lowering maps are the identities exactly when
    it has no infinite descending chain of non-identity morphisms and every object has finite
    rank for the relation of non-identity morphisms.
- declaration: LeanPool.HomotopyTheoryOfCategories.isDirect_iff_wellFoundedLT
  informal: A partial order, viewed as a category, is direct exactly when it is well-founded.
- declaration: LeanPool.HomotopyTheoryOfCategories.Presheaf.isNonsingular_iff_isThin
  informal: A presheaf is non-singular exactly when its category of elements is thin.
- declaration: LeanPool.HomotopyTheoryOfCategories.Presheaf.isNonsingular_iff_mono
  informal: A presheaf on a small category is non-singular exactly when every map from a
    representable presheaf classifying an element is a monomorphism.
- declaration: LeanPool.HomotopyTheoryOfCategories.isDiscreteFibration_elements
  informal: The projection from the category of elements of a presheaf is a discrete
    fibration.
- declaration: LeanPool.HomotopyTheoryOfCategories.brown_factorization
  informal: In a cofibration category, every map between cofibrant objects factors as a
    cofibration followed by a retraction of a trivial cofibration.
- declaration: LeanPool.HomotopyTheoryOfCategories.nonempty_skeletonTwoTerm_mulEquiv
  informal: The isomorphism classes of the gr-category of a map of abelian groups d form a
    group isomorphic to the cokernel of d.
- declaration: LeanPool.HomotopyTheoryOfCategories.nonempty_autUnitTwoTerm_mulEquiv
  informal: The automorphism group of the unit of the gr-category of a map of abelian groups d
    is isomorphic to the kernel of d.
