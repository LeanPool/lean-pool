slug: ccdn-dimension-growth
title: Polynomial degree bounds for rational points on varieties
summary: >-
  Proves the six main results of Castryck, Cluckers, Dittmann and Nguyen on
  dimension growth, uniform rational-point counts on curves and hypersurfaces,
  a lower-bound curve construction, and two-torsion in number-field class groups.
  Preserves the determinant method, Hilbert-function degree and dimension,
  bounded birational projections, and the required Bombieri-Vaaler and Mertens
  dependencies. Imports the main-result closure, excluding the separate
  intermediate-statement and counterexample library.
