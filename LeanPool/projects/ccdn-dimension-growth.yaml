main_results:
- declaration: CCDN.projective_dimension_growth
  informal: >-
    For every ambient projective dimension n, a constant depending only on n
    bounds the rational points of height at most B on every integral projective
    variety of degree d at least five by C d^(2n^2+5n-5) B^dim(X), for B at least one.
- declaration: CCDN.projectiveCurveBound
  informal: >-
    In ambient dimension n at least two and for B at least one, every integral
    projective curve of degree d has at most C(n) d^4 B^(2/d) rational points
    of height at most B, uniformly in its coefficients.
- declaration: CCDN.affineCurveBound
  informal: >-
    In ambient dimension n at least two and for B at least one, every integral
    affine curve of degree d has at most C(n) d^3 B^(1/d) (log B+d) integer
    points in the box of radius B.
- declaration: CCDN.affine_hypersurface_dimension_growth
  informal: >-
    In N at least three variables, an affine hypersurface of degree d at least
    five whose top form is absolutely irreducible has at most
    C(N) d^(3N+9) B^(N-2) integer points in the box of radius B, for B at least one.
- declaration: CCDN.projective_integral_curve_lower_bound
  informal: >-
    For every positive degree d, an integral projective plane curve and a radius
    B at least one attain at least d^2 B^(2/d)/5 rational points of height at most B.
- declaration: CCDN.classGroup_two_torsion_bound
  informal: >-
    For number fields K of degree n at least three, the two-torsion cardinality
    is at most C(n) |disc K|^(1/2-1/(2n)) (log |disc K|)^(1-(n mod 2)).
