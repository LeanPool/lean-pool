main_results:
- declaration: FormalLinguistics.bar_hillel_gaifman_shamir
  informal: Over a terminal type with decidable equality, the languages of
    basic categorial grammars are exactly the context-free languages that
    exclude the empty word.
  source_ref: Bar-Hillel, Gaifman and Shamir (1960), On categorial and phrase-structure grammars.
- declaration: FormalLinguistics.chomsky_pentus
  informal: Over a terminal type with decidable equality, the languages of
    product Lambek grammars with a distinguished primitive type are exactly the
    context-free languages that exclude the empty word.
  source_ref: Pentus (1993), Lambek grammars are context free, via Kanazawa (2018), Sections 3–4, arXiv:1709.07695.
- declaration: FormalLinguistics.michaelis_harkema_equivalence_SK
  informal: The languages of the formalized Stabler–Keenan minimalist grammars
    are exactly those generated by linear non-erasing multiple context-free grammars.
  source_ref: Michaelis, DOI 10.1007/3-540-48199-0_14, and Harkema, DOI 10.1007/3-540-48199-0_12.
