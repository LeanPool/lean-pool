slug: formal-grammar-equivalences
title: Categorial, Lambek, and minimalist grammar equivalences
summary: Proves weak language equivalences for basic categorial grammars,
  product Lambek grammars, and chain-based minimalist grammars. The development
  includes context-free normal forms, Lambek cut elimination and interpolation,
  and language-preserving translations between minimalist and multiple
  context-free grammars.
