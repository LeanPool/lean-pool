slug: locally-presentable-categories
title: Locally presentable categories and Gabriel–Ulmer duality
summary: Structure theorems for locally presentable and accessible categories, built on
  Mathlib's carriers. A locally presentable category is complete; it is locally
  κ-presentable exactly when it is a full reflective subcategory of a presheaf category on a
  small category, with κ-accessible inclusion, and exactly when it is a small-orthogonality
  class of presheaves for maps between κ-presentable presheaves. A category is locally
  presentable exactly when it is accessible and complete. Between locally presentable
  categories, a functor is a right adjoint exactly when it preserves limits and is accessible,
  and a left adjoint exactly when it preserves colimits. A category is finitely accessible
  exactly when it is Ind A for a small A. Gabriel–Ulmer duality on objects and morphisms is
  proved; every locally κ-presentable category is the category of κ-small-limit-preserving
  functors from a small theory with κ-small limits, the theory is recovered as the opposite
  of the κ-presentable models, and the κ-accessible right adjoints between categories of
  models are the restrictions along morphisms of theories. Algebras of finite-product
  theories form a locally finitely presentable category with sifted colimits computed
  pointwise, the colimit of the initial chain of an endofunctor that preserves it is an
  initial algebra, models of theories with D-limits form a reflective locally presentable
  subcategory, and generation under D-limits is detected by fully faithful D-functors.
