main_results:
- declaration: DynamicMcs.Proofs.common_order_extends_prefix
  informal: >-
    If the unchosen neighbor counts stay unchanged or increase by one along
    each proper common prefix, every common prefix extends to a common ordering.
- declaration: DynamicMcs.Proofs.insert_break_iff_old
  informal: >-
    At a position strictly between the inserted edge's endpoints, the old
    choice is invalid exactly when the later endpoint previously tied it on the
    neighbor count, or trailed by one and has the smaller index.
- declaration: DynamicMcs.Proofs.exec_insert_update_eq_mcsOrder
  informal: >-
    On symmetric loop-free adjacency matrices related by a single insertion,
    updating the old canonical ordering by the executable probe and repair
    agrees with greedy recomputation.
- declaration: DynamicMcs.Proofs.exec_delete_update_eq_mcsOrder
  informal: >-
    The analogous executable deletion update also agrees with greedy
    recomputation on the updated adjacency matrix.
- declaration: DynamicMcs.Proofs.exec_insert_cost_le
  informal: >-
    When the old ordering lists as many entries as the adjacency matrix has
    rows, the total operation count for insertion is at most the row count.
- declaration: DynamicMcs.Proofs.exec_delete_cost_of_no_break
  informal: >-
    When the deletion probe returns no break, the instrumented update takes
    one counted operation.
