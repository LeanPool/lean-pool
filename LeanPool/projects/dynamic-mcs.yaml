slug: dynamic-mcs
title: Dynamic maximum cardinality search
summary: >-
  Formalizes stability of maximum-cardinality search orderings under one-sided
  edge updates. For the canonical least-index tie break, it verifies exactly
  where a single edge update can invalidate an old choice and proves that
  a Boolean-adjacency probe-and-repair implementation gives the same ordering
  as greedy recomputation. Instrumented implementations count legality tests
  and greedy selections in a unit-cost model.
branch: graph algorithms and combinatorics
entry_module: LeanPool.DynamicMcs
