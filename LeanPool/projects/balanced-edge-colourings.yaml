main_results:
- declaration: LeanPool.BalancedEdgeColourings.BklsPalomar.theorem1
  informal: 'Every least-cost proper k-edge-colouring is balanced: for palettes P and Q of equal cardinality,
    the number of vertices seeing P is at most the number seeing Q plus two.'
  source_ref: BKLS (2004), Theorem 1
- declaration: LeanPool.BalancedEdgeColourings.BklsPalomar.theorem6
  informal: A proper three-edge-colouring can be replaced by a four-edge-colouring that separates
    vertices with equal keys, under the paper's restrictions on repeated degree-three palettes and
    key classes.
  source_ref: BKLS (2004), Theorem 6
- declaration: LeanPool.BalancedEdgeColourings.BklsPalomar.theorem10
  informal: For k at least three and at least the maximum degree, the degree-count bounds in BKLS
    Theorem 10(2) guarantee a vertex-distinguishing proper edge-colouring with k+1 colours.
  source_ref: BKLS (2004), Theorem 10(2), with k ≥ 3
- declaration: LeanPool.BalancedEdgeColourings.BklsPalomar.corollary12
  informal: For a finite simple graph with minimum degree at least five and maximum degree at least
    sqrt(2|V|)+4, let k be the least integer with n_d at most binomial(k,d) for every d. A vertex-distinguishing
    proper edge-colouring exists with k+1 colours, and every such colouring uses at least k colours.
  source_ref: BKLS (2004), Corollary 12
