slug: balanced-edge-colourings
title: Balanced and vertex-distinguishing edge colourings
summary: Formalizes Balister–Kostochka–Li–Schelp (2004), Theorems 1, 6, 10(2) and Corollary 12. Least-cost
  edge colourings balance palette multiplicities within two. Degree-count bounds then yield vertex-distinguishing
  colourings and the Burris–Schelp bound for graphs of large maximum degree and minimum degree at
  least five. Theorem 10(2) explicitly assumes k ≥ 3. Includes simultaneous Kempe exchanges, palette-counting
  and linear-programming dual bounds; does not formalize Theorem 10(1), Corollary 11 or the whole
  Burris–Schelp conjecture.
