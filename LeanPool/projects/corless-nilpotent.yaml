slug: corless-nilpotent
title: Corless's nilpotent Bohemian matrix conjecture
summary: >-
  Classifies the nilpotent complex skew-symmetric tridiagonal matrices with
  superdiagonal entries in {1, i} and counts them in each admissible dimension.
  The proof relates characteristic polynomials to weighted path matching
  polynomials, then uses the mod-2 dimension restriction and a mod-4 folding
  argument to recover the recursive superdiagonal vectors.
