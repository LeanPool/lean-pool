main_results:
  - declaration: Corless.corless_conjecture
    informal: >-
      For a superdiagonal vector with entries 1 or i, the associated
      skew-symmetric tridiagonal matrix is nilpotent exactly when the vector
      belongs to Corless's recursively folded family.
  - declaration: Corless.card_nilpotent
    informal: >-
      For each nonnegative k, exactly 2^k superdiagonal vectors yield
      nilpotent matrices of dimension 2^(k+1) - 1.
