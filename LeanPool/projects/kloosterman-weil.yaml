main_results:
- declaration: KloostermanWeil.weil1948_bound
  informal: For every prime p and nonzero coefficients m and n modulo p, the norm
    of the standard Kloosterman sum is at most twice the square root of p.
- declaration: KloostermanWeil.kloostermanUnitSum_crt
  informal: Kloosterman sums factor exactly over coprime nonzero moduli, with
    explicit Bezout-normalized coefficients.
- declaration: KloostermanWeil.centeredReducedIntervalSum_bound
  informal: For a positive squarefree modulus q, the mean-centered reciprocal
    phase defined at q divided by gcd(A,q) has interval sums bounded uniformly
    in interval length by its squarefree Weil constant times one plus log of
    that reduced modulus.
- declaration: KloostermanWeil.squarefreeUnitNumerator_bound
  informal: For every nonzero squarefree modulus q and unit first coefficient,
    the Kloosterman sum is bounded by 2 to the number of prime factors of q
    times the square root of q.
