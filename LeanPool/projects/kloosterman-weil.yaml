slug: kloosterman-weil
title: Kloosterman–Weil bounds via Carlitz and Stepanov
summary: Proves the classical prime Kloosterman–Weil bound by extension-field
  recurrences and auxiliary-polynomial point counts. Develops exact CRT
  factorization, squarefree bounds with a unit first coefficient, and centered
  incomplete reciprocal-phase bounds at the reduced modulus.
