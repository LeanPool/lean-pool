main_results:
- declaration: ProbabilityTheory.Copula.exists_sklarCopula
  informal: >-
    Every probability measure on a finite-dimensional real vector space admits
    a copula whose CDF, evaluated at the marginal CDFs, equals the joint CDF.
    Atoms, singular joint laws, and dimension zero are allowed.
  source_ref: >-
    Upstream Copula/Sklar/General.lean. Completed in commit
    eaee4eab6931066921870358c0f4bc0b8bd32068 on 2026-09-18 at 13:15:59 UTC;
    publicly released as v0.1.0 on 2026-09-19 at 07:05:23 UTC at
    https://github.com/Corrram/copula/releases/tag/v0.1.0.
- declaration: ProbabilityTheory.Copula.existsUnique_sklarCopula_of_continuous
  informal: >-
    If each marginal CDF is continuous, the Sklar copula exists and is unique
    on the entire closed unit cube; strict monotonicity is unnecessary.
  source_ref: Upstream Copula/Sklar/Continuous.lean.
- declaration: ProbabilityTheory.Copula.IsSklarCopula.cdf_eq_on_ranges
  informal: >-
    Any two Sklar copulas for the same real joint law have equal CDFs whenever
    every coordinate belongs to the range of the corresponding marginal CDF.
  source_ref: Upstream Copula/Sklar/Continuous.lean.
- declaration: ProbabilityTheory.Copula.isClassical_iff_existsUnique
  informal: >-
    A real function on the finite unit cube is normalized, grounded, has uniform
    one-dimensional margins, and has nonnegative ordered rectangle increments
    if and only if it is the CDF of exactly one copula probability measure.
    Continuity follows from these conditions and is not an extra hypothesis.
  source_ref: >-
    Upstream Copula/Classical/Characterization.lean, completed in commit
    5578d2b62ad948570a3edce60330d012e6b5c97b on 2026-09-18 at 13:58:11 UTC.
- declaration: ProbabilityTheory.Copula.exists_lift
  informal: >-
    A joint probability law on a finite power of a standard Borel space
    lifts to a copula through any measurable coordinate sampling maps from the
    uniform unit interval whose pushforwards are the given marginal laws.
  source_ref: Upstream Copula/Sklar/Lift.lean.
