slug: finite-dimensional-copulas
title: Finite-dimensional copulas and Sklar's theorem
summary: >-
  Constructs copulas as probability measures with uniform coordinate marginals,
  proves Sklar's theorem for arbitrary finite-dimensional real laws, and proves
  uniqueness for continuous marginals and equality on marginal CDF ranges in
  general. Establishes the equivalence with the classical normalized, grounded,
  uniform-margin, rectangle-increasing CDF conditions without assuming continuity.
  Includes compact quantile sampling, randomized inverse disintegration, general
  lifting of joint laws, Lipschitz bounds, and finite atomic approximation.
