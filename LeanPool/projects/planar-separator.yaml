slug: planar-separator
title: Planar separators and nested dissection
summary: Proves weighted separator bounds for finite plane rotation systems and induced
  vertex sets, constructs separator trees, and verifies fill and arithmetic-operation bounds
  for nested dissection. Also verifies a linear-step separator program on an explicit RAM.
