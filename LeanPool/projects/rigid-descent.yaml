main_results:
- declaration: RigidDescent.theoremA
  informal: In a rigidly compactly generated, braided closed tensor-triangulated category,
    the four descent and purity conditions are equivalent for a ring object and a
    distinguished triangle for its unit.
- declaration: RigidDescent.theoremA_of_splitMono
  informal: In the same category, the equivalence holds for a map from the unit that becomes split monic
    after tensoring on the left by its target.
- declaration: RigidDescent.brown_representability
  informal: A cohomological additive functor to abelian groups that sends coproducts
    to products is representable in the compactly generated setting.
