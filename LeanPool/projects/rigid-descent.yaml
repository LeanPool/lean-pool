slug: rigid-descent
title: Descent and effective descent in rigid categories
summary: For a ring object in a rigidly compactly generated, braided closed
  tensor-triangulated category, descent type, effective descent type, nil-purity of
  the unit fiber and the existence of
  a pure monomorphism from the unit into its thick tensor ideal are equivalent.
  The development proves Brown representability and gives tools for compact generation,
  homotopy limits of towers and pro-constancy.
branch: category theory
