main_results:
- declaration: ExtriangulatedRealization.theoremA
  informal: Constructs a single inverse system over the first uncountable ordinal whose
    extriangulated category has the stated structure and fails the limit-surjectivity test.
- declaration: ExtriangulatedRealization.theoremB
  informal: For an inverse system of vector spaces over a field indexed by a nonempty
    well-ordered set, with surjective transition maps, surjectivity of the inverse-limit
    projections is equivalent to triangulated embeddability and to algebraic realizability
    in the stated target universes.
- declaration: ExtriangulatedRealization.theoremB_necessity
  informal: For an inverse system of vector spaces over a field indexed by a linearly
    ordered set, a triangulated embedding in arbitrary target universes forces surjectivity
    of the inverse-limit projections, ruling out every target for the witness of Theorem A.
