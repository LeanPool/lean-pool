slug: extriangulated-realization
title: An extriangulated category with no triangulated embedding
summary: Over every field, an Aronszajn tree gives one essentially small hereditary
  Krull–Schmidt extriangulated category with enough injectives that has no fully
  faithful extriangulated embedding into a triangulated category in any universe.
  Every countable family of objects lies in an extension-closed subcategory with
  an algebraic realization. For inverse systems of vector spaces over a field indexed
  by a nonempty well-ordered set, with surjective transition maps, surjectivity of
  the limit projections characterizes embeddings and algebraic realizations.
