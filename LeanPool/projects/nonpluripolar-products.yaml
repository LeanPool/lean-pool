slug: nonpluripolar-products
title: Nonpluripolar products of positive currents
summary: Constructs nonpluripolar products from compatible local potentials on
  complex manifolds and proves independence of the local presentation. The
  development also establishes compatibility with locally bounded
  Bedford–Taylor factors and finiteness of the mixed measure on compact Kähler manifolds.
