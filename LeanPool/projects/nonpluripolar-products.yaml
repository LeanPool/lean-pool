main_results:
- declaration: SGPT.NPP.currentProduct_restrict
  informal: The nonpluripolar product of a well-defined family of positive currents
    restricts to the product computed from any local potentials for those currents.
- declaration: SGPT.NPP.NonPluripolarCurrent.nonPluripolarProduct_append_bounded
  informal: Adding locally bounded plurisubharmonic factors to a well-defined
    local nonpluripolar product agrees with the iterated Bedford–Taylor product.
- declaration: SGPT.Foundations.Analysis.Pending.GlobalNonPluripolar.globalMixedMeasure_isFiniteMeasure
  informal: The mixed nonpluripolar measure of theta-plurisubharmonic potentials
    for smooth closed real backgrounds is finite on a compact Kähler manifold.
