main_results:
- declaration: Polynomial.intValuedBasis
  informal: The binomial polynomials X choose n, for n ≥ 0, form a basis over ℤ of the
    ring of rational polynomials taking integer values at all integers.
  source_ref: P.-J. Cahen and J.-L. Chabert, Integer-Valued Polynomials, Mathematical
    Surveys and Monographs 48, American Mathematical Society (1997), Chapter I.
- declaration: Polynomial.exists_eq_sum_intCast_smul_choose
  informal: A rational polynomial P taking integer values at all natural numbers is an
    integer linear combination of the binomial polynomials X choose k with k ≤ deg P.
  source_ref: G. Pólya, "Über ganzwertige Polynome in algebraischen Zahlkörpern", J. Reine
    Angew. Math. 149 (1919), 97–116; see also Cahen–Chabert, Integer-Valued Polynomials
    (1997), Chapter I.
- declaration: isNoetherianRing_iff_forall_finitePresentation
  informal: A ring R is Noetherian if and only if every finitely generated R-module is
    finitely presented.
- declaration: Module.injective_iff_smul_surjective
  informal: Over a principal ideal domain R, a module Q is injective if and only if it is
    divisible, that is, multiplication by every nonzero r is surjective on Q.
- declaration: IsSimpleModule.nonempty_linearEquiv_of_trace_eq
  informal: Let k be an algebraically closed field of any characteristic and A a
    k-algebra. Two simple A-modules that are finite-dimensional over k and on which every
    element of A acts with the same trace are isomorphic.
- declaration: Polynomial.forall_hasseDeriv_eq_zero_iff_exists_expand
  informal: Over a commutative ring of prime characteristic p, the Hasse derivatives of a
    polynomial f of all orders k with 0 < k < p^e vanish if and only if f is a polynomial
    in X^(p^e).
- declaration: Module.FinitePresentation.piRightHom_bijective
  informal: For a finitely presented R-module M and any family of R-modules P i, the
    canonical map from M ⊗ (Π i, P i) to Π i, M ⊗ P i is bijective.
  source_ref: The Stacks Project, Tag 059K, implication (1) ⇒ (2).
- declaration: Submodule.IsAssociatedPrime.comap_eq_of_flat
  informal: Let B be an A-algebra, F a B-module that is flat over A, p a prime of A and N
    a B-submodule of F whose underlying A-submodule is pF. Then every associated prime of
    the B-module F/N lies over p.
