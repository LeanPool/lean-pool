slug: commutative-algebra-toolkit
title: Commutative algebra toolkit
summary: A collection of general results in commutative algebra and neighbouring areas,
  each self-contained and stated in Mathlib's language. It proves Pólya's theorem that
  the binomial polynomials form a ℤ-basis of the integer-valued polynomials, via Newton's
  forward difference formula; that a ring is Noetherian if and only if every finitely
  generated module is finitely presented; that over a principal ideal domain a module is
  injective if and only if it is divisible, with the module K/A of a fraction field as an
  application; that two finite-dimensional simple modules over an algebraically closed
  field with the same trace function are isomorphic, in any characteristic; that in prime
  characteristic p the Hasse derivatives of orders 0 < k < p^e vanish exactly on
  polynomials in X^(p^e); that tensoring with a finitely presented module commutes with
  arbitrary products; and that associated
  primes of F/N lie over p when F is flat and N lies over pF. Smaller results cover flat
  products, adic completeness along nilpotent ideals, Baer's criterion for I-primary
  modules, stable range one for semilocal rings, Noetherian quasi-sober spaces, derivations, the group completion of a
  commutative monoid, resultants of split polynomials, and the image of Frobenius in a
  normed field of characteristic p.
