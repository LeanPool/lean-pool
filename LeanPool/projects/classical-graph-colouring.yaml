slug: classical-graph-colouring
title: Classical graph colouring through lists, orientations and spectra
summary: >-
  Proves Kőnig's edge-colouring theorem for finite bipartite simple graphs by
  reusing Lean Pool's Vizing partial-colouring and Kempe-chain infrastructure.
  A stable-matching theorem for strict preferences and incomplete acceptability
  lists supplies kernels for Galvin's orientation of the line graph. This gives
  list edge colouring from lists of size at least the maximum degree and the
  Dinitz array theorem. Gallai–Hasse–Roy–Vitaver relates graph colourings to
  directed paths, while Wilf's and Hoffman's eigenvalue bounds control the
  chromatic and independence numbers. Two interface corollaries turn the
  spectral colouring bounds into directed-path bounds. Existing Vizing,
  matching-cover, poset and equitable-colouring results are reused or left
  in their established Lean Pool projects rather than copied.
branch: graph theory and combinatorics
