main_results:
- declaration: Konig.lineGraph_colorable_of_colorable_two
  informal: >-
    A finite bipartite simple graph has a proper edge colouring using its
    maximum degree many colours.
  source_ref: Kőnig (1916), doi:10.1007/BF01456961; PALOMAR-2026-10-15-000019.
- declaration: Konig.lineGraph_chromaticNumber_of_colorable_two
  informal: The chromatic index of a finite bipartite simple graph equals its maximum degree.
  source_ref: Kőnig (1916), doi:10.1007/BF01456961; PALOMAR-2026-10-15-000019.
- declaration: Galvin.gale_shapley
  informal: >-
    Finite strict-preference matching instances with incomplete acceptability
    lists have a stable matching.
  source_ref: Gale and Shapley (1962), doi:10.1080/00029890.1962.11989827; PALOMAR-2026-10-18-000029.
- declaration: Galvin.galvin
  informal: >-
    Every finite bipartite simple graph admits a proper edge colouring from
    arbitrary edge lists of size at least its maximum degree.
  source_ref: Galvin (1995), doi:10.1006/jctb.1995.1011; PALOMAR-2026-10-18-000029.
- declaration: Galvin.dinitz
  informal: >-
    An n by n array of lists of at least n symbols per cell admits a choice
    of symbols distinct within every row and every column.
  source_ref: Galvin (1995), doi:10.1006/jctb.1995.1011; PALOMAR-2026-10-18-000029.
- declaration: GallaiRoy.colorable_of_orientation
  informal: >-
    If every directed path in an orientation of a finite graph has at most k
    vertices, then the graph is k-colourable.
  source_ref: Gallai (1968), Hasse (1965), Roy (1967), Vitaver (1962); PALOMAR-2026-10-16-000015.
- declaration: GallaiRoy.exists_orientation_of_colorable
  informal: >-
    Every k-colourable finite graph has an orientation with no directed path
    on more than k vertices.
  source_ref: Gallai–Hasse–Roy–Vitaver theorem; PALOMAR-2026-10-16-000015.
- declaration: SpectralBounds.average_degree_le
  informal: The average degree of a finite graph is at most its largest adjacency eigenvalue.
  source_ref: Collatz–Sinogowitz; PALOMAR-2026-10-18-000016.
- declaration: SpectralBounds.le_maxDegree
  informal: The largest adjacency eigenvalue is at most the maximum degree.
  source_ref: Collatz–Sinogowitz; PALOMAR-2026-10-18-000016.
- declaration: SpectralBounds.wilf
  informal: A finite graph is colourable with floor of its largest adjacency eigenvalue plus one colours.
  source_ref: Wilf (1967); PALOMAR-2026-10-18-000016.
- declaration: SpectralBounds.hoffman_chromatic
  informal: >-
    If a finite graph has an edge, every proper colouring uses at least one
    minus the ratio of the largest and smallest adjacency eigenvalues colours.
  source_ref: Hoffman (1970); PALOMAR-2026-10-18-000016.
- declaration: SpectralBounds.hoffman_ratio
  informal: >-
    Every independent set in a finite regular graph satisfies Hoffman's
    adjacency-eigenvalue ratio bound.
  source_ref: Hoffman (1970); PALOMAR-2026-10-18-000016.
- declaration: ClassicalGraphColouring.hoffman_le_directed_path_bound
  informal: >-
    Hoffman's spectral lower bound for chromatic number bounds the maximum
    directed path length in every orientation.
  source_ref: Interface corollary of the proved Hoffman and Gallai–Roy theorems.
- declaration: ClassicalGraphColouring.exists_orientation_of_wilf_bound
  informal: >-
    Every finite graph has an orientation whose directed paths have at most
    floor of its largest adjacency eigenvalue plus one vertices.
  source_ref: Interface corollary of the proved Wilf and Gallai–Roy theorems.
