slug: lc-analysis
title: Michal–Bastiani Calculus on Locally Convex Spaces
summary: >-
  Develops real Michal–Bastiani calculus on Hausdorff locally convex spaces,
  with the chain rule, continuous symmetric higher differentials, and Taylor's
  formula in weak form. It proves equivalence with smooth Fréchet calculus on
  open subsets of normed spaces. Weak integrals exist for continuous curves in
  sequentially complete spaces and for continuously differentiable curves in
  Mackey complete spaces; Mackey completeness is characterized by weak
  integrability of Lipschitz curves. A smooth map from a Banach space to a
  normed space with derivative uniformly bounded below reflects finite
  differentiability of continuous maps from open locally convex domains.
