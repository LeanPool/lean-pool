main_results:
- declaration: LCAnalysis.ContDiffMBOn.comp
  informal: >-
    Composing two real Michal–Bastiani C^k maps between open subsets of
    Hausdorff locally convex spaces preserves C^k regularity, provided the
    inner map takes the first domain into the second.
- declaration: LCAnalysis.ContDiffMBOn.exists_iteratedDMB_multilinear
  informal: >-
    At every point of its open domain, the kth differential of a
    Michal–Bastiani C^k map is a continuous symmetric k-linear map.
- declaration: LCAnalysis.smoothMBOn_iff_contDiffOn
  informal: >-
    On open subsets of real normed spaces, Michal–Bastiani smoothness is
    equivalent to Fréchet smoothness.
- declaration: LCAnalysis.exists_hasWeakIntegral
  informal: >-
    A continuous curve on the closed interval between any two real
    endpoints has a weak integral in every sequentially complete
    Hausdorff locally convex target space.
- declaration: LCAnalysis.mackeyComplete_iff_integratesLipschitzCurves
  informal: >-
    In a Hausdorff locally convex real space, convergence of Mackey–Cauchy
    sequences is equivalent to existence of weak integrals for all curves
    whose difference quotients form a bounded set on every nondegenerate
    compact real interval.
- declaration: LCAnalysis.ContDiffMBOn.of_comp_of_boundedBelow
  informal: >-
    Let j be a smooth map from an open subset U of a real Banach space to
    a real normed space, with a fixed m > 0 such that every x in U and
    every vector v satisfy norm(dj(x)v) >= m * norm(v). If gamma maps an
    open locally convex domain
    continuously into U and j composed with gamma is C^k in the sense of
    Michal–Bastiani, then gamma is C^k.
