main_results:
- declaration: GinibrePoincare.ginibre_symmetric_weak_poincare
  informal: For n > 0, symmetric Ginibre L² values and their ordinary distributional L² gradients
    satisfy variance ≤ energy / 2, with energy normalized by 1/n.
  source_ref: 'Theorem 1.1 of arXiv:2608.19358v2; Palomar PALOMAR-2026-10-09-000001 v1 was registered
    on 2026-10-09T00:48:41Z. Proposal #644 is dated 2026-10-12T16:36:51Z.'
- declaration: GinibrePoincare.ginibreEquality_full_weak_affine_iff
  informal: Equality holds exactly for almost-everywhere representatives of a + 2 Re(c ∑ᵢ zᵢ),
    for a real a and a complex c; no smoothness or polynomial assumption is imposed.
  source_ref: Additional exhaustive affine classification accompanying Theorem 1.1, proved in
    upstream Analysis/GinibreEqualityWeakAffine.lean. The paper explicitly exhibits center-of-mass
    equality examples.
- declaration: GinibrePoincare.fullTheoremOneNine_named
  informal: For every real symmetric observable in the closed Ginibre generator graph, the
    energy-minus-variance and generator-minus-energy deficits equal explicit sums of squared
    norms and weighted Hermite masses. The weak gradient and moment summability are conclusions.
  source_ref: Generator-graph form of Theorem 1.9 of arXiv:2608.19358v2, formalized upstream
    in Endgame/FullTheoremOneNine.lean.
- declaration: GinibrePoincare.fullMainAnalyticProof
  informal: For every n > 0, every smooth, compactly supported, permutation-symmetric real f
    satisfies Var(f) ≤ E(f)/2 with E(f) = (1/n)∫|∇f|² for the Ginibre law, proved by the
    paper's original route (Vandermonde energy identity, Gaussian dbar estimate, distance
    transport, holomorphic–antiholomorphic half-distance). Every analytic input is a proved
    theorem.
  source_ref: Original Section 2 proof of Theorem 1.1 of arXiv:2608.19358v2, on the smooth
    compact symmetric core.
- declaration: GinibrePoincare.spectral_ginibre_symmetric_weak_poincare
  informal: For n > 0, every symmetric real Ginibre L² class with an ordinary distributional L²
    gradient on the collision-free set satisfies Var ≤ E/2, proved through the
    Vandermonde-transformed Gaussian number forms and the projection bound.
  source_ref: Section 3 spectral proof of Theorem 1.1 of arXiv:2608.19358v2.
- declaration: GinibrePoincare.slater_ginibre_symmetric_weak_poincare
  informal: The same weak-H¹ inequality Var ≤ E/2 for n > 0, proved through the
    factorial-normalized Slater-determinant expansion, its Parseval identity and degree energy.
  source_ref: Section 4 Hermite–Slater proof of Theorem 1.1 of arXiv:2608.19358v2.
- declaration: GinibrePoincare.fullTheoremOneTenSchwartz
  informal: For n > 0 and every real symmetric pair (u, v) in the closed Ginibre generator
    graph, u has a symmetric distributional gradient g, and an explicit deficit vector w has
    ordinary distributional first and second dbar derivatives. With r the holomorphic
    remainder, E − 2Var = 2‖r‖² + (4/n)Σ‖∂̄∂̄w‖² and
    ‖v‖² − 2E = ‖v + 2(u − mean u)‖² + 4‖r‖² + (8/n)Σ‖∂̄∂̄w‖²; equality E = 2Var holds iff
    u = a + 2Re(c Σzᵢ) almost everywhere.
  source_ref: Theorem 1.10 of arXiv:2608.19358v2; derived upstream from the Theorem 1.9 Hermite
    identity.
- declaration: GinibrePoincare.bochnerKodairaTheoremOneTen
  informal: The two differential deficit identities of Theorem 1.10, with coefficients 4/n and
    8/n and ordinary distributional first and second dbar derivatives, on the real symmetric
    generator graph for n > 0, obtained through the integrated Bochner–Kodaira identity.
  source_ref: Section 6 integrated Bochner–Kodaira route for Theorem 1.10 of arXiv:2608.19358v2.
- declaration: GinibrePoincare.radialObservable_ginibre_gamma
  informal: For n ≥ 2, under the Ginibre law the recentered radius n·Σᵢ|zᵢ − (Σⱼzⱼ)/n|² has the
    Gamma law with shape (n−1)(n+2)/2 and rate 1.
  source_ref: Gamma-radius part of Theorem 1.2 of arXiv:2608.19358v2.
- declaration: GinibrePoincare.polynomialEigenfunction_eigenvalue_equation_atSpeed
  informal: For n ≥ 2, any speed α and indices a, b, m, the Hermite–Laguerre polynomial
    H_{a,b}(S)·L_m(R) satisfies the pointwise eigenvalue equation for the negative Ginibre pregenerator
    at speed α, with eigenvalue 2(α/n)(a + b + 2m), at every collision-free configuration.
  source_ref: Theorem 1.4 of arXiv:2608.19358v2 (pointwise eigenvalue equation).
- declaration: GinibrePoincare.ginibreFullGeneratorAtSpeed_all_positive_n_spectrum_containment
  informal: For every n > 0 and α > 0, each −2αk/n (k ∈ ℕ) lies in the spectrum of the full
    symmetric Ginibre generator at speed α, where spectrum means failure of a bounded two-sided
    resolvent on the graph domain.
  source_ref: Corollary 1.5 of arXiv:2608.19358v2 (the case n = 1 included).
- declaration: GinibrePoincare.polynomialSector_incomplete
  informal: For n ≥ 2, an explicit nonzero permutation-symmetric centered quadratic is
    orthogonal to the closed span of the Hermite–Laguerre polynomial eigenfunctions, so that
    closed sector is a proper subspace of the Ginibre L² space.
  source_ref: Remark 1.6 of arXiv:2608.19358v2.
- declaration: GinibrePoincare.ginibre_pointwise_bakry_emery_curvature_unbounded_below
  informal: For n ≥ 2 and every real B, some collision-free configuration and unit coordinate
    direction e give (1/n)·∂²ₑH < B for the Ginibre Hamiltonian H = n|z|² − log|V(z)|², so the
    pointwise Bakry–Émery curvature has no lower bound.
  source_ref: Lemma 1.7 of arXiv:2608.19358v2 (with an explicit collapsing witness).
- declaration: GinibrePoincare.ginibre_pointwise_mean_curvature
  informal: For n > 0, at every collision-free configuration the Laplacian of the Ginibre
    Hamiltonian divided by n·2n, the mean eigenvalue of its 1/n-normalized real Hessian, equals 2.
  source_ref: Remark 1.8 of arXiv:2608.19358v2.
- declaration: GinibrePoincare.radial_sobolev_lsi
  informal: For n > 0, every pair in the L² value–gradient closure of smooth, compactly
    supported, symmetric functions of |z₁|²,…,|zₙ|² has integrable f² log f² and satisfies
    Ent(f²) ≤ (1/n)‖∇f‖² for the Ginibre law.
  source_ref: Theorem 1.12 of arXiv:2608.19358v2 (radial log-Sobolev inequality and its
    Sobolev completion).
- declaration: GinibrePoincare.gaussianSchwartzDbar_entire_gap
  informal: For n > 0, every u in the Gaussian L² space whose ordinary distributional
    derivatives ∂̄ⱼu lie in L² satisfies dist(u, entire L² functions)² ≤ (1/n)Σⱼ‖∂̄ⱼu‖².
  source_ref: Lemma 2.2 of arXiv:2608.19358v2, on the maximal distributional domain.
- declaration: GinibrePoincare.gaussianVolumeClosedForm_canonicalSolvability
  informal: For n > 0, every distributionally dbar-closed (0,1)-form with Gaussian L²
    coefficients D has a unique minimum-norm Gaussian L² solution u of ∂̄u = D, with
    ‖u‖² ≤ (1/n)Σⱼ‖Dⱼ‖².
  source_ref: Remark 2.4 of arXiv:2608.19358v2, by a Gaussian-specific Hermite construction
    rather than the general Hörmander–Berndtsson theorem.
- declaration: GinibrePoincare.entire_alternating_vandermonde_factorization
  informal: For n > 0, every entire alternating function on ℂⁿ equals the Vandermonde product
    times an entire symmetric function, globally including all collision points.
  source_ref: Lemma 2.6 of arXiv:2608.19358v2.
- declaration: GinibrePoincare.ginibreDivisibleEntire_real_centered_geometry
  informal: For n > 0 and a real centered Ginibre L² function f with projection h onto the
    Vandermonde-divisible entire space, h, its conjugate and the remainder r are mutually
    orthogonal, ‖f‖² = 2‖h‖² + ‖r‖², and dist(f, entire space)² = ‖f‖²/2 + ‖r‖²/2.
  source_ref: Lemma 2.7 of arXiv:2608.19358v2 (equations 2.26–2.28).
- declaration: GinibrePoincare.ginibreComplexSmoothCore_closure_equivalence
  informal: For n > 0, the L² graph closures of complex-valued compactly supported smooth
    functions on all of ℂⁿ and on the collision-free set coincide.
  source_ref: Lemma A.2 of arXiv:2608.19358v2 (core equality).
- declaration: GinibrePoincare.ginibreCollisionSet_capacity_zero
  informal: For n > 0, the collision set has zero weighted H¹ capacity for the Ginibre law.
  source_ref: Lemma A.3 of arXiv:2608.19358v2.
- declaration: GinibrePoincare.correspondenceMatrix_theorem_1_13
  informal: For n > 0 and a permutation-symmetric C¹ observable F on ℂⁿ whose spectral lift
    F(eigenvalues of A) lies in the Gaussian matrix H¹ space, the eigenvector-overlap energy is
    integrable, F² log F² is integrable for the Ginibre law, Var(F) ≤ (2/n)·E[overlap energy]
    and Ent(F²) ≤ (4/n)·E[overlap energy], expectations under the Gaussian matrix law.
  source_ref: Theorem 1.13 of arXiv:2608.19358v2 (matrix lift and eigenvector-overlap
    inequalities, on the literal Gaussian matrix H¹ lift domain).
- declaration: GinibrePoincare.fullMatrixLift_functional_inequalities
  informal: For n > 0 and a permutation-symmetric C¹ observable F in the Ginibre L² space with
    integrable eigenvector-overlap energy, F² log F² is integrable, Var(F) ≤ (2/n)·E[overlap
    energy] and Ent(F²) ≤ (4/n)·E[overlap energy].
  source_ref: Theorem 1.13 of arXiv:2608.19358v2 (finite overlap-energy domain).
- declaration: GinibrePoincare.matrixSpectralLift_finite_overlap_gaussian_poincare
  informal: For n > 0 and a differentiable permutation-symmetric F in the Ginibre L² space with
    integrable overlap energy, Var(F) ≤ (2/n)·E[overlap energy], proved by the Gaussian matrix
    Poincaré inequality applied to the spectral lift without invoking Theorem 1.1.
  source_ref: Gaussian matrix Poincaré proof of the variance part of Theorem 1.13 of
    arXiv:2608.19358v2.
- declaration: GinibrePoincare.matrixGaussian_poincare_compactC1
  informal: For n > 0, every compactly supported C¹ function on the real coordinates of n×n
    complex matrices satisfies Var ≤ (1/(2n))·E[|∇F|²] under the Gaussian matrix law.
  source_ref: Gaussian matrix Poincaré inequality used in the proof of Theorem 1.13 of
    arXiv:2608.19358v2, proved internally from the Gaussian log-Sobolev inequality.
- declaration: GinibrePoincare.ginibreTwoRadius_equilibrium_gamma_product
  informal: For n ≥ 2, under the Ginibre law the pair (|Σᵢzᵢ|², Σ_{j<k}|zⱼ − zₖ|²) has the product
    law Gamma(1, 1) ⊗ Gamma(κₙ, 1) with κₙ the recentered Gamma shape, the two equilibrium
    radii of the stochastic factorization.
  source_ref: Equilibrium radius laws in Theorem 1.2 of arXiv:2608.19358v2.
- declaration: GinibrePoincare.ginibre_nonsymmetric_poincare_constant_lower_bound
  informal: For n ≥ 2, any constant C such that Var(f) ≤ C·E(f) for all smooth integrable f with
    square-integrable values and gradients, symmetric or not, satisfies C ≥ (n+1)/4; the
    witness is a real coordinate.
  source_ref: Nonsymmetric counterexample discussed with Theorem 1.1 of arXiv:2608.19358v2
    (supplementary result).
- declaration: GinibrePoincare.ginibreSquaredNormL2_not_holomorphic
  informal: For n > 0, the squared Euclidean radius Σᵢ|zᵢ|², as an element of the complex
    Ginibre L² space, does not belong to the closed span of symmetric holomorphic polynomials.
  source_ref: Supplementary remark on the holomorphic projection geometry of
    arXiv:2608.19358v2, Section 2.
