slug: ginibre-poincare
title: Sharp symmetric Poincaré inequality for the complex Ginibre log-gas
summary: Proves the sharp Poincaré inequality for symmetric observables in the weighted weak-H¹
  domain, using ordinary distributional gradients on the collision-free open set, of the complex
  Ginibre log-gas, with exhaustive affine equality cases, and the two Hermite sum-of-squares deficit
  identities on the real symmetric generator graph. Also formalizes the paper's three proofs of the
  inequality, namely the original Section 2 analytic route on the smooth compact core and the
  Section 3 spectral and Section 4 Hermite–Slater routes on the weak-H¹ domain. Proves the
  differential deficits of Theorem 1.10 with ordinary distributional second dbar derivatives, by the
  Hermite and by the Bochner–Kodaira routes; the Section 2 lemmas (sharp Gaussian dbar gap and
  equality space, canonical minimum-norm dbar solutions, closedness of the entire L² space, global
  Vandermonde division of entire alternating functions, holomorphic–antiholomorphic projection
  geometry); the Gamma law of the recentered radius; Hermite–Laguerre polynomial eigenfunctions,
  spectrum containment and polynomial-sector incompleteness; unbounded pointwise curvature; the
  radial log-Sobolev inequality; and the Appendix A core-closure and zero-capacity lemmas. Through
  the Gaussian matrix lift, proves the eigenvector-overlap variance and entropy inequalities of
  Theorem 1.13, including the Gaussian matrix Poincaré inequality. Builds Brownian
  stochastic-integration and finite-dimensional Itô infrastructure, and proves the joint Gamma law
  of the two equilibrium radii, the nonsymmetric constant lower bound (n+1)/4 and the non-holomorphy
  of the squared radius. Constructs the maximal Brownian-driven solution of the Ginibre Langevin
  equation, proves stationarity of the Ginibre law along its whole future path, and identifies its
  transition Laplace transform with the analytic resolvent of the full generator. Proves global
  noncollision of the original Brownian-driven dynamics, its dynamical factorization into two
  independent CIR radii (Theorem 1.3), stationarity of their Gamma product law, and identification
  of the transition semigroup with the analytic generator evolution. For nonquadratic
  rotation-invariant potentials (Theorem 1.14), proves the symmetric Poincaré inequality under a
  Laplacian lower bound and the radial log-Sobolev inequality under strong convexity, including an
  internal proof of the strongly convex Bakry–Émery log-Sobolev inequality. Finally proves the
  literal pointwise Γ₂ form of Theorem 1.9 and its curvature reformulation, the spectral support of
  the generator, unstopped CIR equations, the strong Markov property and ergodicity of the dynamics,
  the ordinary-H¹ form domain, the Gaussian number-operator spectrum, and the auxiliary
  Brascamp–Lieb, GUE, local Dolbeault, weighted entire-space, Gram–Schmidt and analyticity
  assertions.
