slug: finite-integral-relation-algebras
title: Enumeration of finite integral relation algebras through seven atoms
summary: Classifies finite integral relation algebras by lawful atom cycles and verifies the
  published isomorphism-class counts using Burnside's lemma and kernel-checked Boolean
  counting certificates. The reference table is Peter Jipsen's compilation, which follows
  the ordering of Roger Maddux's earlier list.
