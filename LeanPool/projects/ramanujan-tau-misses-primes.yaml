- abc_bound_E4
main_results:
- declaration: main_theorem
  informal: For any function satisfying the properties of tau recorded in `RamanujanTau`
    (Hecke multiplicativity and recurrence, the parity criterion, Deligne's bound and
    the non-unit property), the ABC conjecture together with the sharper N^{1/2} form
    of Xiong's Proposition 5.4 (the hypothesis `Proposition54`, which is assumed and
    not proved) implies that the number of primes ℓ ≤ X with |τ(n)| = ℓ for some n is
    O(X^{13/22}), so tau misses almost all primes.
- declaration: reduction_lemma
  informal: Assuming ABC and `Proposition54` (Xiong's Proposition 5.4, sharper
    N^{1/2} form), bounds the prime-value count S(X) by a constant times
    X^{1/2} log X + X^{13/22} + X^{6/11} + E2(X) + E4(X).
- declaration: abc_bound_E2
  informal: Assuming ABC, for every η > 0 the number E2(X) of pairs (x, y) with
    x > X^{2/11} and 1 ≤ |x^11 - y^2| ≤ X is O(X^{4/9 + η}).
- declaration: abc_bound_E4
  informal: Assuming ABC, for every η > 0 the number E4(X) of pairs (x, u) with
    x > X^{1/11} and 1 ≤ |u^2 - 5 x^22| ≤ 4X is O(X^{1/5 + η}).
