main_results:
  - declaration: DeciSigma1.decideBooleanSentence
    informal: >-
      Decides Boolean combinations of existential and universal subtype sentences
      for every finite constructor arity and variance over finite, regular, or
      arbitrary trees with bottom and top.
  - declaration: DeciSigma1.booleanSentence_regular_iff
    informal: Regular and arbitrary trees have the same Boolean existential theory.
  - declaration: DeciSigma1.decideBooleanSentenceTopFree
    informal: >-
      Decides the corresponding theory without top for a covariant constructor
      over finite, regular, or arbitrary trees.
  - declaration: DeciSigma1.exists_small_hole
    informal: >-
      Every finite-state structural reader over a finite alphabet, with decidable
      equality, that has a hole has one whose total word length satisfies a
      computable bound.
  - declaration: DeciSigma1.smallHoleBound_le
    informal: The hole-length bound is bounded by four iterated exponentials.
