slug: subtyping-sigma1
title: Decidability of the Sigma-one theory of non-structural subtyping
summary: >-
  Computable decision procedures for Boolean combinations of existential and
  universal non-structural subtype sentences, with one constructor of arbitrary
  finite arity and variance, over finite, regular, and arbitrary trees. Includes
  disjunctive entailment, finite-countermodel transfer under finite
  satisfiability, automata, word compression, and an elementary total-length
  bound for holes of finite-state structural readers over finite alphabets.
