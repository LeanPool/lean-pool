main_results:
  - declaration: GoldbergSeymour.goldbergSeymour
    informal: >-
      Every finite loopless multigraph G has chromatic index at most
      max(Delta(G) + 1, ceil(Gamma(G))), where Delta is the maximum vertex
      degree and Gamma is the maximum of zero and 2|E(U)|/(|U| - 1) over
      odd vertex sets U of size at least three. E(U) contains every edge
      whose two endpoints lie in U, including parallel edges separately.
  - declaration: GoldbergSeymour.GeneralHighIndexElementary
    informal: >-
      If a finite loopless multigraph has chromatic index at least its
      maximum degree plus two, its chromatic index equals the ceiling
      of its odd-set density.
