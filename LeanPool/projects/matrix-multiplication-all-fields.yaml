slug: matrix-multiplication-all-fields
title: Matrix multiplication exponent at most 9/4 over every field
summary: The arithmetic exponent of square matrix multiplication is at most 9/4 over every field.
  The proof preserves a general tensor-rank and arithmetic-program library, extends Fourier separation
  to positive characteristic, and descends finite tensor decompositions through algebraic extensions.
  For every positive epsilon it constructs correct division-free programs of cost at most C n^(9/4
  + epsilon), with C uniform in the matrix size.
