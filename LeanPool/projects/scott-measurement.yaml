slug: scott-measurement
title: Scott's measurement representation theorems
summary: >-
  Formalizes all eight numbered finite representation theorems of Dana Scott's
  1964 Measurement Structures and Linear Inequalities. Develops a shared finite
  separation and rational-cancellation engine, unit-threshold semiorder
  representations, additive utility on pairs, ordered utility differences, and
  normalized finitely additive probabilities on finite Boolean algebras. Includes
  the Kraft-Pratt-Seidenberg five-atom counterexample to de Finetti's weaker
  axioms and local real embeddings of finite subsets of ordered abelian groups.
  A separately labelled modern infinite analogue assumes a generalized Kelley
  condition: strict-comparison vectors have a countable cover by closed convex
  upper sets avoiding zero above the weak-comparison cone. It is neither a
  countably additive measure theorem nor an attribution of Scott's unpublished
  infinite theorem. The infinite construction uses universal probability
  evaluation vectors, with a proved faithful Stone representation and
  probability-state correspondence. The upstream proofs were produced primarily
  by AI agents under Lars Warren Ericson's direction and review.
