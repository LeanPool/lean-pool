slug: iwaniec-beurling-ahlfors
title: Iwaniec's conjecture on the Beurling–Ahlfors norm
summary: Proves quasiconvexity of the Agazzi et al. integrand on real 2-by-2
  matrices and the resulting sharp norm of the Beurling–Ahlfors transform.
  The proof develops scalar projection under a gradient constraint and relates
  the sharp planar estimate to periodic test functions and higher integrability.
