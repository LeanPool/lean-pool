main_results:
- declaration: Agazzi.theorem1
  informal: The Agazzi et al. integrand is quasiconvex under smooth periodic
    perturbations of real 2-by-2 matrices.
- declaration: Agazzi.corollary2_norm
  informal: For every real p > 1, the Beurling–Ahlfors Fourier multiplier has
    sharp Lp norm equal to max(p, p / (p − 1)) − 1.
- declaration: Agazzi.theorem1_hessian_iff
  informal: The Hessian inequality for smooth periodic scalar test functions
    is equivalent to the formulation for compactly supported smooth scalar
    test functions on the plane.
