main_results:
- declaration: GraphMinor.graph_minor_theorem
  informal: >-
    In any infinite sequence of multigraphs with finite vertex and edge sets,
    there are indices i < j such that graph i is isomorphic to a subgraph
    of graph j after contracting a subset of that subgraph's edges.
