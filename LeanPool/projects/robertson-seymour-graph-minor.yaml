slug: robertson-seymour-graph-minor
title: The Robertson–Seymour graph minor theorem
summary: >-
  In every infinite sequence of finite multigraphs, an earlier graph is
  isomorphic to a minor of a later one. The proof uses Mathlib multigraphs
  and develops supporting theory for graph drawings on surfaces, tangles
  and well-quasi-ordering.
