main_results:
- declaration: MiLAC.PhaseShifters.implementable_iff_permutedPhaseDiagonal
  informal: A finite phase-only network is implementable exactly when its matrix is
    a permutation matrix times a diagonal matrix of complex phases.
  source_ref: Upstream PhaseShifters.lean.
- declaration: MiLAC.HybridCouplersPhaseShifters.implementable_iff_layered
  informal: A finite network is implementable with hybrid couplers and phase shifters
    exactly when its matrix is an initial permutation preceded by finitely many permutation
    and phase-parametrized block-diagonal layers.
  source_ref: Theorem 1 and Section IV of arXiv:2610.04774.
- declaration: MiLAC.HybridCouplersPhaseShifters.implementable_dft
  informal: For every natural L, the normalized DFT matrix of size 2^L can be implemented
    by hybrid couplers, phase shifters, and permutation networks.
  source_ref: Section V of arXiv:2610.04774.
