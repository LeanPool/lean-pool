slug: microwave-networks
title: Microwave network synthesis and power-of-two DFT implementation
summary: Characterizes the complex transmission matrices synthesized from phase shifters
  and permutations, with or without hybrid couplers, using series and parallel composition.
  Phase-only networks are permuted phase-diagonal matrices; networks with hybrid couplers
  are products of permutation and phase-parametrized block-diagonal layers. Proves
  that the normalized DFT of every power-of-two size is implementable, with reusable
  finite-type reindexing, independent row and column permutations, and block-diagonal
  composition infrastructure. Uses the reciprocal matched network matrix model of
  the source paper; no general scattering-physics theorem is claimed.
