slug: ec-runtime-coupon-collector
title: Sharp coupon collection and randomized local search
summary: >-
  Proves the sharp additive minus-one-half correction for the mean time to
  collect uniformly sampled coupons from an independent uniform initial set,
  and for one-bit randomized local search on strictly coordinate-monotone
  Boolean fitness functions. The centering uses the average of the floor and
  ceiling half-dimension harmonic numbers, so the limit covers both parities.
  Develops finite Markov transitions, first-hitting-time expectations, geometric
  tail bounds, and the exact finite-dimensional mean formulas used in the proof.
branch: probability and randomized algorithms
