main_results:
  - declaration: ECRuntime.proposed_randomStakeCoupon_allDimensionPaperSharpCentered
    informal: >-
      For n coupon types, with each coupon independently present initially with
      probability one half, the expected remaining number of independent uniform
      coupon draws minus n times the average of H_floor(n/2) and H_ceil(n/2)
      converges to minus one half as n tends to infinity.
    source_ref: Doerr and Doerr, Collecting Coupons with Random Initial Stake, Theorem 1.
  - declaration: ECRuntime.proposed_strictMonotoneRLS_allDimensionPaperSharpCentered
    informal: >-
      For any family of strictly coordinate-monotone real-valued Boolean fitness
      functions, the uniform-start mean number of one-bit elitist RLS mutation
      iterations to reach the all-one string, excluding the initial evaluation,
      has the same all-dimension additive minus-one-half correction.
    source_ref: Doerr and Doerr, Collecting Coupons with Random Initial Stake, Theorem 3 (RLS corollary).
