slug: grothendieck-universes
title: Grothendieck universes
summary: Grothendieck universes in Mathlib's model ZFSet of ZFC, with their closure properties
  (subsets, pairs, ordered pairs, unions, ranges, products, function sets, and the bound
  card x < card U for x ∈ U). Every universe U is the von Neumann stage V_(rank U), by
  ∈-induction; its cardinal is a regular strong limit, so U = V_(card U).ord. Conversely
  V_ω and V_κ for κ inaccessible are universes, giving Williams's classification of the
  universes as V_ω and the V_κ with κ inaccessible. The cardinal of a universe is
  inaccessible exactly when the universe contains ω, and Kruse's criterion x ∈ U ⇔ x ⊆ U ∧
  card x < card U holds. Universes are totally ordered by membership, V_ω is the least one,
  the intersection of a nonempty set of universes is its least element, a set lying in some
  universe lies in a least one, and every set lies in a universe exactly when every cardinal
  lies below an inaccessible cardinal.
