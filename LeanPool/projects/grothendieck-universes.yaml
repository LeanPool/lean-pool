main_results:
- declaration: LeanPool.GrothendieckUniverses.isGrothendieckUniverse_vonNeumann
  informal: For every inaccessible cardinal κ, the von Neumann stage V_κ is a Grothendieck
    universe.
- declaration: LeanPool.GrothendieckUniverses.isGrothendieckUniverse_vonNeumann_omega0
  informal: The set V_ω of hereditarily finite sets is a Grothendieck universe.
- declaration: LeanPool.GrothendieckUniverses.isGrothendieckUniverse_iff
  informal: A set is a Grothendieck universe exactly when it is V_ω or V_κ for an
    inaccessible cardinal κ (Williams's theorem).
- declaration: LeanPool.GrothendieckUniverses.isGrothendieckUniverse_iff_exists_isRegular
  informal: A set is a Grothendieck universe exactly when it is V_κ for a regular strong limit
    cardinal κ.
- declaration: LeanPool.GrothendieckUniverses.IsGrothendieckUniverse.eq_vonNeumann_rank
  informal: Every Grothendieck universe U equals the von Neumann stage V_(rank U).
- declaration: LeanPool.GrothendieckUniverses.IsGrothendieckUniverse.isInaccessible_card
  informal: The cardinality of a Grothendieck universe is inaccessible exactly when the
    universe contains ω.
- declaration: LeanPool.GrothendieckUniverses.IsGrothendieckUniverse.eq_vonNeumann_card
  informal: Every Grothendieck universe U equals V_κ for κ the cardinality of U.
- declaration: LeanPool.GrothendieckUniverses.IsGrothendieckUniverse.mem_iff_subset_and_card_lt
  informal: A set lies in a Grothendieck universe U exactly when it is a subset of U of
    cardinality smaller than that of U (Kruse's criterion).
- declaration: LeanPool.GrothendieckUniverses.IsGrothendieckUniverse.card_lt_card
  informal: Every element of a Grothendieck universe has strictly smaller cardinality than the
    universe.
- declaration: LeanPool.GrothendieckUniverses.IsGrothendieckUniverse.omega_mem_iff_exists_aleph0_le_card
  informal: A Grothendieck universe contains ω exactly when it has an infinite element.
- declaration: LeanPool.GrothendieckUniverses.IsGrothendieckUniverse.mem_or_eq_or_mem
  informal: Of two Grothendieck universes, one is an element of the other or they are equal.
- declaration: LeanPool.GrothendieckUniverses.IsGrothendieckUniverse.vonNeumann_omega0_subset
  informal: V_ω is contained in every Grothendieck universe.
- declaration: LeanPool.GrothendieckUniverses.isGrothendieckUniverse_sInter
  informal: The intersection of a nonempty set of Grothendieck universes is a Grothendieck
    universe.
- declaration: LeanPool.GrothendieckUniverses.exists_least_isGrothendieckUniverse
  informal: A set lying in some Grothendieck universe lies in a least one.
- declaration: LeanPool.GrothendieckUniverses.forall_exists_isGrothendieckUniverse_iff
  informal: Every set lies in a Grothendieck universe exactly when every cardinal lies below
    an inaccessible cardinal.
