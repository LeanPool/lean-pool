main_results:
- declaration: MacMahon.minimum_size
  informal: Twelve is the attained minimum size of a universal physical inventory.
- declaration: MacMahon.physical_minimum
  informal: Every universal physical inventory has at least twelve cubes.
- declaration: MacMahon.physical_exactly_ten
  informal: Exactly ten labelled universal physical inventories have size twelve.
- declaration: MacMahon.physical_iff_two_triangles
  informal: >-
    An inventory of twelve cubes is physically universal exactly when its Conway
    tableau is the two disjoint triangles of a partition of the six labels into
    two triples, with one copy of each directed edge.
- declaration: MacMahon.physical_minimum_has_no_repeats
  informal: Every variety has multiplicity at most one in a minimum universal inventory.
- declaration: MacMahon.proper_rotation_iff
  informal: The rotation table contains precisely all proper signed-axis rotations.
- declaration: MacMahon.exposed_face_rule
  informal: The outward faces at each of the eight positions obey the coordinate sign rule.
- declaration: MacMahon.face_colours_valid
  informal: Every off-diagonal tableau entry assigns the six distinct nonzero colours.
- declaration: MacMahon.face_assignment_coverage
  informal: Every assignment of six distinct nonzero colours is a rotated tableau variety.
- declaration: MacMahon.face_assignment_unique
  informal: The variety and proper rotation representing a face assignment are unique.
