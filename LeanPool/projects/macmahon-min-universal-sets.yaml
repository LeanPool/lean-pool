slug: macmahon-min-universal-sets
title: The ten minimum universal collections of MacMahon cubes
summary: >-
  Classifies all minimum universal inventories of six-coloured MacMahon cubes.
  A universal inventory can build a two-by-two-by-two model of every cube variety,
  with matching exterior faces and eight distinct physical copies. The minimum
  inventory size is twelve, exactly ten labelled inventories attain it, and they
  are precisely the two-triangle collections in Conway's tableau. Natural-number
  multiplicities are allowed; every minimum inventory has no repeated variety.
  The tableau has zero diagonal; its thirty off-diagonal entries are the varieties.
  The development also verifies all proper signed-axis rotations, the thirty
  varieties, all six-colour face assignments, and the equivalence of corner
  matching with physical face matching. This resolves Johnson and Roldán's
  Conjectures 4 and 8 (arXiv:2407.13208v1), with a stronger multiset conclusion.
