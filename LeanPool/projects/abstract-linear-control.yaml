slug: abstract-linear-control
title: Continuity and zero-class properties of abstract linear control systems
summary: Proves that every abstract linear control system with bounded L-infinity
  inputs between real or complex Banach spaces is zero-class, and hence has continuous
  input-response trajectories. No integral representation or reflexivity assumption
  is required. Includes finite-p continuity, a finite-p system with constant response
  norm, and a scalar zero-class system without integral representation or Orlicz-heart
  admissibility. Reusable infrastructure includes Phillips' lemma, strongly continuous
  semigroup bounds, half-line Lp concatenation and shifts, invariant Hahn-Banach
  extensions, and periodic invariant means.
