main_results:
- declaration: AbstractLinearControl.ALCS.zero_class
  informal: For every abstract linear control system with L-infinity inputs between
    real or complex Banach spaces, the norms of its input-response operators tend
    to zero as time tends to zero from the right.
  source_ref: Theorem 1.5 of version 2, completed in Lean on 2026-10-03.
- declaration: AbstractLinearControl.ALCS.continuousOn_Phi
  informal: For every bounded input of such a system, its input-response trajectory
    is continuous on the nonnegative half-line.
  source_ref: Corollary 1.6.
- declaration: AbstractLinearControl.ALCS.continuousOn_Phi_of_ne_top
  informal: For every abstract linear control system with finite exponent p at
    least one and complete state space, each Lp input has a continuous input-response
    trajectory on the nonnegative half-line.
  source_ref: Proposition 1.3.
- declaration: AbstractLinearControl.exists_system_norm_Phi_eq_one
  informal: For every finite exponent p at least one, there exist real Banach input
    and state spaces and an abstract linear control system whose input-response
    operator has norm one at every positive time.
  source_ref: Proposition 3.1.
- declaration: AbstractLinearControl.ExoticMean.Counterexample.no_representation
  informal: There exists a scalar abstract linear control system with identity
    semigroup and response norm equal to time, which has no integral representation
    and is not admissible for any of the formalized Young-function Orlicz hearts.
  source_ref: Proposition 3.3; formal Young functions include the paper's class.
- declaration: AbstractLinearControl.Phillips.full
  informal: For a pointwise null sequence of bounded linear functionals on real or
    complex bounded sequences, each sequence of atomic coefficients is absolutely
    summable, its sum of norms tends to zero, and its diagonal coefficient tends
    to zero.
  source_ref: Lemma 2.2.
