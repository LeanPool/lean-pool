slug: finite-ramsey
title: Finite-colour Ramsey theory
summary: Finite-colour graph Ramsey theory on Mathlib edge labelings, with a common arrow relation
  and least-host numbers. Proves finite graph and infinite uniform existence, binomial upper and counting
  lower bounds, and transitive tournament bounds. Derives Schur triples as an application. Supplies
  colour-class induced-copy, ordered and hypergraph interfaces; the colour-class and hypergraph specifications
  retain explicit existence hypotheses.
