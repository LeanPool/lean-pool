slug: hubbard-spectral-moments
title: Spectral moments of the projected Hubbard configuration graph
summary: Constructs finite fermion creation and annihilation matrices and the
  projected Hubbard hopping operator. Proves the weighted second-moment
  formula for Hermitian hopping, the vanishing of the Schrieffer–Wolff cross
  term on triangle-free graphs, the doubled Peierls phase of the second-order
  pair hop, and the classification of permutations induced by four closed
  hard-core hops. Includes finite-population moment identities and torus
  calculations used in the paper.
