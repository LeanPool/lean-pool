main_results:
- declaration: HubbardMoments.secondMomentHubbardWeighted
  informal: In a nonempty no-double-occupancy spin sector with n particles
    on N sites, N at least two, the projected hopping matrix for Hermitian
    bond amplitudes has normalized second moment n(N-n)/(N(N-1)) times the
    sum of squared moduli of the off-diagonal hopping amplitudes.
- declaration: HubbardMoments.schriefferWolffHubbard
  informal: For the Hubbard hopping operator on a triangle-free graph, the
    cross term between projected hopping and the virtual operator vanishes
    when the projected states have no double occupation and the intermediate
    states each contain a doubly occupied site.
- declaration: HubbardMoments.doubledPeierlsPhase
  informal: Evaluating the second-order two-particle effective matrix element
    for a pair hopping to an adjacent site gives 2t²/U with twice the
    single-hop phase.
- declaration: HubbardMoments.fourHopPermutations
  informal: A closed walk of four single-particle hops with exclusion can
    induce only the identity, a transposition or a three-cycle.
