slug: iwaniec-linear-sieve
title: Iwaniec's linear sieve and Jacobsthal's bound
summary: >-
  Proves an absolute O((r log r)^2) bound for any run of consecutive integers
  covered by r distinct primes, using the Rosser-Iwaniec linear sieve at the
  sifting limit. Preserves the combinatorial sieve, delay-equation majorants,
  prime-sum estimates and the proved strong prime-number-theorem dependency.
  This imports the dependency closure of the Jacobsthal corollary, rather than
  claiming the upstream formalizations of both papers in full.
