main_results:
- declaration: IwaniecLinearSieve.iwaniecBound
  informal: >-
    There is an absolute real constant C such that, for every finite set S of
    at least two primes and every interval of m consecutive integers each
    divisible by a prime in S, m is at most C times (|S| log |S|)^2.
- declaration: IwaniecLinearSieve.shiftedSieve
  informal: >-
    Rosser's lower-bound sieve for the first r primes transfers to any set of
    r primes, bounding the number of integers avoiding all those primes.
- declaration: IwaniecLinearSieve.linearSieveEstimate
  informal: >-
    At a fixed constant times z squared, Rosser's lower-bound sieve has main
    term bounded below by a positive constant times R(z)/log z and support
    bounded above by a constant times z squared divided by log squared z,
    for all sufficiently large z.
