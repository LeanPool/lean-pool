main_results:
- declaration: MathFin.Market.noArbitrage_iff_exists_isPricingMeasure_of_finite
  informal: >-
    On a finite sample space with a finite reference measure that charges every
    state, absence of arbitrage for one asset on a finite trading grid is
    equivalent to the existence of a pricing measure for the sampled
    deflated prices.
- declaration: MathFin.Contracts.Binomial.price_pay_eq_binomialPrice_of_isPricingMeasure
  informal: >-
    In the binomial model with positive initial spot, a positive time step,
    the no-arbitrage parameters and maturity on the trading grid, every
    pricing measure gives the binomial price to a payoff depending only
    on the terminal asset value.
- declaration: MathFin.exists_market_of_isNormalizedCallPrice
  informal: >-
    Each normalized call price function is realized in a one-period market
    with unit numeraire, a nonnegative asset of forward one, and a pricing
    measure that reproduces the call price at each positive strike.
- declaration: MathFin.Rates.price_pay_vasicekMarket
  informal: >-
    In the Vasicek market with measurable Brownian coordinates and a positive
    mean-reversion coefficient, the value of a terminal unit payment under
    the reference probability measure agrees with the affine bond formula.
- declaration: MathFin.coherentRisk_isLUB
  informal: >-
    On a finite state space, a coherent risk measure equals the least upper
    bound of expected loss over the probability vectors that assign
    nonpositive expectation to every acceptable position.
