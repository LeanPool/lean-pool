slug: formal-mathfin
title: Pricing measures, market models and coherent risk
summary: >-
  A common market and contract framework for finite-state asset pricing,
  binomial pricing, fixed-maturity call price realization, and coherent risk.
  The library develops filtered probability and martingale tools, a contract
  language with measurable payoffs, and pricing and risk results for several
  model families.
