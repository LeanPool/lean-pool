slug: dehn-invariant
title: The Dehn invariant and Hilbert's third problem
summary: In real three-space, the set-defined Dehn invariant of a convex
  polytope is additive over finite convex dissections with pairwise
  disjoint interiors. For scissors-congruent polyhedral sets, the sums
  over such dissections agree. The development constructs tetrahedra
  with a common base, equal altitudes, and equal volumes that fail both
  scissors congruence and equicomplementability.
