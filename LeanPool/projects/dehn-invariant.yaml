main_results:
- declaration: DehnCanon.Library.dehnSet_eq_edge_sum
  informal: For a convex polytope with nonempty interior in a real
    three-dimensional inner product space, the set-defined invariant equals
    the edge-length tensor dihedral-angle sum.
- declaration: DehnCanon.Library.dehnSet_eq_of_scissorsCongruent
  informal: Scissors-congruent convex polytopes in real three-space have
    the same set-defined Dehn invariant.
- declaration: DehnCanon.Library.dehnSum_eq_of_scissors
  informal: For two scissors-congruent polyhedral sets in real three-space,
    the sums of Dehn invariants over finite convex dissections agree when
    the pieces within each dissection have pairwise disjoint interiors.
- declaration: DehnCanon.Library.similarTetra_not_scissorsCongruent_similarCube
  informal: A positive scaling and affine-isometric image of the regular
    tetrahedron cannot be scissors congruent to any such image of the unit cube.
- declaration: DehnCanon.Library.hilbert_third_problem
  informal: There exist two tetrahedra with a common base, each with altitude
    one and volume one sixth, that fail both scissors congruence and
    equicomplementability.
