slug: dehn-invariant
title: The Dehn invariant and Hilbert's third problem
summary: The Dehn invariant of a solid is defined from its local cones and
  Hausdorff lengths. It agrees with the classical edge sum on full-dimensional
  convex polytopes and is preserved by dissections. This distinguishes a
  regular tetrahedron from a cube and gives Hilbert's counterexample with
  equal bases and altitudes.
