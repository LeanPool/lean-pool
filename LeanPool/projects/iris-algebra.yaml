main_results:
- declaration: Iris.fixpoint_unfold
  informal: Every contractive endomorphism of an inhabited complete ordered family of equivalences
    has a constructed fixed point satisfying its unfolding equation.
- declaration: Iris.fixpoint_unique
  informal: Any fixed point of a contractive endomorphism of an inhabited complete ordered family
    of equivalences equals the constructed fixed point.
- declaration: Iris.COFE.OFunctor.Fix.fold_unfold
  informal: For a contractive mixed-variance functor preserving complete step-indexed spaces,
    with an inhabited value at the lifted unit space, folding after unfolding is the identity
    on its constructed recursive domain.
- declaration: Iris.COFE.OFunctor.Fix.unfold_fold
  informal: Under the same functor, completeness, and inhabitation hypotheses, unfolding after
    folding is the identity on the functor applied to the recursive domain.
- declaration: Iris.IProp.fold_unfold
  informal: For every family of contractive affine resource functors, folding after unfolding
    is the identity on the associated monotone proposition model.
- declaration: Iris.IProp.unfold_fold
  informal: For every such family of resource functors, unfolding after folding is the identity
    on the associated guarded recursive pre-proposition domain.
