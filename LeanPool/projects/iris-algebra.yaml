slug: iris-algebra
title: Ordered resource algebras and the Iris recursive domain model
summary: Constructs the algebraic core of the Iris proposition model from complete step-indexed
  spaces, ordered resource algebras, finite-support ghost maps, and monotone predicates. Proves
  guarded fixed-point unfolding and uniqueness, solves contractive mixed-variance domain equations,
  and constructs mutually inverse folding and unfolding maps for the recursive proposition model.
  Includes the October 2026 ordered-resource generalization and reusable morphism, product, optional-resource,
  and frame-preserving update infrastructure. The import is the mathematical dependency closure
  of IProp; it does not include the proof mode, HeapLang, program logics, or claims about their
  soundness.
