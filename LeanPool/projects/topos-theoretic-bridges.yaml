slug: topos-theoretic-bridges
title: Topos-theoretic bridges for presheaf topoi
summary: Morita equivalence of small categories, defined as equivalence of their presheaf
  topoi, is characterised by equivalence of Karoubi envelopes, through the retracts of
  representable presheaves. The presheaf topos of a small category is Boolean exactly when
  the category is a groupoid, and De Morgan exactly when it satisfies the right Ore condition;
  both properties are invariant under Morita equivalence. An equivalence of the sheaf topoi
  of two small sites gives an order isomorphism between the Grothendieck topologies finer than
  the two given ones, matching their sheaf conditions. The subtopoi of a sheaf topos
  correspond to the finer topologies, and the essential points of a presheaf topos form a
  category equivalent to the opposite of the Karoubi envelope. For geometric theories, the
  categorical semantics in sheaf topoi is developed; every geometric theory has a classifying
  site, unique up to equivalence of topoi, on which every subobject of a power of the generic
  model is definable; the quotients of a theory correspond to the topologies finer than its
  classifying one, and the quotients of Morita-equivalent theories correspond. Geometric
  formulas translate into the infinitary logic of Tau Ceti with the same satisfaction, and the
  existence half of Diaconescu's theorem is proved, extending every internally flat continuous
  functor from a site to a sheaf topos to the inverse image of a geometric morphism; as an
  application, G-sets classify G-torsors, whose theories are Morita equivalent exactly for
  isomorphic groups. These are
  instances of O. Caramello's topos-theoretic bridges, an invariant of a topos read on two of its
  presentations.
