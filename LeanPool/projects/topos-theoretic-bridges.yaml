main_results:
- declaration: LeanPool.ToposTheoreticBridges.moritaEquivalentCat_iff_karoubi
  informal: Two small categories have equivalent categories of presheaves of sets exactly
    when their Karoubi envelopes (idempotent completions) are equivalent.
- declaration: LeanPool.ToposTheoreticBridges.isBooleanTopos_presheaf_iff_isGroupoid
  informal: Every subpresheaf of every presheaf on a small category C has a complement
    exactly when every morphism of C is invertible.
- declaration: LeanPool.ToposTheoreticBridges.isDeMorganTopos_presheaf_iff_rightOreCondition
  informal: In the presheaf topos of a small category C, every subobject's pseudocomplement
    and its double pseudocomplement together cover the whole object exactly when every cospan
    in C can be completed to a commutative square.
- declaration: LeanPool.ToposTheoreticBridges.isGroupoid_iff_of_moritaEquivalentCat
  informal: Being a groupoid is invariant under Morita equivalence of small categories.
- declaration: LeanPool.ToposTheoreticBridges.rightOreCondition_iff_of_moritaEquivalentCat
  informal: The right Ore condition is invariant under Morita equivalence of small categories.
- declaration: LeanPool.ToposTheoreticBridges.exists_orderIso_ici_of_sheafEquiv
  informal: An equivalence between the categories of sheaves of sets on two small sites (C, J)
    and (D, K) gives an order isomorphism between the Grothendieck topologies on C finer than J
    and those on D finer than K, under which a J-sheaf is a sheaf for a finer topology J'
    exactly when its image is a sheaf for the corresponding topology on D.
