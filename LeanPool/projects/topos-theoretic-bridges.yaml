main_results:
- declaration: LeanPool.ToposTheoreticBridges.moritaEquivalentCat_iff_karoubi
  informal: Two small categories have equivalent categories of presheaves of sets exactly
    when their Karoubi envelopes (idempotent completions) are equivalent.
- declaration: LeanPool.ToposTheoreticBridges.isBooleanTopos_presheaf_iff_isGroupoid
  informal: Every subpresheaf of every presheaf on a small category C has a complement
    exactly when every morphism of C is invertible.
- declaration: LeanPool.ToposTheoreticBridges.isDeMorganTopos_presheaf_iff_rightOreCondition
  informal: In the presheaf topos of a small category C, every subobject's pseudocomplement
    and its double pseudocomplement together cover the whole object exactly when every cospan
    in C can be completed to a commutative square.
- declaration: LeanPool.ToposTheoreticBridges.isGroupoid_iff_of_moritaEquivalentCat
  informal: Being a groupoid is invariant under Morita equivalence of small categories.
- declaration: LeanPool.ToposTheoreticBridges.rightOreCondition_iff_of_moritaEquivalentCat
  informal: The right Ore condition is invariant under Morita equivalence of small categories.
- declaration: LeanPool.ToposTheoreticBridges.exists_orderIso_ici_of_sheafEquiv
  informal: An equivalence between the categories of sheaves of sets on two small sites (C, J)
    and (D, K) gives an order isomorphism between the Grothendieck topologies on C finer than J
    and those on D finer than K, under which a J-sheaf is a sheaf for a finer topology J'
    exactly when its image is a sheaf for the corresponding topology on D.
- declaration: LeanPool.ToposTheoreticBridges.subtoposOrderIso
  informal: For a Grothendieck topology J on a small category, the subtopoi of the category of
    J-sheaves of sets (reflective full subcategories with left exact reflector) correspond, by
    an order-reversing bijection, to the Grothendieck topologies finer than J.
- declaration: LeanPool.ToposTheoreticBridges.essentialPointEquivKaroubiOp
  informal: The essential points of the presheaf topos of a small category C (finite-limit
    preserving functors to sets with both a left and a right adjoint) form a category equivalent
    to the opposite of the Karoubi envelope of C.
- declaration: LeanPool.ClassifyingTopoi.CatStructure.IsModel.map
  informal: The inverse image of a geometric morphism between sheaf topoi of small sites sends
    models of a geometric theory to models.
- declaration: LeanPool.ClassifyingTopoi.IsClassifyingSite.exists_equivalence
  informal: Two classifying sites of the same geometric theory have equivalent topoi of
    sheaves.
- declaration: LeanPool.ClassifyingTopoi.IsClassifyingSite.exists_quotient_topology
  informal: If (C, J) with generic model U classifies a geometric theory T, every theory
    containing T is classified by a Grothendieck topology on C finer than J, with the
    sheafified generic model.
- declaration: LeanPool.ClassifyingTopoi.IsClassifyingSite.exists_orderEmbedding_quotients_ici
  informal: The quotients of a theory with a classifying site (C, J) embed, as an order, into
    the Grothendieck topologies on C finer than J.
- declaration: LeanPool.ClassifyingTopoi.exists_isClassifyingSite
  informal: Every geometric theory has a classifying site, a small site with a model of the
    theory in its sheaf topos through which every model in every sheaf topos factors uniquely
    up to isomorphism by the inverse image of a geometric morphism.
- declaration: LeanPool.ClassifyingTopoi.IsClassifyingSite.exists_interp_eq_of_subobject
  informal: On a classifying site, every subobject of a power of the generic model is the
    interpretation of a geometric formula.
- declaration: LeanPool.ClassifyingTopoi.IsClassifyingSite.exists_quotient_theory
  informal: If (C, J) classifies a geometric theory T, every Grothendieck topology on C finer
    than J classifies some theory containing T, with the sheafified generic model.
- declaration: LeanPool.ClassifyingTopoi.MoritaEquivalent.exists_orderIso_quotients
  informal: The posets of quotients of two Morita-equivalent geometric theories are order
    isomorphic, corresponding quotients being Morita equivalent.
- declaration: LeanPool.ClassifyingTopoi.isOfPresheafType_of_isHorn
  informal: Every Horn theory is of presheaf type, its classifying topos being the category of
    presheaves on its Horn category.
- declaration: LeanPool.ClassifyingTopoi.isClassifyingSite_genericObject
  informal: The functors from finite sets to sets classify the theory of objects, the inclusion
    of finite sets into sets being the generic object.
- declaration: LeanPool.ClassifyingTopoi.GeometricTheory.Provable.sound
  informal: Geometric sequents provable from a theory hold in every model of the theory in every
    sheaf topos of a small site.
- declaration: LeanPool.ClassifyingTopoi.GeometricFormula.realize_toInf
  informal: The translation of a geometric formula into Tau Ceti's infinitary first-order logic,
    with no free variables and the context as bound variables, holds in a structure at an
    assignment of the context exactly when the geometric formula does.
- declaration: LeanPool.ClassifyingTopoi.GeometricTheory.isSetModel_iff_toInf
  informal: A structure on a type is a model of a geometric theory exactly when it satisfies,
    for every axiom phi |- psi of the theory, the infinitary sentence saying that every
    assignment satisfying phi satisfies psi.
- declaration: LeanPool.ClassifyingTopoi.exists_leftAdjoint_of_flat
  informal: Let (C, J) be a small site and D a small category. If F is a functor from C to
    presheaves of sets on D such that, for every object d of D, the functor F(-)(d) has a
    cofiltered category of elements and sends every J-covering sieve to a jointly surjective
    family, then there is a finite-limit preserving left adjoint G from J-sheaves of sets on C
    to presheaves of sets on D whose composite with the sheafified Yoneda embedding of C is
    isomorphic to F.
- declaration: LeanPool.ClassifyingTopoi.exists_leftAdjoint_of_preservesFiniteLimits
  informal: Let (C, J) and (D, K) be small sites, C having finite limits. A finite-limit
    preserving functor F from C to K-sheaves of sets on D which sends every J-covering sieve
    to an epimorphic family extends to a finite-limit preserving left adjoint G from J-sheaves
    of sets on C to K-sheaves of sets on D, whose composite with the sheafified Yoneda
    embedding of C is isomorphic to F.
- declaration: LeanPool.ClassifyingTopoi.exists_leftAdjoint_of_isLocallyFiltering
  informal: Let (C, J) and (D, K) be small sites and F a functor from C to K-sheaves of sets
    on D. Suppose that, viewed as presheaves, the categories of elements of F are cofiltered
    locally for K (for every object d of D, after restriction to some K-covering sieve of d
    there is an element, any two elements come from one along a span, and any element
    equalized by two parallel morphisms comes from one along an equalizing morphism), and that
    F sends every J-covering sieve to an epimorphic family. Then there is a finite-limit
    preserving left adjoint G from J-sheaves of sets on C to K-sheaves of sets on D whose
    composite with the sheafified Yoneda embedding of C is isomorphic to F.
- declaration: LeanPool.ClassifyingTopoi.isClassifyingSite_genericTorsor
  informal: For a group G, the category of presheaves of sets on the one-object category of G
    (right G-sets), with the representable presheaf on which G acts on the left, classifies
    the geometric theory of G-torsors (a left action that is inhabited, transitive and free).
- declaration: LeanPool.ClassifyingTopoi.moritaEquivalent_torsorTheory_iff
  informal: The geometric theories of G-torsors and of H-torsors are Morita equivalent exactly
    when the groups G and H are isomorphic.
