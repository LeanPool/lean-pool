slug: stability-of-matter
title: Stability of matter and the kinetic Lieb–Thirring inequality
summary: Formalizes stability of non-relativistic fermionic Coulomb matter in three dimensions,
  the kinetic Lieb–Thirring inequality with Rumin's explicit coefficient, Baxter's electrostatic
  inequality with its positive nuclear correction, and real quadratic-form stability with Coulomb
  finiteness. Preserves the Fourier, Pauli-occupation, Hardy and Voronoi infrastructure in the
  184-module dependency closure of these results. The separate ionization, thermodynamic-limit
  and Thomas–Fermi developments are outside the imported scope.
