main_results:
- declaration: LiebThirring.stability_of_matter
  informal: For each positive spin multiplicity and nonnegative maximum nuclear charge, one
    positive constant bounds electron–nucleus attraction by kinetic energy, electron and nuclear
    repulsion, and the total particle count, uniformly over normalized antisymmetric L² states,
    charges and nuclear positions, in nonnegative extended-energy form.
- declaration: LiebThirring.stability_of_matter_real
  informal: With distinct nuclear positions and finite kinetic energy, Coulomb expectations
    and nuclear repulsion are finite and the real quadratic energy is bounded below by a negative
    constant times the total particle count, with the constant depending only on spin and maximum
    charge.
- declaration: LiebThirring.kinetic_lieb_thirring
  informal: Every normalized antisymmetric L² state with positive spin multiplicity q has kinetic
    energy at least Rumin's coefficient times q to the power minus two thirds times the integral
    of the density to the power five thirds, including states of infinite kinetic energy.
- declaration: LiebThirring.baxter
  informal: For equal nonnegative nuclear charges, attraction plus the positive nearest-other-nucleus
    correction is bounded by electron and nuclear repulsion plus nearest-nucleus control, including
    collisions and empty configurations in nonnegative extended arithmetic.
- declaration: LiebThirring.kineticEnergy_schwartz
  informal: The Fourier kinetic energy of a spin-valued Schwartz state equals the sum of the
    squared classical spatial derivative integrals, with the physical minus-Laplacian normalization.
