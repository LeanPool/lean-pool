slug: sophie-germain-archives
title: Statements read in Sophie Germain's manuscripts
summary: Lean proofs of the mathematical statements made on the leaves of three volumes of Sophie
  Germain's papers at the Bibliothèque nationale de France, digitised in Gallica (Français 9115,
  Français 9118, NAF 4073), as read in the modernised readings of the edition germain-project. In
  number theory, Manuscript C on 2z^{2n} = x^{2n} + y^{2n} (the statement as written fails at
  x = y = z = 1, coprime solutions are odd, a common divisor of x² + y² and Φ divides n, with
  n = 5, x = 1, y = 3 as a case where 5 divides both), the working notes on quadratic residues
  (every non-square integer is a non-residue of some prime, the false extension refuted by −5,
  −17, −21, 3 a primitive root of primes 12n + 5 with 3n + 1 prime, every non-residue of a Fermat
  prime a primitive root), the drafts to Gauss (Germain's generalisation of art. 357 deduced
  from it, the passage x ↦ −x, the first case of Fermat's equation for exponent p − 1), the
  primality of p⁴ + 4 only for p = 1 (by the Sophie Germain identity, which Mathlib has), the
  reduced forms of determinant −295, and the note of NAF 4073 that the triangular number of a square is the sum of
  the squares of two consecutive triangular numbers, with its generalisations (T(mn), sums of
  odd powers as polynomials in T_n, and Lagrange's S_3 = T_n² as the only formula S_p = T_n^q,
  through Levi ben Gershon's 2^p + 1 = 3^q). In mechanics and geometry, Euler's 1779 memoir on
  the vibrating lamina and Germain's « Remarques » on it (the six end conditions and their
  determinants, the first root of cos ω cosh ω = 1, the lamina on three supports, the second
  family of § 51 shown to be a genuine mode against the « Remarques », the free lamina touched
  by a stylet), the plate equation of the memoir for the Institut, and Euler's theorem on normal
  sections, the mean curvature as the mean over all directions and the sum of inverse radii on
  the sphere. Also the Sophie Germain chapter of the edition's exercise book.
