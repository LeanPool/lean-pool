slug: cutoff-fast-diffusion
title: Cutoff for fast diffusion and porous medium equations
summary: >-
  Proves high-dimensional cutoff in quadratic Wasserstein distance, relative
  entropy and Fisher information for the explicit Barenblatt flow started
  from a point, using exact radial beta integrals, moments and transport
  formulas. The development also describes heavy tails and the Gaussian
  diffusion limit.
