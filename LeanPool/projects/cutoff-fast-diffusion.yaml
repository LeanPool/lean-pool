main_results:
- declaration: Cutfast.cutoff_wassersteinSq
  informal: >-
    Fix α > 0 with α ≠ 1/2 and r > 0, and set m = ((d − 2)α + 1)/(dα).
    The supremum of squared Wasserstein distance over initial points in the
    closed ball of radius r√d tends to infinity at (1 − ε)t* for fixed
    0 < ε < 1 and to zero at (1 + ε)t* for fixed ε > 0, with
    t* = max(1, α) log d / 2.
- declaration: Cutfast.cutoff_relEntropy
  informal: >-
    Fix α > 0 with α ≠ 1/2 and r > 0, and set m = ((d − 2)α + 1)/(dα).
    The supremum of relative entropy over the closed ball of initial points
    of radius r√d tends to infinity at (1 − ε)t* for fixed 0 < ε < 1 and to
    zero at (1 + ε)t* for fixed ε > 0, with t* = max(1, α) log d / 2.
    In sufficiently large dimension its defining integrand is integrable
    for every positive time and every initial point in this ball.
- declaration: Cutfast.cutoff_fisherInfo
  informal: >-
    Fix α > 0 with α ≠ 1/2 and r > 0, and set m = ((d − 2)α + 1)/(dα).
    The supremum of relative Fisher information over the closed ball of
    initial points of radius r√d tends to infinity at (1 − ε)t* for fixed
    0 < ε < 1 and to zero at (1 + ε)t* for fixed ε > 0, with
    t* = max(1, α) log d / 2.
- declaration: Cutfast.cutoff_fixedExponent_wassersteinSq
  informal: >-
    For fixed porous medium exponent m > 1 and r > 0, the supremum of
    squared Wasserstein distance over initial points in the closed ball of radius
    r√d tends to infinity at (1 − ε)t* for fixed 0 < ε < 1 and to zero at
    (1 + ε)t* for fixed ε > 0, with t* = log d / 2.
- declaration: Cutfast.cutoff_fixedExponent_relEntropy
  informal: >-
    For fixed porous medium exponent m > 1 and r > 0, the supremum of
    relative entropy over the closed ball of initial points of radius r√d tends
    to infinity at (1 − ε)t* for fixed 0 < ε < 1 and to zero at (1 + ε)t*
    for fixed ε > 0, with t* = log d / 2. In sufficiently large dimension
    its defining integrand is integrable for every positive time and
    every initial point in this ball.
- declaration: Cutfast.cutoff_fixedExponent_fisherInfo
  informal: >-
    For fixed porous medium exponent m > 1 and r > 0, the supremum of
    relative Fisher information over the closed ball of initial points of
    radius r√d tends to infinity at (1 − ε)t* for fixed 0 < ε < 1 and to zero at
    (1 + ε)t* for fixed ε > 0, with t* = log d / 2.
