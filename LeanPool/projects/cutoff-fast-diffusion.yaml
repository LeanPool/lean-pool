main_results:
- declaration: Cutfast.cutoff_wassersteinSq
  informal: >-
    For fixed self-similarity exponent α > 0 with α ≠ 1/2, the worst squared
    Wasserstein distance over initial points in a ball of radius r√d tends to
    infinity before and zero after the critical time max(1, α) log d / 2.
- declaration: Cutfast.cutoff_relEntropy
  informal: The same cutoff holds for the relative entropy, whose defining integrals are shown to exist.
- declaration: Cutfast.cutoff_fisherInfo
  informal: The same cutoff holds for the relative Fisher information.
- declaration: Cutfast.cutoff_fixedExponent_wassersteinSq
  informal: For fixed porous medium exponent m > 1, the squared Wasserstein cutoff occurs at log d / 2.
- declaration: Cutfast.cutoff_fixedExponent_relEntropy
  informal: For fixed porous medium exponent m > 1, the relative entropy cutoff occurs at log d / 2.
- declaration: Cutfast.cutoff_fixedExponent_fisherInfo
  informal: For fixed porous medium exponent m > 1, the relative Fisher information cutoff occurs at log d / 2.
