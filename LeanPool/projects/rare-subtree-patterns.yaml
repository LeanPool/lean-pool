main_results:
  - declaration: PoissonDeclumping.poissonApproximation
    informal: >-
      Under the critical stable-domain assumption, microscopicity and
      non-clustering with a common sublinear divergent cutoff give Poisson
      approximation for bounded expected marked counts, and a law of large
      numbers when the expected count diverges, along admissible tree sizes.
  - declaration: PoissonDeclumping.poissonApproximation2
    informal: >-
      Structural microscopicity of the original marks and non-clustering of
      the root-declumped marks yield Poisson approximation with the c_B-adjusted
      parameter when expected counts are bounded, and divergence in probability
      when they grow, along admissible tree sizes.
  - declaration: PoissonDeclumping.maxString
    informal: >-
      For critical offspring laws in a stable domain, the maximum non-fringe
      complete r-ary height has a lattice-Gumbel law for unary strings and
      two-point localization for r at least two, with the stated offspring
      probabilities and phase-dependent refinements.
  - declaration: PoissonDeclumping.maxLeafHeight
    informal: >-
      The maximum leaf-height has the stated lattice-Gumbel behavior when the
      unary offspring probability is positive, and the two-point behavior
      when it is zero, with the stated nondegeneracy and stable-domain conditions.
