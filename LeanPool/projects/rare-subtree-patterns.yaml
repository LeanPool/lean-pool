slug: rare-subtree-patterns
title: Rare subtree patterns in conditioned Bienaymé trees
summary: >-
  Proves marked Poisson approximation, root declumping, maximal complete
  non-fringe r-ary height and maximum leaf-height for critical Bienaymé trees
  conditioned on their size, under the stated stable-domain, marking, cutoff
  and non-clustering hypotheses. Periodic offspring laws are included through
  admissible-size limits. The dependency closure preserves tree coding,
  Chen–Stein bounds, regular variation, stable densities and lattice local
  limit estimates, with concrete offspring examples and direct consequences.
