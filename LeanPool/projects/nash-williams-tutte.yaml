main_results:
- declaration: NashWilliamsTutte.tree_packing
  informal: A finite simple graph on a nonempty vertex type has k pairwise edge-disjoint
    spanning trees if and only if every vertex partition into m nonempty parts has at
    least k(m − 1) crossing edges.
- declaration: NashWilliamsTutte.arboricity
  informal: A finite simple graph is the union of k forests if and only if every nonempty
    finite vertex set S induces at most k(|S| − 1) edges.
- declaration: NashWilliamsTutte.exists_trees_of_isEdgeConnected
  informal: Every finite simple graph on a nonempty vertex type that remains connected
    after deletion of fewer than 2k edges has k pairwise edge-disjoint spanning trees.
- declaration: NashWilliamsTutte.exists_forests_core
  informal: Every finite simple graph G contains k pairwise edge-disjoint forests and
    a subgraph H such that intersecting each forest with H preserves the connected
    components of H, and the forests cover every edge of G outside H.
