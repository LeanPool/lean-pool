main_results:
- declaration: MultiplicativeErgodic.mainres
  informal: For a forward-integrable strongly measurable cocycle on a nontrivial separable real Banach space
    over a nonatomic standard-Borel invertible ergodic probability base, constructs measurable finite-dimensional
    fast spaces and invariant slow spaces with tempered slow projections, pins exponents and multiplicities
    to Bernstein growth indices, characterizes fast sums by backward histories and slow spaces by
    vector-growth limsups, and proves uniqueness on the spectral index range.
- declaration: MultiplicativeErgodic.mainres_compactnessIndex
  informal: Assuming an almost-everywhere limit for the normalized extended logarithm of the distance
    of cocycle iterates to compact operators, restates the decomposition, backward characterization
    and uniqueness with the nontriviality criterion that this compactness rate differs from the top
    Lyapunov exponent.
- declaration: MultiplicativeErgodic.kingman
  informal: Proves the subadditive ergodic theorem for measurable real subadditive families with
    integrable positive part, allowing an extended-real limiting constant.
- declaration: MultiplicativeErgodic.grassmannianFin_complete
  informal: The Grassmannian of a fixed positive finite dimension in a complete real normed space
    is complete for the Hausdorff distance between unit spheres.
