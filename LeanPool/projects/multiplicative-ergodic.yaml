slug: multiplicative-ergodic
title: Oseledets decomposition by subspace growth estimates
summary: Constructs and proves uniqueness of a semi-invertible Oseledets decomposition on nontrivial
  separable real Banach spaces over nonatomic standard-Borel invertible ergodic probability bases, using Bernstein
  growth indices. Includes backward-history characterization, tempered slow projections, a compactness-index
  restatement conditional on its rate limit, and reusable Grassmannian and ergodic-theorem infrastructure.
