title: Local and global class field theory
summary: Formalizes local and global reciprocity and existence theorems, Hasse–Arf,
  Hilbert pairings, the cyclic Hasse norm theorem, conductors, ray class fields, Hilbert
  class fields, and Kronecker–Weber, together with the valuation, cohomology, and
  profinite-group support used in their proofs.
branch: algebraic number theory
main_declarations:
- ClassFieldTheory.finiteAbelianLocalReciprocity
- ClassFieldTheory.topologicalGlobalReciprocity
main_results:
- declaration: ClassFieldTheory.finiteAbelianLocalReciprocity
  informal: For a finite abelian extension of nonarchimedean local fields, there is
    a surjective continuous Artin map with kernel equal to the field-norm subgroup.
- declaration: ClassFieldTheory.topologicalGlobalReciprocity
  informal: The idèle-class quotient by its identity component is topologically isomorphic
    to the abelianized absolute Galois group.
