slug: persistent-sos
title: Persistent failure of quartic sum-of-squares exactness
summary: Constructs explicit rational cubics in fourteen real variables whose
  Euclidean quartic regularizations have a strict ordinary sum-of-squares gap
  for every positive regularization, quadratic, and cubic parameter. A companion
  construction has a unique global minimizer and a positive-definite Hessian
  there. Exact moment certificates and a general SOS degree bridge certify the
  gap for arbitrary finite sums of squares of real polynomials.
branch: polynomial optimization and real algebraic geometry
