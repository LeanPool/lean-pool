slug: goodman-supersaturation
title: Goodman's formula and clique supersaturation for two-colourings
summary: Counts monochromatic structures in a red/blue colouring of a complete graph, given as a
  `SimpleGraph` and its complement. Proves Goodman's formula for monochromatic triangles, inside any
  finite vertex set and globally, with its degree-imbalance form, the bound n(n-1)(n-5)/24, equality
  for graphs regular of degree k on 2k+1 vertices, and the stronger bound n(n-2)(n-4)/24 for even n.
  Also proves monochromatic books, an edge-balance inequality, supersaturation of monochromatic
  cliques by averaging (made unconditional at the diagonal Ramsey number of the pool's FiniteRamsey
  project), and a counted Erdős–Szekeres recursion giving explicit lower bounds on the number of red
  k-cliques or blue l-cliques.
