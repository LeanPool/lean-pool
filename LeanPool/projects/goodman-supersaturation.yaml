main_results:
- declaration: SimpleGraph.goodman_within
  informal: Goodman's formula inside any finite vertex set S. Twice the number of triangles of G and
    of its complement inside S, plus the number of mixed wedges (the sum over v in S of the red degree
    times the blue degree of v within S), equals 2 C(|S|, 3).
  paper: A. W. Goodman, On sets of acquaintances and strangers at any party, Amer. Math. Monthly 66
    (1959), 778-783, doi:10.2307/2310464.
- declaration: SimpleGraph.goodman_bound
  informal: Goodman's bound. For a finite vertex type of size n, n(n-1)(n-5) is at most 24 times the
    number of triangles of G plus the number of triangles of its complement (natural-number
    subtraction, so the statement is trivial for n < 5).
  paper: A. W. Goodman, On sets of acquaintances and strangers at any party, Amer. Math. Monthly 66
    (1959), 778-783, doi:10.2307/2310464.
- declaration: SimpleGraph.IsRegularOfDegree.goodman_eq
  informal: Sharpness. If G is regular of degree k on 2k+1 vertices, then 24 times the number of
    monochromatic triangles equals n(n-1)(n-5) exactly (over the integers).
- declaration: SimpleGraph.supersaturation
  informal: Counted Erdős–Szekeres recursion. For k, l at least 1 with k + l at least 3 and a finite
    vertex set S with x = |S| + 1 - 2^(k+l-3) > 0, either G has at least supersaturationBound k l x
    k-cliques inside S or its complement has at least supersaturationBound l k x l-cliques inside S,
    where supersaturationBound k l x = x^k 2^(2k+1) / (k! 2^(kl + C(k+1, 2))).
  paper: P. Erdős and G. Szekeres, A combinatorial problem in geometry, Compositio Math. 2 (1935),
    463-470 (the uncounted recursion).
- declaration: SimpleGraph.choose_le_card_cliqueFinset_add_mul_choose_ramseyNumber
  informal: Supersaturation by averaging at the diagonal Ramsey number. If R(t, t) is at most n, then
    C(n, t) is at most C(R(t, t), t) times the number of t-cliques of G plus those of its complement.
    R(t, t) is the pool's FiniteRamsey ramseyNumber ![t, t]; this bridge was added in the port.
