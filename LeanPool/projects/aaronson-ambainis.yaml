slug: aaronson-ambainis
title: The Aaronson–Ambainis influence conjecture
summary: Proves that a real polynomial of degree at most d, bounded between zero
  and one on the Boolean cube and with variance at least epsilon > 0, has a
  coordinate of squared-difference influence at least (epsilon/d)^7. Also proves
  explicit bounds with epsilon^(5/2)/d^6, together with determinant pairings,
  fractional-certificate inequalities and coordinate averaging. The internal
  packing-cover duality supports the proof; generic finite LP duality is already
  pooled as StandardLP.strongDuality. The sharper constant is conditional on the
  stated Agarwal–Ben-David fractional block-sensitivity bound. Quantum simulation
  consequences are outside this formalization.
