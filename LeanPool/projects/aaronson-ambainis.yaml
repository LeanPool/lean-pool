main_results:
- declaration: AaronsonAmbainis.aaronson_ambainis
  informal: For every real polynomial in N variables of total degree at most d,
    bounded between zero and one on the Boolean cube, positive variance at least
    epsilon guarantees a coordinate whose uniform mean squared change under a bit
    flip is at least (epsilon/d)^7.
- declaration: AaronsonAmbainis.aaronson_ambainis_explicit
  informal: Under the same hypotheses, a coordinate has squared-difference
    influence at least 8 sqrt(15) epsilon^(5/2) / (125 pi^4 d^6).
- declaration: AaronsonAmbainis.aaronson_ambainis_pm
  informal: For a real polynomial of degree at most d bounded in absolute value
    by one on the sign cube, positive variance at least epsilon guarantees a
    coordinate whose uniform mean squared half-difference under a bit flip is at
    least sqrt(15) epsilon^(5/2) / (500 pi^4 d^6).
- declaration: AaronsonAmbainis.aaronson_ambainis_of_fbsDegreeBound
  informal: Assuming the explicitly stated Agarwal–Ben-David fractional
    block-sensitivity bound, the zero-one cube influence bound improves to
    32 sqrt(15) epsilon^(5/2) / (125 pi^4 d^6).
