slug: word-rep-tensor
title: Non-word-representability of tensor products of Mycielski graphs
summary: >
  Answers three questions of Alshammari about word-representability of tensor
  products of graphs built from odd cycles. Induced embeddings settle the
  products with odd wheels, and a seven-vertex orientation certificate rules
  out word representations of the mixed and extended Mycielski products.
branch: graph theory
entry_module: LeanPool.WordRepTensor
authors:
- Horace Dong
source:
  title: Tensor products of Mycielskians of odd cycles with odd wheels and with extended Mycielskians of odd cycles are not word-representable
  url: https://github.com/Horace-Maxwell/ai4math-results/blob/65dd8899dfe1abf289282f141222057d5593ca02/papers/wordrep-tensor/note.pdf
  github_repo: Horace-Maxwell/ai4math-results
