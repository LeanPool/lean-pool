license: Apache-2.0
status: verified
provenance: AI
main_declarations:
- WordRepTensor.not_wordRepresentable_mycielskian_tensor_wheel
- WordRepTensor.not_wordRepresentable_extended_tensor_wheel
- WordRepTensor.not_wordRepresentable_mycielskian_tensor_extended
- WordRepTensor.not_wordRepresentable_extended_tensor_extended
main_results:
- declaration: WordRepTensor.not_wordRepresentable_mycielskian_tensor_wheel
  informal: For n ≥ 1 and m ≥ 2, the tensor product of the Mycielskian of C(2n+1)
    with the wheel on a rim C(2m+1) is not word-representable.
- declaration: WordRepTensor.not_wordRepresentable_extended_tensor_wheel
  informal: The same non-word-representability holds when the first factor
    is the extended Mycielskian of C(2n+1).
- declaration: WordRepTensor.not_wordRepresentable_mycielskian_tensor_extended
  informal: For 1 ≤ n < m, the product of the Mycielskian of C(2n+1) and the
    extended Mycielskian of C(2m+1) is not word-representable.
- declaration: WordRepTensor.not_wordRepresentable_extended_tensor_extended
  informal: For 1 ≤ n < m, the product of the extended Mycielskians of
    C(2n+1) and C(2m+1) is not word-representable.
