slug: high-contrast-homogenization
title: Homogenization at a polynomial scale in high contrast
summary: >-
  Formalizes polynomial entry into the small-contrast regime, algebraic
  convergence of coarse blocks, and quantitative stochastic homogenization
  with correctors, Liouville classification and large-scale regularity.
  Uses locally uniformly elliptic measurable coefficient fields modulo
  almost-everywhere equality. The Dirichlet estimate has the documented
  negative-Sobolev formulation on adapted cells; the random radius is at
  least one and the effective matrix is existentially produced. Includes
  the complete production library and its pinned CoarseGraining dependency
  closure in an isolated support namespace.
