main_results:
  - declaration: HCPoly.polynomial_entry
    informal: >-
      Under stationary unit-range assumptions and the source-tail bound,
      every generation beyond a scale of polynomial length has annealed
      contrast at most one plus the prescribed tolerance.
  - declaration: HCPoly.algebraic_convergence
    informal: >-
      The annealed coarse blocks converge algebraically to a limiting
      positive-definite block, with two-sided order estimates.
  - declaration: HCPoly.uniform_homogenization
    informal: >-
      Uniformly elliptic stationary unit-range laws satisfy the
      negative-Sobolev Dirichlet estimate, corrector estimates, Liouville
      classification and first-order approximation obtained by specializing
      the polynomial homogenization theorem.
  - declaration: HCPoly.polynomial_homogenization
    informal: >-
      High-contrast stationary unit-range laws admit an effective matrix
      and a random homogenization radius with polynomial length and
      quantitative tails, negative-Sobolev Dirichlet estimates on adapted
      cells, correctors, Liouville classification and large-scale regularity.
  - declaration: HCPoly.quenched_convergence
    informal: >-
      Coarse coefficients converge almost surely beyond a quantitative
      random scale, with the documented source-tail and stretched-exponential
      tail estimates.
