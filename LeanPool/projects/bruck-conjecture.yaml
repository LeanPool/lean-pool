slug: bruck-conjecture
title: Brück's conjecture for entire functions
summary: Proves Brück's conjecture for nonconstant entire functions of finite hyper-order outside the positive integers. The proof combines analytic zero multiplicities with growth bounds for solutions of a first-order complex differential equation.
