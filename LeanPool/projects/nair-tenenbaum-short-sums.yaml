slug: nair-tenenbaum-short-sums
title: Nair–Tenenbaum short sums of arithmetic functions
summary: >-
  Uniform upper bounds for arithmetic functions at polynomial values in short
  intervals, including prime arguments, arithmetic progressions, Hooley moments,
  smooth values and Goldbach upper bounds. Preserves the sieve, polynomial-root,
  number-field counting and lattice-discrepancy infrastructure. Includes a
  counterexample to the printed Lemma 1, replacement comparisons used by the
  main proofs, and the nonconstant-coordinate restriction for Corollary 6.
