main_results:
- declaration: NairTenenbaum.theoremOne_for_families
  informal: >-
    For an integer polynomial family of positive total degree with no fixed
    prime divisor, short sums of admissible nonnegative arithmetic functions
    satisfy the Nair–Tenenbaum sieve bound in its degree-dependent interval
    range. The height threshold is independent of the coefficients and
    discriminant; the bound constant depends on the restricted discriminant.
    Factorization data are constructed from the original family.
- declaration: NairTenenbaum.theoremTwo
  informal: >-
    For any nonconstant irreducible integer polynomial Q and integer k greater
    than its degree, the greatest prime factor of the product of its values
    over (x, x + y], with y = x^(degree(Q)/k), eventually exceeds
    y times exp((log x)^alpha), for each alpha < 2 - log 4.
- declaration: NairTenenbaum.theoremThree_for_families
  informal: >-
    Under the same family and growth hypotheses, with nonzero constant term
    of the product polynomial, the corresponding bound holds at prime
    arguments. The constant-term correction is explicit and factorization
    data are constructed from the original family.
- declaration: NairTenenbaum.lemmaTwo
  informal: >-
    The smooth-weight tail estimate holds for general scalar class-M weights,
    with the stated cutoff, convergent series and uniform constant.
