main_results:
- declaration: Shellsort.HarvestFullSchedule.exists_size_indexed_family
  informal: For each input size n at least two, one strictly decreasing positive gap
    table ending in one sorts every rank permutation. It uses at most the base-two
    logarithm of n passes rounded down and averages at most (1 + 2^165) n log_2 n
    comparisons under the uniform distribution.
- declaration: Shellsort.PredeterminedOptimum.exists_optimal_executed_family
  informal: A size-indexed family of legal gap tables minimizes the mean number
    of executed key comparisons. For n at least two the minimum lies between
    log_2(n!) and (1 + 2^165) n log_2 n.
- declaration: Shellsort.PhysicalKeyOptimum.exists_uniform_family_for_physical_keys
  informal: The same tables sort and attain the same optimal mean comparison
    count for every ordered key set of size n under uniform bijective input.
