slug: shellsort-mean-comparisons
title: Optimal mean comparison count for ordinary Shellsort
summary: An input-independent gap table attains the minimum mean key comparison
  count of ordinary Shellsort on uniform permutations of distinct keys. The
  minimum has order n log n, and a witnessing upper-bound table uses at most
  the base-two logarithm of n passes rounded down.
