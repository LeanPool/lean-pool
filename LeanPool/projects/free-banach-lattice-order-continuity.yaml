slug: free-banach-lattice-order-continuity
title: Order continuity of induced homomorphisms between free Banach lattices
summary: Characterizes order continuity of the lattice homomorphism induced by a bounded
  operator between real Banach spaces, for every free convexity exponent from one
  to infinity. Develops concrete free p-convex Banach lattices, their universal
  property, operator-extension criteria, compact-support witnesses, and equivalent
  conditions for canonical inclusions between different exponents.
