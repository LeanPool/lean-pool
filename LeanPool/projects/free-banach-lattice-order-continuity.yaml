main_results:
- declaration: FBLOrderContinuousLH.intro_infty
  informal: At exponent infinity, the induced lattice homomorphism is order continuous
    exactly when the original bounded operator is zero or an isomorphic embedding.
  source_ref: Theorem 1.1. The public manuscript was submitted on 2026-10-30 at
    23:06:06 UTC; the completed Lean sources were committed earlier that evening
    as 167b82ad69724d2ddb2a701fc932e52d445faecc.
- declaration: FBLOrderContinuousLH.intro_poe
  informal: For a finite exponent p, the induced homomorphism is order continuous
    exactly when the original operator is zero or is an isomorphic embedding whose
    range has the POE-p operator-extension property. Equivalently, the induced
    homomorphism is zero or an isomorphic lattice embedding.
  source_ref: Theorem 1.3.
- declaration: FBLOrderContinuousLH.cross_parameter_inclusion
  informal: For p less than q, eight conditions on the canonical inclusion between
    the free p-convex and q-convex lattices are equivalent, including order continuity,
    surjectivity, equivalence of norms on the algebraic core, and order density.
  source_ref: Theorem 5.1.
- declaration: FBLOrderContinuousLH.cross_parameter_above_two
  informal: When p is less than q and q exceeds two, these conditions hold exactly
    when the generating Banach space is finite dimensional.
  source_ref: Corollary 5.3.
- declaration: FBLOrderContinuousLH.cross_parameter_hilbert
  informal: For the real Hilbert sequence space and one at most p less than q at
    most two, the canonical inclusion is an order-continuous bounded lattice
    isomorphism onto its target.
  source_ref: Remark 5.4.
