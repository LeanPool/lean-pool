slug: vacuum-bell-separation
title: Vacuum Bell correlation at large spacelike separation
summary: >-
  For the massive real free scalar field in 3+1 dimensions, the vacuum Bell
  correlation of two fixed bounded regions equals the classical bound once
  one region is translated sufficiently far along a fixed spacelike vector.
  Double cones of equal radius admit a separation-to-radius threshold
  independent of the positive mass. The development includes Weyl systems,
  local von Neumann algebras, a construction of the free-field vacuum, and a
  proof that the algebra of a nonempty open region is noncommutative.
