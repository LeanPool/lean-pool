main_results:
- declaration: VacuumBellSeparation.OQP12.theorem_1_1
  informal: >-
    One constant greater than two gives a sufficient separation-to-radius
    ratio for the normalized vacuum CHSH supremum of equal-radius double
    cones to be one, for every positive mass.
- declaration: VacuumBellSeparation.OQP12.corollary_1_2
  informal: >-
    For two bounded regions and a fixed spacelike vector, the normalized
    supremum equals one beyond a translation threshold.
- declaration: VacuumBellSeparation.OQP12.no_chsh_violation_far_apart
  informal: >-
    Beyond that threshold the unnormalized CHSH expression for any four
    local self-adjoint contractions has absolute value at most two.
- declaration: VacuumBellSeparation.OQP12.no_chsh_violation_far_apart_uniform
  informal: >-
    A single threshold suffices uniformly over all spatial translation
    directions for a given pair of bounded regions and positive mass.
- declaration: VacuumBellSeparation.OQP12.freeFieldVacuum_exists
  informal: >-
    For every positive mass there exists a complex Hilbert space carrying a
    free-field vacuum Weyl system.
- declaration: VacuumBellSeparation.OQP12.localAlgebra_open_nonabelian
  informal: >-
    The local von Neumann algebra of every nonempty open spacetime region
    contains two noncommuting operators.
