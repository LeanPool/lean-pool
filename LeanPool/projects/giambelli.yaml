slug: giambelli
title: Giambelli's identity for Schur polynomials
summary: Proves Giambelli's identity s_λ = det(s_(α_i | β_j))_{i,j<d}, expressing the
  Schur polynomial of a Young diagram with Durfee square of side d and Frobenius coordinates
  (α | β) as the determinant of the hook Schur polynomials, for Tau Ceti's Schur polynomials
  of Young diagrams (alphabet Fin N) and of partitions (any finite alphabet). The identity
  is first proved for Jacobi–Trudi determinants det(h_{λ_i − i + j}) of any pair of symbols
  h, e with H(X)E(−X) = 1, by multiplying by a unitriangular matrix of e's, expanding along
  the resulting unit rows and using Frobenius complementarity; it is then specialized through
  Tau Ceti's Jacobi–Trudi identity. The explicit hook formula s_(a | b) = Σ_{r ≤ a} (−1)^r
  h_{a−r} e_{b+1+r} is included. Giambelli's identity is classical (Macdonald, Symmetric
  Functions and Hall Polynomials, Ch. I §3, Example 9). This is a port of the formalization
  in DataDotFoundation/RMTlib; the Lean proofs were produced with AI (Claude). Motivated by
  arXiv:1201.4478 (Dehaye), which uses Giambelli's identity in the Frobenius–Schur form of
  Olshanski–Regev–Vershik (§7.1.4). This project proves the classical Schur form.
