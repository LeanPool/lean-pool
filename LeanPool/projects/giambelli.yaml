main_results:
- declaration: Giambelli.diagramSchurPoly_eq_det_hook
  informal: Giambelli's identity. For a Young diagram μ with Durfee square of side d and
    Frobenius coordinates (α_0, …, α_{d−1} | β_0, …, β_{d−1}), the Schur polynomial of μ in
    N variables is the determinant of the d × d matrix of hook Schur polynomials s_(α_i | β_j).
  source_ref: Macdonald, Symmetric Functions and Hall Polynomials, Ch. I §3, Example 9.
- declaration: Giambelli.schurPoly_eq_det_hook
  informal: Giambelli's identity for the Schur polynomial of a partition in any finite
    alphabet, with the hooks taken as partitions.
  source_ref: Macdonald, Symmetric Functions and Hall Polynomials, Ch. I §3, Example 9.
- declaration: Giambelli.giambelli_jt'
  informal: Giambelli's identity for Jacobi–Trudi determinants det(h_{λ_i − i + j}) of any
    pair of symbols h, e vanishing in negative degree with e_0 = 1 and H(X)E(−X) = 1.
- declaration: Giambelli.diagramSchurPoly_hookDiagram
  informal: The hook Schur polynomial s_(a | b) equals Σ_{r ≤ a} (−1)^r h_{a−r} e_{b+1+r}.
- declaration: Giambelli.det_unitRows
  informal: A determinant whose last rows are unit vectors equals a signed minor on the
    remaining columns.
