main_results:
- declaration: QuadraticForm.cancel
  informal: Witt cancellation over an LG ring. If the orthogonal sums of q1 and of q2
    with q3 are isometric, where q2 is nonsingular and q3 is regular on finitely generated
    projective modules, then q1 and q2 are isometric.
- declaration: IsAlternative.isAlternative_iff_two_generated_assoc
  informal: Artin's theorem. A non-associative ring is alternative if and only if every
    subring generated by two elements is associative.
- declaration: Module.free_of_isLGRing_of_rankAtStalk_eq
  informal: Over an LG ring, a finitely generated projective module of constant rank
    is free.
- declaration: ConicAlgebra.IsComposition.isAlternative_general
  informal: Every composition algebra over every commutative ring is alternative, with
    no hypothesis on 2, on the rank, or on nontriviality of the base ring.
- declaration: ConicAlgebra.IsComposition.rankAtStalk_classification
  informal: A composition algebra of constant rank over a nontrivial commutative ring
    has rank 1, 2, 4 or 8; it is the base ring in rank 1, commutative and associative
    in rank 2, associative but not commutative in rank 4, and alternative but not
    associative in rank 8.
- declaration: ConicAlgebra.IsComposition.exists_isometryEquiv_map_one_map_mul
  informal: Over an LG ring, composition algebras with isometric norms are isomorphic.
- declaration: ConicAlgebra.IsReduced.isSplit_of_isLGRing
  informal: Over an LG ring, every reduced composition algebra is split.
