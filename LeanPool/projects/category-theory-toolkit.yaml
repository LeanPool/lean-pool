main_results:
- declaration: CategoryTheory.Adjunction.fixedEquiv
  informal: Every adjunction L ⊣ R restricts to an equivalence between the full
    subcategory of objects at which the unit is an isomorphism and the full subcategory
    of objects at which the counit is an isomorphism.
  source_ref: 'nLab, "idempotent adjunction" (https://ncatlab.org/nlab/show/idempotent+adjunction).'
- declaration: CategoryTheory.Adjunction.idempotent_tfae
  informal: For an adjunction L ⊣ R with unit η and counit ε, the conditions ηR, Rε, εL
    and Lη invertible are equivalent.
  source_ref: 'nLab, "idempotent adjunction" (https://ncatlab.org/nlab/show/idempotent+adjunction).'
- declaration: CategoryTheory.Adjunction.fixedLeftReflective
  informal: For an idempotent adjunction L ⊣ R, the objects at which the unit is an
    isomorphism form a reflective subcategory with reflector L ⋙ R (and dually the
    objects at which the counit is an isomorphism form a coreflective subcategory).
- declaration: CategoryTheory.Idempotents.karoubiUniversalAdditive
  informal: For preadditive C and idempotent complete preadditive D, precomposition
    with C → Karoubi C is an equivalence between additive functors Karoubi C ⥤ D and
    additive functors C ⥤ D.
- declaration: Rep.isEquivalence_resFunctor_iff
  informal: For a group homomorphism f from H to G and a nontrivial commutative ring k,
    restriction of k-linear representations along f is an equivalence of categories iff
    f is bijective; it is full iff f is surjective.
- declaration: CategoryTheory.CommSq.isSemiCartesian_iff_exists_factorisation
  informal: In an abelian category, a commutative square is semi-cartesian (the map from
    the pushout of its top-left corner is a monomorphism, equivalently the map to the
    pullback of its bottom-right corner is an epimorphism, equivalently its biproduct
    sequence is exact in the middle) iff it factors as a pushout square followed by a
    pullback square.
- declaration: CategoryTheory.SemiadditiveOfBinaryBiproducts.preadditiveOfWeakMonoEpiInvertible
  informal: In a category with zero morphisms and binary biproducts in which every
    morphism with zero kernel and zero cokernel is invertible, the commutative monoid
    structure on hom-sets given by the biproducts has additive inverses, so the category
    is preadditive.
