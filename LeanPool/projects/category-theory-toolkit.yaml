slug: category-theory-toolkit
title: Category theory toolkit
summary: A collection of general results in category theory. Any adjunction restricts to
  an equivalence between the objects fixed by its unit and those fixed by its counit;
  the four usual conditions defining an idempotent adjunction are equivalent, and then
  the fixed objects form a reflective and a coreflective subcategory. Additive functors out of the
  Karoubi envelope into an idempotent complete category are equivalent to additive
  functors out of the original category. A category is direct exactly when the relation
  "there is a non-identity morphism" is well-founded, and the semi-simplex category is
  direct. Restriction of representations along a group homomorphism is full iff the
  homomorphism is surjective, and an equivalence iff it is bijective. In abelian
  categories, a pullback with an epimorphism opposite is a pushout, and semi-cartesian
  squares (pushout-to-corner mono, equivalently corner-to-pullback epi)
  are characterized by exactness and as composites of a pushout and a pullback square.
  Finally, a category with zero morphisms and binary biproducts in which every morphism
  with zero kernel and zero cokernel is invertible is preadditive. Two supporting files
  package results Mathlib already proves in other forms, for use by these statements,
  Beck's monadicity and comonadicity theorems as equivalences (a variant of Mac Lane,
  Theorem VI.7.1, for an equivalence rather than an isomorphism of categories), and the
  exactness criteria for pullback and pushout squares in abelian categories.
