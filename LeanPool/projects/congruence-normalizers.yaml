slug: congruence-normalizers
title: Newman normalizer bounds for congruence subgroups
summary: >-
  Characterizes the normalizer of Gamma0(N) in SL(2, R), for every positive
  level N, by explicit integral matrices scaled by a square root. Extends the
  necessary matrix form to GammaDelta(N) for every subgroup Delta of the units
  modulo N. Preserves Atkin-Lehner elements, rational representatives, integral
  matrix lattices, prime valuations and a generic normalizer argument.
  The upstream finite presentations, group orders and modular-curve
  automorphism classifications are outside this import's scope.
