main_results:
- declaration: CongruenceNormalizers.newman_iff
  informal: >-
    For N > 0, put h = 2^min(3, floor(v_2(N)/2)) times
    3^min(1, floor(v_3(N)/2)) and n = N/h^2. A real determinant-one matrix
    normalizes Gamma0(N) exactly when it equals plus or minus 1/sqrt(e)
    times [[a*e, b/h], [N*c/h, d*e]], for integers a, b, c, d and a positive
    divisor e of n satisfying a*d*e^2 - b*c*n = e.
- declaration: CongruenceNormalizers.newman_delta
  informal: >-
    For N > 0 and Delta a subgroup of the units modulo N, let epsilon be
    gcd(N, u^2 - 1 for representatives u in Delta), and let h be the product
    over primes p dividing N of p^min(v_p(epsilon), floor(v_p(N)/2)). Every
    determinant-one real matrix normalizing GammaDelta(N) has the same
    integral Newman form with this h and n = N/h^2. This is a necessary
    bound; no converse for GammaDelta(N) is asserted.
- declaration: CongruenceNormalizers.hPart_isGreatest'
  informal: >-
    At every positive level, h(N) is the greatest divisor of 24 whose square
    divides N.
