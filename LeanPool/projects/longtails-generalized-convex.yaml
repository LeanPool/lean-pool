main_results:
- declaration: LongTails.OracleTemplate.GeneralizedAccelerated.SelfNormalized.result
  informal: >-
    For positive L0, R, Delta and epsilon and nonnegative L1, a single damped
    accelerated algorithm returns a point of objective gap at most epsilon for
    every admissible convex objective with an attained minimum within distance
    R and initial objective gap at most Delta. Its exact gradient-query budget
    is zero when Delta <= epsilon; otherwise it is twice the natural ceiling
    of 4096 times (1 + sqrt(L0*R^2/epsilon) + min(ceil((L1*R)^(2/3))*D,
    D + (L1*R*D)^(2/3))), where D = log(4 + 4*Delta/epsilon).
- declaration: LongTails.OracleTemplate.GeneralizedAccelerated.run_accuracy_self_normalized
  informal: >-
    Under the same convexity, gradient, Hessian-growth and initialization
    hypotheses, N accelerated steps reach objective gap epsilon whenever
    N >= 4096*(1 + sqrt(L0*R^2/epsilon) + D + (L1*R*D)^(2/3)).
- declaration: LongTails.OracleTemplate.GeneralizedAccelerated.execute_gradient_oracle
  informal: >-
    Execution with any admissible exact-gradient oracle and a budget of 2*N
    gradient queries equals the N-step accelerated iterate, for every seed.
- declaration: LongTails.OracleTemplate.Gradient.gd_accuracy
  informal: >-
    For a convex function with an exact L-Lipschitz gradient and initial distance
    at most R from a comparison point, ordinary gradient descent reaches
    objective gap epsilon after max(1, ceil(L*R^2/(2*epsilon))) queries.
