slug: longtails-generalized-convex
title: Gradient-only acceleration for generalized-smooth convex optimization
summary: >-
  A damped accelerated method minimizes convex functions on real Hilbert spaces
  whose differentiable gradients satisfy the Hessian-growth bound
  norm(D gradient f x) <= L0 + L1 * norm(gradient f x). The development proves an
  explicit gradient-query budget for any positive accuracy, initial distance
  bound and initial objective-gap bound, with an attained minimum. It retains
  the oracle execution model, ordinary gradient descent, energy dissipation,
  charging arguments and two complementary convergence bounds. No objective
  value or line-search oracle is assumed.
