slug: rupert-minimality
title: Rupert passages for convex solids with at most six vertices
summary: >
  Proves that every noncoplanar finite point set with at most six elements has
  a convex hull with Rupert's property. The proof constructs passages from
  suitable planar silhouettes and classifies the six-point configurations by
  their affine dependencies. It also classifies Rupert's property for
  coplanar and collinear point sets.
