main_results:
- declaration: Undecidability.exists_three_generator_nine_relator_group_with_unsolvable_word_problem
  informal: There is a finite presentation with three generator slots and nine relator
    slots whose word problem is not a computable predicate.
  source_ref: arXiv:2609.10461v1, Theorem 1.1.
- declaration: Undecidability.exists_four_generator_eleven_relator_adian_rabin_family
  informal: There is a uniformly computable family of finite presentations with four
    generator slots and eleven relator slots for which the set of indices presenting
    the trivial group is not computable.
  source_ref: arXiv:2609.10461v1, Theorem 1.3.
- declaration: Undecidability.exists_two_generator_ten_relator_adian_rabin_family
  informal: There is a uniformly computable family of finite presentations with two
    generator slots and ten relator slots for which the set of indices presenting
    the trivial group is not computable.
  source_ref: arXiv:2609.10461v1, Theorem 1.4.
- declaration: Undecidability.exists_small_undecidable_presentations
  informal: 'The three small-presentation bounds hold together: an undecidable word
    problem with three generators and nine relators, and effective families with undecidable
    triviality with four generators and eleven relators and with two generators and
    ten relators.'
  source_ref: arXiv:2609.10461v1, Theorems 1.1, 1.3, and 1.4.
