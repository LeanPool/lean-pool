slug: small-undecidable-groups
title: Small undecidable groups and effective Adian–Rabin families
summary: Proves the existence of a finitely presented group with three generator slots
  and nine relator slots whose word problem is undecidable, and effective families
  with undecidable triviality having respectively four generators and eleven relators,
  and two generators and ten relators. The dependency closure includes computable
  machine-to-Thue reductions, synchronized rewriting, Borisov’s group simulator, injective
  HNN and Tietze compression, and general Miller–Tancer and Gordon constructions.
  Formalizes the algebraic results of the cited paper; its four-manifold consequences
  are outside this project.
