slug: arithmetic-triangle-removal-in-vector-spaces
title: A tight bound for Green's arithmetic triangle removal lemma in vector spaces
summary: Proves the arithmetic triangle removal lemma in F_p^n with the polynomial
  bound of Fox and Lovász. If X × Y × Z contains fewer than (ε/3)^(C_p) N^2
  solutions of x + y + z = 0, where N = p^n, C_p = 1 + 1/c_p and c_p is the
  Kleinberg–Sawin–Speyer exponent, then removing at most εN elements leaves none.
  Also proves the Kleinberg–Sawin–Speyer slice-rank bound p^((1 - c_p) n) on
  multicolored sum-free families, the lower bound (m/N)^(C_p) N^2 on the number of
  triangles spanned by m vertex-disjoint triangles, and that the exponent C_p is
  optimal, with an explicit threshold ε₀. The tightness construction formalizes
  Pebody's coupling theorem for decreasing mass functions and the
  Kleinberg–Sawin–Speyer construction of large multicolored sum-free families,
  using Behrend's three-term-progression-free sets.
