status: verified
summary: >-
  Identifies a weighted graph Laplacian and signed port up to simultaneous vertex relabeling
  from the first and mixed second terminal response derivatives in all smooth temporal
  directions at one positive horizon. The general result assumes a common known positive
  decay, connected symmetric nonnegative weighted graphs, cyclic ports, and a separation,
  spectral-band and contraction criterion on the source. The project also identifies one
  explicit six-vertex source under a separate set of assumptions.
branch: main
main_declarations:
  - C145.PaperActualResponse.selected_response_theoremA_graph
