main_results:
  - declaration: C145.PaperActualResponse.selected_response_theoremA_graph
    source_ref: "C145 v0.6, Theorem 1 (§2.1, p. 2; Theorem A in Lean) and Appendix D (pp. 14–15)"
    informal: >-
      For connected symmetric nonnegative weighted graphs with a common known positive decay
      and cyclic ports, equality of the first and mixed second terminal response derivatives
      in all smooth temporal directions determines the source Laplacian and signed port up to
      one vertex relabeling, when the source satisfies the stated separation, spectral-band
      and contraction criterion.
  - declaration: C145N6Frame.literal_N6_original_graph_identification
    source_ref: "C145 v0.6, §10 (pp. 10–11), explicit six-vertex source"
    informal: >-
      The explicit six-vertex source has the same Laplacian and signed port up to a vertex
      relabeling as any connected symmetric nonnegative weighted competitor with a cyclic
      port, the same known decay, and matching first and mixed second terminal derivatives
      of actual responses continuous at zero. A zero competitor diagonal also gives equality
      of the full weight matrices under that relabeling.
