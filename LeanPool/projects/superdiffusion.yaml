slug: superdiffusion
title: Superdiffusion and anomalous regularization in self-similar random flows
summary: >-
  Proves quenched displacement-moment estimates, quantitative generator
  renormalization and anomalous large-scale elliptic regularity for random
  incompressible flows satisfying the ABK shell-law assumptions. The shell
  carrier has continuous second derivatives, a stronger qualitative
  regularity assumption than the paper's local C^{1,1} assumption. The model
  hypotheses are explicit; the Gaussian example is not constructed.
  Preserves the production dependency closure, including sensitivity,
  diffusivity recursion, concentration and divergence-form process theory.
  Reuses the pooled homogenization and Markov-process libraries. A public
  companion theorem proves finiteness of the first and second displacement
  observables used in the superdiffusivity statement. Additional proofs
  establish measurable dependence of the transition law and quenched
  displacement expectations on the environment.
branch: probability and partial differential equations
