main_results:
  - declaration: Algsuperdiff.superdiffusivity_with_finite_moments
    informal: >-
      For dimensions at least two, one positive small-coupling threshold
      simultaneously gives the full quantitative superdiffusivity bounds
      and almost-sure integrability of both displacement observables at
      every positive time.
  - declaration: Algsuperdiff.superdiffusivity
    informal: >-
      For each dimension and positive nondegeneracy constant, sufficiently
      small coupling gives annealed moment bounds for the quenched second
      displacement moment about the intrinsic superdiffusive scale and
      for the squared quenched mean displacement, uniformly at all positive
      times and throughout the stated coupling-dependent moment range.
  - declaration: Algsuperdiff.generator_renormalization
    informal: >-
      At every triadic scale, the effective diffusivity tracks the predicted
      superdiffusive profile. One measurable random error with quantitative
      moment bounds controls both the essential uniform difference and
      the energy difference between random and homogenized Dirichlet
      solutions for all admissible forcing and boundary data.
  - declaration: Algsuperdiff.anomalous_regularity
    informal: >-
      At every scale and admissible Hölder exponent, a random minimal scale
      with an exponential tail yields large-scale excess-decay estimates
      for Dirichlet solutions, uniformly in molecular diffusivity, with
      the boundary-data term absent in the interior subcube.
  - declaration: Algsuperdiff.Section5.Provider.exists_ae_integrable_streamProcess_displacement
    informal: >-
      For dimensions at least two and sufficiently small coupling, at every
      positive time the first and second displacement observables of the
      constructed process are integrable for almost every environment.
  - declaration: Algsuperdiff.Section5.Measurability.measurable_streamProcess_displacement_expectations
    informal: >-
      The first and second quenched displacement expectations of the
      constructed process are measurable functions of the environment.
