slug: arnold-kam
title: Analytic Hamiltonian KAM on compact action domains
summary: >-
  Proves a nondegenerate analytic Hamiltonian KAM theorem on compact complex action
  domains whose real slice is the closure of a nonempty open set with null boundary.
  A positive perturbation threshold, chosen independently of the perturbation,
  yields a pairwise disjoint family of analytic invariant tori covering all but a
  prescribed relative measure error. Includes Fourier estimates, generating
  transformations, resonance measure bounds, infinite iteration, global Hamiltonian
  trajectories, and examples with a noninjective frequency map. The final torus
  interface asserts nonresonance but does not additionally assert a quantitative
  Diophantine bound or the Lagrangian property.
