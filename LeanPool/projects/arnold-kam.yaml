main_results:
  - declaration: KamProject.Arnold1963.theorem1
    informal: >-
      For a positive-dimensional analytic, real-compatible unperturbed Hamiltonian
      with nonzero Hessian determinant on the real interior of the specified compact
      domain, and any positive angle width and tolerance, a positive uniform
      perturbation threshold gives a compact positive-measure good set partitioned
      into pairwise disjoint analytic nonresonant invariant tori. The complementary
      bad set has measure less than the tolerance times the initial phase volume.
      Each torus has a closed embedding, an injective derivative, small displacement,
      and trajectories solving the original perturbed Hamiltonian equation for all
      real time. The analytic width is a positive output bounded by the input width.
  - declaration: KamProject.Arnold1963.theorem1_of_pointwise
    informal: >-
      The same KAM conclusion holds when the perturbation is pointwise strictly
      below the chosen threshold throughout its prescribed phase domain.
  - declaration: KamProject.Arnold1963.AnalyticPhaseFunction.canonical_pullback
    informal: >-
      A differentiable symplectic transformation mapping into the analytic
      Hamiltonian's phase domain carries the vector field of the pulled-back
      Hamiltonian to the original Hamiltonian vector field.
