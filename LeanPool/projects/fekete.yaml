main_results:
- declaration: NearlySubadditive.tendsto_atBot_or_exists_tendsto
  informal: If 1 < μ and u (m + n) ≤ u m + u n whenever N ≤ m ≤ n ≤ μ m, then u n / n tends to -∞
    or to a real limit.
  source_ref: Füredi–Ruzsa, Nearly subadditive sequences (Acta Math. Hungar. 161, 2020), Theorem 2.
- declaration: NearlySubadditive.tendsto_lim
  informal: Under the same window hypothesis, if u n / n is bounded below then it converges to
    the infimum of u k / k over k ≥ max N 1.
  source_ref: Limit identification accompanying Füredi–Ruzsa Theorem 2; upstream Fekete/Window.lean.
- declaration: NearlySubadditive.tendsto_atBot_or_exists_tendsto_of_summable
  informal: If 1 < μ, u (m + n) ≤ u m + u n + f (m + n) for N ≤ m ≤ n ≤ μ m, f is monotone and
    ∑ f n / n² is summable, then u n / n tends to -∞ or to a real limit. No sign condition on f
    is assumed.
  source_ref: de Bruijn–Erdős (1952) in the generality of Füredi–Ruzsa, Theorem 5.
- declaration: summable_div_sq_iff_forall_not_tendsto_atTop
  informal: For a nonnegative monotone f, ∑ f n / n² is summable if and only if no sequence with
    u (m + n) ≤ u m + u n + f (m + n) for all m, n has u n / n → ∞.
  source_ref: Füredi–Ruzsa, Claim 7, combined with Theorem 5.
- declaration: Subadditive.tendsto_div_atBot
  informal: If u is subadditive and u n / n is not bounded below, then u n / n → -∞; this
    complements Mathlib's Subadditive.tendsto_lim.
  source_ref: Upstream Fekete/Superadditive.lean; counterpart of Gouëzel's Isabelle AFP theory
    Ergodic_Theory/Fekete.thy.
- declaration: exists_tendsto_div_of_le_add_const
  informal: If u (m + n) ≤ u m + u n + C for all m, n and u n / n is bounded below, then
    u n / n → L for some L with n L - C ≤ u n for every n.
  source_ref: Upstream Fekete/BoundedDefect.lean; Gouëzel, Isabelle AFP, almost_additive_converges.
- declaration: Supermultiplicative.exists_nonneg_not_tendsto_rpow_inv
  informal: Some nonnegative supermultiplicative sequence u has no limit of u n ^ (1 / n), so
    positivity is needed in the supermultiplicative Fekete lemma.
  source_ref: Upstream Fekete/SupermultiplicativeCounterexample.lean.
