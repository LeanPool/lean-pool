slug: fekete
title: Nearly subadditive sequences and Fekete's lemma beyond Mathlib
summary: Extends Mathlib's Fekete lemma for real sequences on ℕ. Proves the Füredi–Ruzsa window
  theorem (subadditivity only on N ≤ m ≤ n ≤ μm with μ > 1 gives u n / n → -∞ or a real limit,
  identified as an infimum), the de Bruijn–Erdős theorem with a monotone error f satisfying
  ∑ f n / n² < ∞ (extended from f ≥ 0 to errors of any sign), and its sharpness (for monotone
  f ≥ 0 the summability is equivalent to the absence of a nearly f-subadditive sequence with
  u n / n → ∞). Also packages corollaries of Mathlib's Subadditive API (the unbounded case of
  Fekete's lemma, Fekete for superadditive and positive supermultiplicative sequences,
  bounded-defect and almost-additive versions) and a counterexample showing that positivity
  cannot be weakened to nonnegativity for supermultiplicative sequences.
