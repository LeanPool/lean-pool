slug: erdos111-bipartization
title: Linear finite bipartization costs force countable graph colourings
summary: A graph whose every finite subgraph on m vertices can be made bipartite by deleting at
  most C m edges has a proper colouring by natural numbers. Consequently the maximum finite-subgraph
  bipartization cost h_G(n), divided by n, tends to infinity for every graph that is not countably
  colourable, including every graph with chromatic cardinal aleph-one. The development preserves
  finite edge costs, rooted-pattern extension costs, closure chains, probability laws on Boolean
  products, finite minimax, Hilbert-space classes, and colouring along well-founded orders. It
  answers the limit question of Erdős Problem 111; it does not determine the exact growth of h_G.
