main_results:
- declaration: Erdos111.countably_colorable_of_linear
  informal: For any real C, if each finite subgraph H of G has bipartization number at most C
    times its number of vertices, G admits a proper colouring by natural numbers. Vertex types
    may inhabit any universe.
- declaration: Erdos111.tendsto_of_not_countably_colorable
  informal: If G has no proper colouring by natural numbers, h_G(n)/n tends to positive infinity
    along the whole natural-number sequence.
- declaration: Erdos111.erdos_111
  informal: For every graph of chromatic cardinal aleph-one, h_G(n)/n tends to positive infinity.
    Here h_G(n) is the largest number of edge deletions needed to bipartize a subgraph on n vertices.
- declaration: Erdos111.exists_unitVector_classes
  informal: In any real Hilbert space, unit vectors can be partitioned into countably many classes,
    each with a positive lower bound for one plus the inner product of any two vectors in that
    class.
