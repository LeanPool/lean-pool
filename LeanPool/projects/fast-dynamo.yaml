slug: fast-dynamo
title: A fast dynamo with zero topological entropy
summary: >-
  Constructs a Lipschitz divergence-free velocity on the flat three-torus
  that drives uniform exponential growth in the resistive kinematic
  induction equation at small positive diffusivity. The particle flow
  has zero topological entropy and the ideal induction group has
  zero exponential growth rate.
