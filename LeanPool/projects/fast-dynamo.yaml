main_results:
- declaration: FastDynamo.challenge_statement
  informal: >-
    A single velocity yields a uniform positive resistive growth rate with a
    growing real solution, a zero-entropy particle flow and a unique ideal
    solution group of zero exponential growth rate.
- declaration: FastDynamo.main_theorem_strengthened
  informal: The construction supplies explicit velocity regularity, spectral and solution witnesses.
- declaration: FastDynamo.tendstoUniformlyOn_resistiveEvolution_mainIdealGroup
  informal: >-
    For each fixed divergence-free L² datum, as positive diffusivity tends to zero, the resistive
    evolution converges in L² to the ideal group uniformly on bounded intervals of nonnegative time.
