main_results:
- declaration: GrothendieckBessel.main
  informal: Every countable Bessel sequence with bound one in a complex Hilbert space admits
    measurable functions on the unit interval, pointwise bounded by one, whose Lebesgue correlations
    equal its Gram kernel.
- declaration: GrothendieckBessel.countable_unit_interval_realization
  informal: Every complex kernel on a countable index type whose finite quadratic forms are
    Hermitian positive contractions has a bounded measurable realization on the unit interval
    with exactly the prescribed correlations.
- declaration: OlevskiiGram.hasRealConvexDecomposition
  informal: Every finite real symmetric matrix between zero and the identity is a finite convex
    combination of rank-one matrices formed from vectors in the coordinate unit cube.
