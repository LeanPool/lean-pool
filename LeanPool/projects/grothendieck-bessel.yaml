slug: grothendieck-bessel
title: Grothendieck's theorem for Bessel sequences
summary: Every Bessel sequence with bound one in a complex Hilbert space has its Gram kernel
  represented by correlations of measurable functions bounded by one on the unit interval.
  The proof includes real and complex finite matrix decompositions, a Ball--Prodromou argument,
  and a countable moment-measure construction followed by standard Borel realization.
