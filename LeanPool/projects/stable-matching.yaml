slug: stable-matching
title: Stable matching, deferred acceptance and incentives
summary: The marriage model of two-sided matching on finite sets of men and women with strict
  preferences, given by injective rank functions in which `none` is staying single, with
  matchings as partial equivalences. The men-proposing deferred acceptance algorithm of Gale and
  Shapley, run in rounds, reaches a fixed point within |M|·|W| rounds and returns a stable
  matching, so every finite market has one; it is the men-optimal stable matching, and the
  women-proposing algorithm (that of the role swap) is women-optimal and men-pessimal. Stable
  matchings are Pareto efficient, stability is ordinal and invariant under the role swap, and
  the two sides have opposed interests. Conway's lattice theorem is proved (each man taking the
  better, or the worse, of his partners at two stable matchings gives a stable matching, in
  which each woman gets the worse, or the better, of hers), as is the McVitie–Wilson theorem
  that the same agents are single at every stable matching. The Gale–Sotomayor blocking lemma
  gives Roth's weak Pareto optimality of deferred acceptance for the men and the
  Dubins–Freedman–Roth theorem that truth-telling is a dominant strategy for the men; Roth's
  impossibility theorem shows that with at least two men and two women no stable mechanism
  makes truth-telling dominant for every agent. Roth's 2 × 2 market is worked out.
