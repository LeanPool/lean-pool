main_results:
- declaration: LeanPool.StrongSix.M2.strongSixExponentials
  informal: If two complex numbers and three complex numbers are separately linearly independent
    over the algebraic numbers, at least one of their six products lies outside the algebraic-number
    span of one and all logarithms of nonzero algebraic numbers.
- declaration: LeanPool.StrongSix.M2.waldschmidtTheorem1
  informal: For a proper complex linear subspace containing an algebraic subspace and a finite-dimensional
    rational space of algebraic coordinates and logarithms, there is a surjective algebraically
    rational quotient satisfying Waldschmidt's dimension-ratio inequality.
- declaration: LeanPool.StrongSix.M2.multEst_of_isAlgClosed
  informal: Over every algebraically closed field of characteristic zero, sufficiently high
    vanishing along a linear subspace on a finite sumset yields a proper additive-times-torus
    subgroup satisfying the multiplicity, coset-count and bidegree estimate, with constants
    depending only on the ambient dimensions.
