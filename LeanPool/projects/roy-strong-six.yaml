slug: roy-strong-six
title: Roy's strong six exponentials theorem
summary: Proves Roy's strong six exponentials theorem, Waldschmidt's transcendence theorem,
  and the additive-times-torus form of Philippon's multiplicity estimate over algebraically
  closed fields of characteristic zero.
