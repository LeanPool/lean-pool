name: Free runner disk space
description: >-
  Delete preinstalled toolchains Lean Pool never uses (.NET, Android, GHC,
  CodeQL, Swift), freeing about 25 GB. Without this, restoring the Lean
  dependency cache plus the whole-pool build cache (about 8 GB compressed)
  fails with "No space left on device". Run it before the first cache
  restore; Workflow Lint enforces that.
runs:
  using: composite
  steps:
    - name: Delete unused preinstalled toolchains
      shell: bash
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
          /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
        df -h /
