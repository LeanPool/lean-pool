name: Cache maintenance

on:
  schedule:
    - cron: '43 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: cache-maintenance
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    name: Prune superseded main caches
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Retain the newest cache in each known family
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: PYTHONPATH=python python3 -m lean_pool.ci_cache prune --repository "$REPOSITORY"
