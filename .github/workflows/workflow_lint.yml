name: Workflow Lint

on:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main
    paths:
      - '.github/**'
  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      applicable: ${{ steps.scope.outputs.applicable }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.merge_group.base_sha || github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          applicable=true
          if [ "$EVENT" = merge_group ] || [ "$EVENT" = pull_request ]; then
            applicable=false
            if [ "$EVENT" = pull_request ]; then
              files=$(git diff --name-only "$BASE"...HEAD)
            else
              files=$(git diff --name-only "$BASE"..HEAD)
            fi
            if grep -Eq '^\.github/' <<< "$files"; then
              applicable=true
            fi
          fi
          echo "applicable=$applicable" >> "$GITHUB_OUTPUT"
  actionlint:
    needs: scope
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.applicable != 'false')
    runs-on: ubuntu-latest
    name: actionlint
    steps:
      - name: Require successful change classification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.applicable }}
        run: |
          if [ "$SCOPE_RESULT" != success ] || [ "$APPLICABLE" != true ]; then
            echo "::error::Change classification failed; required validation cannot be skipped."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: actionlint
        uses: reviewdog/action-actionlint@e0207a28405ecad11953ba625a95d92f7889572a
        with:
          fail_level: any

  pinned-actions:
    needs: scope
    if: always() && (needs.scope.result != 'success' || needs.scope.outputs.applicable != 'false')
    runs-on: ubuntu-latest
    name: SHA-pinned Actions
    steps:
      - name: Require successful change classification
        env:
          SCOPE_RESULT: ${{ needs.scope.result }}
          APPLICABLE: ${{ needs.scope.outputs.applicable }}
        run: |
          if [ "$SCOPE_RESULT" != success ] || [ "$APPLICABLE" != true ]; then
            echo "::error::Change classification failed; required validation cannot be skipped."
            exit 1
          fi
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Ensure Actions are pinned
        uses: zgosalvez/github-actions-ensure-sha-pinned-actions@fc87bb5b5a97953d987372e74478de634726b3e5
