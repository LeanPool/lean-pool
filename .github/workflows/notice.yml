name: Generated metadata

# Commit generated metadata directly, regenerating if main advances before push.
on:
  push:
    branches: [main]
    paths:
      - 'LeanPool/**'
      - 'NOTICE.extra.yml'
      - 'python/lean_pool/notice.py'
      - 'python/lean_pool/stats.py'
      - 'python/lean_pool/registry.py'
      - '.github/workflows/notice.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: generated-metadata-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    name: Refresh generated metadata
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.REBASE_TOKEN }}
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: true
      - name: Install dependencies
        run: cd python && uv sync --locked
      - name: Commit generated metadata
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in {1..5}; do
            git fetch origin main
            git reset --hard origin/main
            (cd python && uv run python -m lean_pool.stats --repo ..)
            (cd python && uv run python -m lean_pool.notice --repo ..)
            unexpected=$(git diff --name-only | { grep -vE '^(NOTICE|README\.md)$' || true; })
            if [ -n "$unexpected" ]; then
              echo '::error::Metadata generators changed other files.'
              exit 1
            fi
            if git diff --quiet; then
              echo 'Generated metadata is already current.'
              exit 0
            fi
            git add README.md NOTICE
            git commit -m 'Refresh generated project statistics and attribution'
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            if [ "$(git rev-parse HEAD^)" = "$(git rev-parse origin/main)" ]; then
              echo '::error::Metadata push rejected; check REBASE_TOKEN permissions and ruleset bypass.'
              exit 1
            fi
            echo "Main advanced during attempt $attempt; regenerating metadata."
          done
          echo '::error::Main kept advancing; metadata refresh exhausted five attempts.'
          exit 1
