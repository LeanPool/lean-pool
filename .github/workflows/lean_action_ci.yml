name: Lean Action CI
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-pr-build-reuse-measurement-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    name: Measure ${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant: [optimized]
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: '604'
      PR_BRANCH: codex/daily-conway-soifer-20261006
      PR_HEAD: 23898a2188c068af2e06765b62d4d167409dffbf
      PR_BASE: c1de3d5205d5d7e6dc56c61b0f98a3156d81a5d4
      EXPECTED_CACHE: LeanPoolBuild-v1-Linux-1eb8219498492bc6184f5de35bbd360686f87837ec2322ff5699a14400793c1e-a533e16b05c1c4b40f658d851e68a85ec377697e42add1cd4fd59c6346a9ff65
    steps:
      - name: Checkout identical actual PR sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.PR_HEAD }}
          fetch-depth: 0
      - name: Checkout measurement helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          path: measurement-helpers
      - name: Restore identical Lean dependencies
        id: dependencies
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.elan
            .lake/packages
          key: LeanDependencies-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}
          fail-on-cache-miss: true
      - name: Restore exactly the same compiled main cache
        id: pool
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .lake/build
          key: ${{ env.EXPECTED_CACHE }}
          fail-on-cache-miss: true
      - name: Restore identical successful main validation
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: .lake/validation-cache/v1
          key: LeanValidation-v1-Linux-1eb8219498492bc6184f5de35bbd360686f87837ec2322ff5699a14400793c1e-3b4ea89d444dc3141b96a9ec5285e9b434ef9550
          fail-on-cache-miss: true
      - name: Install pinned Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Install uv
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          enable-cache: false
      - name: Install identical Python dependencies
        run: cd python && uv sync --locked
      - name: Restore identical successful PR validation
        run: >-
          PYTHONPATH=python python3 -m lean_pool.ci_validation_artifacts
          --event pull_request --head "$PR_HEAD" --previous-run 37477321705
      - name: Check dependency safety with actual Lean
        if: matrix.variant == 'optimized'
        env:
          LEAN_POOL_REQUIRE_TEST_TOOLCHAIN: '1'
        run: >-
          uv run --project measurement-helpers/python --group test pytest -q
          measurement-helpers/python/tests/test_ci_pr_build.py
          measurement-helpers/python/tests/test_rebase_fastpath.py
      - name: Measure normal build and every quality gate
        env:
          VARIANT: ${{ matrix.variant }}
          BUILD_CACHE_KEY: ${{ steps.pool.outputs.cache-matched-key }}
          DEPENDENCY_CACHE_KEY: ${{ steps.dependencies.outputs.cache-matched-key }}
        run: >-
          PYTHONPATH=measurement-helpers/python uv run --project python python
          measurement-helpers/python/ci_pr_build_benchmark.py
      - name: Retain measurements and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr-build-reuse-${{ matrix.variant }}
          path: benchmark-results/
          retention-days: 14
          if-no-files-found: warn
