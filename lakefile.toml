name = "lean-pool"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["LeanPool"]
requiresModuleSystem = true

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3
# Every warning is a compile error, so local builds fail exactly like CI and a
# cached build can never hide one. Pool files cannot override it: option changes
# are banned by the quality gate.
warningAsError = true

[[require]]
name = "TauCeti"
git = "https://github.com/lyw-ops/TauCeti"
rev = "4705013d2da8bac010289af92000f4a5b8ffca00"

# Keep Mathlib last so its transitive dependency pins take precedence.
[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0"

[[lean_lib]]
name = "LeanPool"
globs = ["LeanPool.*"]
plugins = ["LeanPoolLinters:shared"]

[[lean_lib]]
name = "LeanPoolLinters"
srcDir = "scripts/ci"
roots = ["LeanPoolLinters"]

[[lean_exe]]
name = "mk_all"
root = "ProjectIndexes"
srcDir = "scripts"
